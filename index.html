<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F1EA">
<title>Bio 61</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">

<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#F3F1EA;--surface:#FFFFFF;--sunk:#E9E6DC;--ink:#1C2422;--muted:#5F6B66;--line:#DAD6CA;
 --accent:#2F5BEA;--accent-ink:#FFFFFF;--accent-soft:#E3E9FD;
 --ok:#1F8A5B;--ok-soft:#DDF2E7;--bad:#C2410C;--bad-soft:#FBE6DA;--gold:#B7791F;--gold-soft:#FBEFD9;
 --sans:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
 --serif:"Source Serif 4",Georgia,serif;
 --r:18px;--shadow:0 1px 2px rgba(0,0,0,.05),0 6px 18px rgba(30,40,35,.06);
 color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#121615;--surface:#1B201F;--sunk:#252B29;--ink:#E7ECE9;--muted:#9EABA6;--line:#2E3634;
 --accent:#7D9BFF;--accent-ink:#0E1430;--accent-soft:#1E2747;--ok:#5DD39B;--ok-soft:#163327;--bad:#FF8A5C;--bad-soft:#3A2016;--gold:#F0B65A;--gold-soft:#3A2C14;
 --shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121615;--surface:#1B201F;--sunk:#252B29;--ink:#E7ECE9;--muted:#9EABA6;--line:#2E3634;
 --accent:#7D9BFF;--accent-ink:#0E1430;--accent-soft:#1E2747;--ok:#5DD39B;--ok-soft:#163327;--bad:#FF8A5C;--bad-soft:#3A2016;--gold:#F0B65A;--gold-soft:#3A2C14;--shadow:none;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent}
main{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 96px)}
body.sess main{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px)}
h1,h2,h3{margin:0;line-height:1.15;letter-spacing:-.01em}
h1{font-size:1.75rem;font-weight:800}
h2{font-size:1.35rem;font-weight:800}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
a{color:var(--accent)}
button{font:inherit;color:inherit}
.muted{color:var(--muted)}.small{font-size:.86rem}
.stack>*+*{margin-top:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.panel{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);border:1px solid var(--line)}
.btn{appearance:none;border:0;border-radius:14px;padding:14px 18px;font-weight:700;font-size:1rem;background:var(--accent);color:var(--accent-ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px}
.btn.block{width:100%}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn.ok{background:var(--ok);color:#fff}.btn.bad{background:var(--bad);color:#fff}
.btn.big{min-height:60px;font-size:1.15rem;border-radius:16px}
.btn:active{transform:scale(.98)}
.btn:focus-visible,.opt:focus-visible,.chip:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px;font-size:.82rem;font-weight:700;background:var(--sunk);color:var(--ink);border:0}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.gold{background:var(--gold-soft);color:var(--gold)}.chip.acc{background:var(--accent-soft);color:var(--accent)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
/* hero */
.hero{background:var(--accent);color:var(--accent-ink);border-radius:24px;padding:20px;border:0}
.hero h2{font-size:1.6rem}
.hero .seg{background:rgba(255,255,255,.18)}
.hero .seg button{color:inherit}
.hero .seg button[aria-pressed="true"]{background:var(--accent-ink);color:var(--accent)}
.hero .btn{background:var(--accent-ink);color:var(--accent)}
.hero .mix{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.hero .mix span{background:rgba(255,255,255,.18);border-radius:999px;padding:4px 10px;font-size:.84rem;font-weight:600}
.seg{display:flex;background:var(--sunk);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;padding:10px 4px;border-radius:10px;font-weight:700;cursor:pointer;font-size:.95rem;min-height:44px}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow)}
.tabs2{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 4px;position:sticky;top:0;background:var(--bg);z-index:5}
.tabs2::-webkit-scrollbar{display:none}
.tabs2 button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font-weight:700;min-height:44px;cursor:pointer}
.tabs2 button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* stats */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:var(--shadow)}
.kpi b{display:block;font-size:1.5rem;font-weight:800;line-height:1.1}
.kpi span{font-size:.78rem;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:8px;height:130px;padding-top:18px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.bars .b i{display:block;width:100%;max-width:34px;background:var(--accent);border-radius:6px 6px 2px 2px;min-height:2px}
.bars .b.today i{background:var(--ok)}
.bars .b em{font-style:normal;font-size:.75rem;color:var(--muted)}
.bars .b small{font-size:.75rem;font-weight:700}
.meter{height:10px;background:var(--sunk);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok);border-radius:99px}
.ring{--p:0;width:48px;height:48px;border-radius:50%;flex:none;background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--sunk) 0);display:grid;place-items:center}
.ring span{width:36px;height:36px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:.72rem;font-weight:800}
/* topics */
.tcard{display:flex;gap:12px;align-items:center;text-decoration:none;color:inherit;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.tcard+.tcard{margin-top:8px}
.tcard .tx{flex:1;min-width:0}
.dzh{display:flex;justify-content:space-between;align-items:baseline;margin:22px 2px 10px}
.locked{opacity:.6;padding:12px 14px;border:1px dashed var(--line);border-radius:16px}
/* notes */
.ncard{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.ncard+.ncard{margin-top:10px}
.ncard summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;justify-content:space-between;gap:10px;align-items:center;font-weight:700;font-size:1.05rem;min-height:52px}
.ncard summary::-webkit-details-marker{display:none}
.ncard summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);flex:none;margin-top:-4px;transition:transform .2s}
.ncard[open] summary::after{transform:rotate(-135deg);margin-top:4px}
.ncard .bd{padding:0 16px 14px}
.ncard ul{margin:0;padding:0;list-style:none}
.ncard li{position:relative;padding:7px 0 7px 18px;font-family:var(--serif);font-size:1.05rem;line-height:1.5;border-top:1px solid var(--line)}
.ncard li:first-child{border-top:0}
.ncard li::before{content:"";position:absolute;left:2px;top:17px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.ncard li b{font-family:var(--sans);font-weight:700}
.src{display:inline-block;margin-top:8px;font-size:.78rem;color:var(--muted);text-decoration:none}
a.src{text-decoration:underline;text-decoration-color:var(--line)}
.fig{margin:10px 0 0;background:var(--sunk);border-radius:12px;overflow:hidden;cursor:zoom-in}
.fig img{display:block;width:100%;max-height:260px;object-fit:contain;background:#fff}
.fig figcaption{padding:8px 10px;font-size:.82rem}
/* key tables */
.ktab h3{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.krow{padding:11px 0;border-top:1px solid var(--line)}
.krow:first-of-type{border-top:0}
.krow .k{font-weight:800;font-size:1.02rem}
.krow dl{margin:4px 0 0;display:grid;grid-template-columns:auto 1fr;gap:3px 10px}
.krow dt{font-size:.78rem;color:var(--muted);padding-top:2px;text-transform:uppercase;letter-spacing:.03em;font-weight:600}
.krow dd{margin:0;font-family:var(--serif);font-size:1rem}
.krow.one dd{grid-column:1/-1}
/* figures tab */
.ck{font-family:var(--serif);font-size:1.02rem;line-height:1.5}
.ck p{margin:0 0 10px}.ck p.b{font-family:var(--sans);font-weight:700;font-size:1rem}
.ck p.mine{border-left:3px solid var(--gold);padding-left:8px}
.ck sub,.ck sup{font-size:.7em;line-height:0}
.ckf{margin:4px 0 12px;cursor:zoom-in}
.ckf img{display:block;width:100%;height:auto;background:#fff;border-radius:8px}
.ckans{border-bottom:1.5px dashed var(--line);height:26px;margin:-6px 0 12px}
.ck textarea{min-height:90px;margin-bottom:8px;font-family:var(--serif)}
.cked{border:1px dashed var(--line);border-radius:10px;padding:8px;margin-bottom:8px}
.cked.off img{opacity:.3}
.bk{font-family:var(--serif);font-size:1.02rem;line-height:1.5}
.bk h3{margin:18px 0 6px}.bk h4{margin:16px 0 8px;display:inline-block;background:var(--accent);color:#fff;padding:3px 10px;border-radius:6px;font-size:1rem}
.bk h5{font-family:var(--sans,inherit);font-size:.92rem;margin:12px 0 4px;letter-spacing:.01em}
.bk p{margin:6px 0}.bk ul,.bk ol{margin:6px 0;padding-left:1.3em}.bk li{margin:2px 0}
.bk .def{background:color-mix(in srgb,var(--gold,#e0b84a) 18%,transparent);border-radius:8px;padding:8px 10px}
.bk .ex{font-style:italic;color:var(--muted);border-left:3px solid var(--line);padding-left:8px}
.bk .tag{display:inline-block;font-size:.75rem;font-weight:700;background:var(--ink);color:var(--bg);padding:2px 8px;border-radius:6px}
.bk .ref,.bk .note{font-size:.85rem;color:var(--muted)}
.bk .map{margin:10px 0}.bk .maph{text-align:center;font-weight:700;font-size:.85rem;background:var(--accent);color:#fff;border-radius:8px;padding:4px 8px;margin:0 auto 8px;max-width:fit-content}
.bk .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.bk .box{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--surface)}
.bk .tw{overflow-x:auto;margin:8px 0}.bk table{border-collapse:collapse;font-size:.9rem;min-width:100%}
.bk th,.bk td{border:1px solid var(--line);padding:5px 7px;vertical-align:top;text-align:left}.bk th{background:var(--sunk)}
.bk .pg{font-family:var(--sans,inherit);font-size:.75rem;color:var(--muted);margin-top:18px;border-top:1px solid var(--line);padding-top:6px}
.bk figure{margin:8px 0 12px;cursor:zoom-in}.bk figure img{max-width:100%;height:auto;border-radius:8px;background:var(--sunk)}
.bk figcaption{font-size:.8rem;color:var(--muted);margin-top:3px}
.bk textarea{font-family:ui-monospace,monospace;font-size:.8rem;min-height:110px}
.subnav{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-top:10px}
.subnav a{flex:none;text-decoration:none}
.subnav a[aria-current]{background:var(--accent);color:var(--accent-ink)}
.figs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.figs .fig{margin:0}
.figs .fig img{height:130px;object-fit:cover;object-position:top}
.pages{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pages button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:4px;font-size:.78rem;font-weight:700;cursor:zoom-in}
.pages img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:6px;margin-bottom:3px}
.svgwrap{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;overflow-x:auto}
.svgwrap svg{width:100%;height:auto;min-width:320px}
.s-t{font:700 13px var(--sans);fill:var(--ink)}.s-m{font:400 11.5px var(--sans);fill:var(--muted)}
.s-b{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5}.s-o{fill:var(--ok-soft);stroke:var(--ok);stroke-width:1.5}.s-w{fill:var(--gold-soft);stroke:var(--gold);stroke-width:1.5}
.s-l{stroke:var(--muted);stroke-width:1.5;fill:none}.s-d{stroke:var(--accent);stroke-width:1.5;stroke-dasharray:3 3;fill:none}
/* session */
.sbar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.x{border:0;background:var(--sunk);width:44px;height:44px;border-radius:50%;font-size:1.3rem;cursor:pointer;flex:none}
.prog{flex:1;height:12px;background:var(--sunk);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .3s}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:22px 20px;min-height:250px;display:flex;flex-direction:column;gap:14px}
.qcard .q{font-size:1.35rem;font-weight:700;line-height:1.3}
.qcard .a{font-family:var(--serif);font-size:1.2rem;line-height:1.45;padding-top:14px;border-top:2px dashed var(--line)}
.tap{cursor:pointer}
.flipin{animation:flip .28s ease-out}
@keyframes flip{from{transform:perspective(800px) rotateX(-12deg);opacity:.4}to{transform:none;opacity:1}}
.pop{animation:pop .25s ease-out}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.02)}100%{transform:scale(1)}}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.flipin,.pop,.shake{animation:none}.prog i{transition:none}}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grades .btn{flex-direction:column;gap:0;padding:10px 6px;min-height:64px}
.grades .btn small{font-weight:500;font-size:.75rem;opacity:.85}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 16px;font-size:1.02rem;cursor:pointer;min-height:54px;display:flex;gap:12px;align-items:center}
.opt .l{width:28px;height:28px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-weight:800;font-size:.85rem;flex:none}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}.opt.right .l{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}.opt.wrong .l{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.done{opacity:.45;border-style:dashed}
.pf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pf .opt{justify-content:center;font-weight:800;font-size:1.1rem;min-height:64px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pair .opt{font-size:.92rem;padding:10px 12px;min-height:58px}
.fb{border-radius:16px;padding:14px 16px}
.fb.ok{background:var(--ok-soft)}.fb.bad{background:var(--bad-soft)}
.fb b{display:block;margin-bottom:4px}
.fb p{font-family:var(--serif)}
.blank{display:inline-block;min-width:70px;border-bottom:3px solid var(--accent);text-align:center;color:var(--accent)}
.combo{font-weight:800;color:var(--gold);font-size:.9rem;min-width:44px;text-align:right}
.sumbig{font-size:3.2rem;font-weight:800;line-height:1}
.wl{padding:10px 0;border-top:1px solid var(--line)}
/* task */
textarea{width:100%;min-height:140px;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;background:var(--bg);color:var(--ink)}
.crit{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.crit input{width:22px;height:22px;margin-top:2px;flex:none}
.official{border-left:5px solid var(--ok)}
.back{border:0;background:none;color:var(--accent);font-weight:700;padding:8px 0;cursor:pointer;min-height:44px}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
body.sess nav.tabs{display:none}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 10px;text-decoration:none;color:var(--muted);font-size:.74rem;font-weight:700;position:relative;min-height:56px}
nav.tabs a svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs a[aria-current="page"]{color:var(--accent)}
.badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--bad);color:#fff;border-radius:99px;font-size:.68rem;padding:1px 6px}
/* lightbox */
#lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:50;display:none;flex-direction:column}
#lb.on{display:flex}
#lb .bar{display:flex;gap:8px;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px;color:#fff}
#lb .bar span{flex:1;font-size:.85rem}
#lb .bar button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:700;min-height:44px}
#lb .sc{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center}
#lb img{max-width:100%;max-height:100%}
#lb.zoom .sc{display:block}#lb.zoom img{max-width:none;max-height:none;width:220%}
/* film */
#vb{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:50;display:none;flex-direction:column}
#vb.on{display:flex}
#vb .bar{display:flex;gap:8px;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px;color:#fff}
#vb .bar span{flex:1;font-size:.85rem}
#vb .bar a,#vb .bar button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:700;min-height:44px;font:inherit;font-size:.85rem;text-decoration:none;display:flex;align-items:center}
#vb .sc{flex:1;display:flex;align-items:center;justify-content:center;padding:0 0 env(safe-area-inset-bottom,0px)}
#vb iframe{width:100%;max-width:1100px;aspect-ratio:16/9;max-height:100%;border:0;background:#000}
.status{font-size:.78rem;text-align:center}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<div id="lb" role="dialog" aria-modal="true" aria-label="Podgląd ryciny"><div class="bar"><span id="lbc"></span><button data-on="zoomImg()">Powiększ</button><button data-on="closeImg()">Zamknij</button></div><div class="sc" data-on="zoomImg()"><img id="lbi" alt=""></div></div>
<div id="vb" role="dialog" aria-modal="true" aria-label="Film"><div class="bar"><span id="vbc"></span><a id="vbo" target="_blank" rel="noopener">YouTube ↗</a><button data-on="closeVid()">Zamknij</button></div><div class="sc"><iframe id="vbi" title="Film" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div></div>

const TEMATY=[
{id:"t6",dzial:"d0",name:"Metodyka badań",note:[
["Przedmiot i obiekt badań","Przedmiot badań to zjawisko lub proces, który analizujesz, np. przebieg choroby albo kierunek wzrostu korzenia. Obiekt badań to organizm lub materiał biologiczny, na którym prowadzisz badanie, np. fragment liścia, szczury, siewki fasoli.","v14"],
["Obserwacja i doświadczenie","W obserwacji badacz niczego nie zmienia, tylko opisuje stan faktyczny. W doświadczeniu celowo, w kontrolowanych warunkach, zmienia jeden czynnik, który może wpływać na przedmiot badań.","v14"],
["Etapy badania","1) Zaobserwowanie zjawiska. 2) Problem badawczy – pytanie albo jego równoważnik, np. „Wpływ wody na kiełkowanie nasion pieprzycy”. 3) Hipoteza – możliwa odpowiedź w formie zdania oznajmującego, twierdzącego lub przeczącego. 4) Weryfikacja hipotezy – zaplanowanie prób, przeprowadzenie doświadczenia, zebranie i analiza wyników. 5) Wniosek – oparty bezpośrednio na wynikach, potwierdza albo odrzuca hipotezę.","v14"],
["Schemat X, Y, Z","Problem badawczy: „Czy X wpływa na Y u Z?” albo „Wpływ X na Y u Z”. X to badany czynnik, Y to przedmiot badań, Z to obiekt badań. Hipoteza musi zawierać wszystkie trzy elementy.","v23"],
["Próba badawcza i kontrolna","Próba badawcza jest poddana działaniu badanego czynnika. Próba kontrolna nie jest – służy do sprawdzenia, czy zmiany w próbie badawczej wynikają właśnie z tego czynnika. Obie próby muszą wynikać z problemu badawczego i różnić się tylko badanym czynnikiem.","v15"],
["Kontrola pozytywna i negatywna","W pozytywnej próbie kontrolnej badane zjawisko na pewno zachodzi, w negatywnej na pewno nie. Przy wykrywaniu skrobi w bulwie ziemniaka: pozytywna to zawiesina skrobi, negatywna to woda destylowana.","v15"],
["Wymagania CKE","Problem, hipoteza i wniosek muszą odnosić się do konkretnego doświadczenia opisanego w zadaniu. Ogólna formułka bez nazw z treści zadania nie dostaje punktu.","k23"],
["Obserwacje makro- i mikroskopowe","Makroskopowe dotyczą obiektów większych niż 0,01 mm, widocznych gołym okiem, przez lupę lub lornetkę. Mikroskopowe dotyczą obiektów mniejszych niż 0,01 mm i wymagają mikroskopu. Dalsza część tematu (s. 16–17) czeka na zdjęcia.","v15"]]},
{id:"t7",dzial:"d0",name:"Analiza statystyczna",note:[
["Po co analiza statystyczna","Zbieranie, przetwarzanie i prezentowanie danych pozwala zinterpretować wyniki i wyciągnąć wnioski, które potwierdzają albo odrzucają hipotezę.","v18"],
["Rodzaje zmiennych","Niezależna – zmienia ją badacz (np. temperatura). Zależna – zmienia się pod wpływem niezależnej (np. intensywność fotosyntezy). Jakościowa – opisywana słownie (np. płeć, gatunek). Ilościowa – liczbowa, da się ją uporządkować (np. liczebność populacji).","v18"],
["Tabele","Tytuł zawsze nad tabelą. Jednostki w nagłówku w nawiasie kwadratowym, wtedy liczby w kolumnie są bez jednostek. Liczby zapisuje się z tą samą dokładnością.","v18"],
["Wykresy","Zmienna niezależna zwykle na osi X, zależna na osi Y. Osie podpisane, jednostki w nawiasie kwadratowym, tytuł pod wykresem, legenda przy więcej niż jednej serii danych. Kolumnowy – porównanie wartości pomiarów. Liniowy – tendencja zmian. Kołowy i jednosłupkowy – udział procentowy; w jednosłupkowym oś Y kończy się na 100%.","v19"],
["Minimum, maksimum, dominanta","Minimum i maksimum to najniższa i najwyższa wartość w próbie, a zakres zmienności to przedział między nimi. Dominanta to wartość najczęstsza, występująca więcej niż raz; może być ilościowa lub jakościowa.","v20"],
["Średnie i mediana","Średnia arytmetyczna = suma wartości / liczba pomiarów. Mediana to wartość środkowa po uporządkowaniu danych; przy parzystej liczbie pomiarów to średnia z dwóch środkowych. Średnia ważona = suma (wartość × waga) / suma wag; stosuje się ją, gdy próby mają różną liczebność lub powierzchnię.","v20"],
["Odchylenie standardowe i wąsy","Odchylenie standardowe pokazuje, jak bardzo pomiary odbiegają od średniej: wysokie – rozrzucone, niskie – blisko średniej. Wąsy zakresu zmienności wyznaczają minimum i maksimum. Wąsy odchylenia standardowego nie pokazują zakresu zmienności. Jeśli wąsy SD dwóch prób się pokrywają, przypuszczalnie nie ma między nimi znaczącej różnicy; jeśli się nie pokrywają, przypuszczalnie jest.","v21"]]},
{id:"t1",dzial:"d1",name:"Pierwiastki, wiązania i woda",note:[["Masa i pierwiastki", "Pierwiastki występują w organizmach jako jony albo jako składniki związków nieorganicznych i organicznych. Świeża masa to masa całkowita, sucha – po odparowaniu wody. Pierwiastki biogenne (C, H, O, N, S, P) są głównym składnikiem związków organicznych.", "v26"], ["Makro- i mikroelementy", "Makroelementy: powyżej 0,01% suchej masy komórek – biogenne oraz Ca, Mg, K, Na, Cl. Mikroelementy: poniżej 0,01% – Fe, I, Cu, Co, F, Zn, Mn, Mo, B, Se, Cr.", "v26"], ["Makroelementy (1)", "N – białka, kwasy nukleinowe; niedobór: zaburzenia metabolizmu, zahamowanie wzrostu. P – szkielet, fosfolipidy, fosfoproteiny, kwasy nukleinowe; niedobór: zniekształcenia i łamliwość kości. S – keratyna, koenzym A; niedobór: gorszy stan skóry, włosów i paznokci. Ca – kości i zęby, praca komórek nerwowych i mięśniowych, krzepnięcie krwi, ściana komórkowa roślin; niedobór: krzywica, osteoporoza, próchnica, zaburzenia krzepnięcia, drgawki.", "v26"], ["Makroelementy (2)", "Mg – praca mięśni i nerwów, aktywator enzymów, składnik chlorofilu; niedobór: nadpobudliwość nerwów i mięśni, zaburzenia rytmu serca. K – przewodzenie impulsów, skurcz mięśni, płyny ustrojowe; u roślin aktywator enzymów i uwodnienie komórek. Na – przewodzenie impulsów, płyny ustrojowe; niedobór: utrata pobudliwości nerwów. Cl – równowaga wodno-mineralna, kwas solny w soku żołądkowym.", "v27"], ["Mikroelementy", "Fe – hemoglobina (transport tlenu), mioglobina (magazyn tlenu), enzymy fotosyntezy i oddychania; niedobór: osłabienie, niedokrwistość, zaburzenia rytmu serca. I – hormony tarczycy; niedobór: wole, niedorozwój umysłowy. F – kości i szkliwo; niedobór: próchnica.", "v27"], ["Składniki mineralne", "Zwykle rozpuszczone jako jony; nieliczne nierozpuszczalne, np. węglany i fosforany wapnia w kościach. Funkcje: budulcowa; wpływ na uwodnienie (Ca²⁺ i Mg²⁺ zmniejszają płynność cytozolu, Na⁺ i K⁺ zwiększają); składniki białek; aktywatory enzymów; ruch wody; impulsy nerwowe; utrzymanie pH dzięki buforom wodorowęglanowemu i wodorofosforanowemu.", "v30"], ["Wiązania chemiczne", "Kowalencyjne niespolaryzowane – para elektronów należy po równo do obu atomów (H₂, O₂, N₂, C–C). Kowalencyjne spolaryzowane – para przesunięta do atomu bardziej elektroujemnego (H₂O). Jonowe – przyciąganie kationu i anionu (NaCl).", "v28"], ["Oddziaływania międzycząsteczkowe", "Wiązanie wodorowe – między dodatnim wodorem a ujemnym atomem (zwykle O lub N) innej cząsteczki; np. między cząsteczkami wody i zasadami w kwasach nukleinowych. Siły van der Waalsa – przyciąganie cząsteczek o chwilowej polarności. Oddziaływania hydrofobowe – cząsteczki niepolarne układają się w wodzie tak, by mieć z nią jak najmniej kontaktu.", "v27"], ["Budowa wody", "Tlen połączony z dwoma wodorami wiązaniami kowalencyjnymi spolaryzowanymi pod kątem 104,5°. Tlen ma ładunek δ−, wodory δ+ – cząsteczka jest dipolem i tworzy wiązania wodorowe.", "v28"], ["Właściwości wody i ich znaczenie", "Ciecz w temperaturze pokojowej – środowisko w komórkach i dla organizmów wodnych. Największa gęstość w 4°C, lód lżejszy – chroni głębsze warstwy przed zamarzaniem. Dobry rozpuszczalnik związków polarnych (otoczki hydratacyjne) – środowisko reakcji i transport. Kohezja i adhezja – podnoszenie się wody w kapilarach. Duże napięcie powierzchniowe – nartniki. Wysokie ciepło parowania – chłodzenie przez pot i transpirację. Najwyższe ciepło właściwe – stabilna temperatura. Gęstsza od powietrza – utrzymuje duże organizmy. Mało ściśliwa – turgor.", "v29"], ["Na maturze", "„Wyjaśnij” oznacza: przyczyna, mechanizm i skutek. Sama nazwa właściwości wody nie wystarcza.", "v45"]]},
{id:"t2",dzial:"d1",name:"Związki organiczne i cukry",note:[["Związki organiczne", "Związki węgla. Węgiel jest czterowartościowy i tworzy łańcuchy i pierścienie. O reaktywności decydują grupy funkcyjne: hydroksylowa (–OH), aldehydowa (–CHO), ketonowa (C=O), karboksylowa (–COOH), aminowa (–NH₂).", "v30"], ["Podział sacharydów", "Monosacharydy: 3–10 atomów węgla, grupa karbonylowa i kilka hydroksylowych; rozpuszczalne, osmotycznie czynne. Oligosacharydy: kilka monosacharydów połączonych wiązaniem O-glikozydowym, np. disacharydy. Polisacharydy: polimery wielu monosacharydów; nierozpuszczalne, osmotycznie nieczynne.", "v31"], ["Monosacharydy", "Aldozy mają grupę aldehydową (glukoza), ketozy – ketonową (fruktoza). Według liczby węgli: triozy, tetrozy, pentozy, heksozy. Pentozy i heksozy w roztworze przechodzą między postacią łańcuchową a pierścieniową.", "v31"], ["Znaczenie monosacharydów", "Triozy (aldehyd glicerynowy, dihydroksyaceton) – produkty pośrednie oddychania i fotosyntezy. Ryboza – RNA i ATP. Deoksyryboza – DNA. Glukoza – monomer wielu cukrów, forma transportowa u zwierząt, substrat oddychania. Fruktoza – źródło energii, łatwo przechodzi w glukozę. Galaktoza – składnik laktozy; jej forma utleniona buduje pektyny ściany komórkowej.", "v32"], ["Wiązanie O-glikozydowe", "Łączy dwa cukry przez atom tlenu. Najczęściej 1,4 – między C1 jednej cząsteczki a C4 następnej. Wiązania α rozkładają prawie wszystkie organizmy, β – tylko nieliczne.", "v33"], ["Disacharydy", "Sacharoza = glukoza + fruktoza; forma transportowa cukrów u roślin, zapas w buraku i trzcinie. Laktoza = glukoza + galaktoza; mleko ssaków. Maltoza = glukoza + glukoza; z trawienia skrobi i glikogenu, w nasionach zbóż.", "v33"], ["Polisacharydy", "Nierozpuszczalne, więc pełnią funkcję zapasową lub budulcową. Skrobia: amyloza (nierozgałęziona) + amylopektyna (rozgałęziona); zapas roślin. Glikogen: rozgałęziony; zapas grzybów i zwierząt. Celuloza: nierozgałęziona; ściany roślin i niektórych protistów. Chityna: z glukozaminy; ściany grzybów, oskórek stawonogów.", "v34"], ["Wykrywanie skrobi", "Jodyna (płyn Lugola) barwi skrobię na granatowo. W doświadczeniu z vademecum ziemniak i fasola zabarwiły się, jabłko nie; próbą kontrolną był kleik skrobiowy.", "v34"]]},
{id:"t3",dzial:"d1",name:"Lipidy",note:[["Cechy lipidów", "Głównie C, H i O. Niepolarne – rozpuszczają się w rozpuszczalnikach organicznych (benzen, aceton), nie w wodzie. Mają mniejszą gęstość od wody.", "v35"], ["Podział", "Proste: tłuszcze właściwe (triglicerydy) i woski. Złożone: fosfolipidy i glikolipidy. Izoprenowe: steroidy i karotenoidy.", "v35"], ["Tłuszcze właściwe", "Estry glicerolu i trzech kwasów tłuszczowych. Funkcje: zapasowa, termoizolacyjna, ochronna. Zwierzęce – zwykle stałe, przewaga kwasów nasyconych; roślinne – ciekłe, przewaga nienasyconych (z wiązaniem podwójnym C=C).", "v36"], ["Woski", "Estry alkoholi monohydroksylowych i kwasów tłuszczowych. Funkcje ochronne, izolacyjne, budulcowe. Wosk pszczeli, lanolina, kutykula roślin.", "v36"], ["Lipidy złożone", "Glicerol + 2 kwasy tłuszczowe + grupa hydrofilowa. Fosfolipid: reszta fosforanowa z małym związkiem polarnym (np. choliną). Glikolipid: cukier (np. galaktoza) przyłączony wiązaniem glikozydowym. Hydrofilowa głowa i hydrofobowy ogon – w wodzie same tworzą dwuwarstwę, podstawę błon.", "v36"], ["Funkcje fosfo- i glikolipidów", "Budują błony, są ważnym składnikiem tkanki nerwowej. Glikolipidy wchodzą w skład glikokaliksu, który zwiększa wytrzymałość komórek i umożliwia ich rozpoznawanie.", "v37"], ["Lipidy izoprenowe", "Powstają z izoprenu. Steroidy (pierścieniowe): cholesterol – błony zwierzęce i osłonki nerwów, z niego hormony steroidowe, kwasy żółciowe, witamina D; hormony płciowe (testosteron, estrogeny). Karotenoidy (karoteny, ksantofile): fotosynteza, barwa kwiatów i owoców, prekursory retinalu, antyoksydanty.", "v37"], ["Tłuszcz a glikogen", "Tłuszcze dają więcej energii na jednostkę masy i są magazynowane bez wody.", "k25"], ["Wykrywanie lipidów", "Sudan III barwi tłuszcz na czerwono. W doświadczeniu roztarte nasiona słonecznika zabarwiły się na czerwono; próbą kontrolną była kropla oleju.", "v35"]]},
{id:"t4",dzial:"d1",name:"Aminokwasy i białka",note:[["Aminokwasy", "C, H, O, N; cysteina i metionina także S. Grupa karboksylowa (kwasowa) i aminowa (zasadowa), w aminokwasach białkowych przy tym samym węglu α. Białkowych jest 20; niebiałkowe (ornityna, cytrulina) biorą udział w wytwarzaniu mocznika.", "v37"], ["Aminokwasy egzogenne", "Organizm ich nie wytwarza – muszą być dostarczane z pożywieniem.", "org"], ["Właściwości aminokwasów", "Grupa karboksylowa oddaje proton, aminowa przyjmuje. Zależnie od pH aminokwas jest kationem (niskie pH), jonem obojnaczym albo anionem (wysokie pH). Podział wg podstawnika: kwasowe (asparaginowy, glutaminowy), zasadowe (arginina, histydyna, lizyna), obojętne polarne (np. cysteina, seryna) i niepolarne (np. alanina, glicyna, leucyna).", "v38"], ["Wiązanie peptydowe", "Kowalencyjne spolaryzowane, między grupą karboksylową jednego a aminową drugiego aminokwasu; wydziela się woda. Łańcuch ma koniec N (wolna –NH₂) i koniec C (wolna –COOH). Peptydy: 2–50 aminokwasów, białka: ponad 50.", "v38"], ["Znaczenie peptydów i białek", "Peptydy: wazopresyna (gospodarka wodna), oksytocyna (układ rozrodczy). Białka to ok. 50% suchej masy komórek. Albuminy – ciśnienie osmotyczne i objętość krwi, transport. Globuliny – przeciwciała. Histony – z DNA tworzą chromatynę. Hemoglobina – transport tlenu. Mioglobina – magazyn tlenu w mięśniach. Kolageny – tkanki łączne, wytrzymałość. Keratyny – skóra, włosy, pióra, paznokcie, ochrona.", "v39"], ["Struktura białek", "I – kolejność aminokwasów (wiązania peptydowe). II – α-helisa i β-harmonijka (wiązania wodorowe). III – pofałdowanie łańcucha, kształt białka. IV – dwa lub więcej łańcuchów. III i IV stabilizują: wiązania wodorowe, oddziaływania elektrostatyczne i hydrofobowe, mostki dwusiarczkowe (między grupami –SH cysteiny), siły van der Waalsa.", "v40"], ["Pułapki z matury", "Dowodem struktury IV-rzędowej są co najmniej dwa łańcuchy – sam mostek dwusiarczkowy nie wystarcza. Reszty hydrofobowe są we wnętrzu białka, bo zwija się ono w środowisku wodnym.", "k23"], ["Wysalanie i denaturacja", "Większość białek tworzy z wodą roztwór koloidalny; otoczka wodna zapobiega wytrącaniu. Wysalanie: odwracalne odwodnienie i wytrącenie przez sole metali lekkich (np. sodu). Denaturacja: nieodwracalna zmiana struktury przestrzennej pod wpływem alkoholi, soli metali ciężkich, stężonych kwasów i zasad, wysokiej temperatury.", "v40"], ["Doświadczenie z białkiem jaja", "Temperatura, etanol, H₂SO₄ i NaCl wytrąciły białko. Po dodaniu wody rozpuścił się tylko osad z NaCl – to wysalanie. Pozostałe to denaturacja.", "v43"], ["Rodzaje białek", "Fibrylarne: nierozpuszczalne, budulcowe i ochronne (keratyna, kolagen). Globularne: rozpuszczalne, aktywne metabolicznie (histony, globuliny). Proste: tylko aminokwasy (keratyna, albuminy). Złożone: z częścią niebiałkową – jonem metalu, hemem, cukrem (hemoglobina, mioglobina).", "v43"], ["Wykrywanie białek", "Reakcja biuretowa: niebieski Cu(OH)₂ (z CuSO₄ i NaOH) daje fiolet ze związkami o co najmniej dwóch wiązaniach peptydowych. Im więcej wiązań, tym intensywniejsza barwa.", "v41"]]},
{id:"t5",dzial:"d1",name:"Nukleotydy i kwasy nukleinowe",note:[["Budowa nukleotydu", "Cukier pięciowęglowy (ryboza lub deoksyryboza) + reszta fosforanowa + zasada azotowa (C, T, A, G lub U). Fosforan łączy się z cukrem wiązaniem estrowym, zasada z cukrem – glikozydowym. Nukleozyd to cukier + zasada.", "v44"], ["Zasady azotowe", "Puryny (dwupierścieniowe): guanina, adenina. Pirymidyny (jednopierścieniowe): cytozyna, tymina, uracyl.", "v44"], ["Podział nukleotydów", "Rybonukleotydy: ATP, GTP, CTP, UTP, NAD⁺, FAD. Deoksyrybonukleotydy: dATP, dGTP, dCTP, dTTP. Wg liczby reszt fosforanowych: mono-, di- i trifosforany.", "v44"], ["Funkcje nukleotydów", "Monomery kwasów nukleinowych, nośniki energii (głównie ATP), przenośniki elektronów (NAD⁺, NADP⁺, FAD).", "v44"], ["DNA", "Deoksyryboza, dwie antyrównoległe nici w podwójnej helisie, nukleotydy w nici połączone wiązaniami fosfodiestrowymi. A–T: 2 wiązania wodorowe, G–C: 3. Szczegóły są w vademecum na s. 422.", "kn"], ["RNA", "Ryboza i uracyl zamiast tyminy. mRNA, rRNA i tRNA uczestniczą w syntezie białek.", "knr"], ["ATP", "Adenina + ryboza + 3 reszty fosforanowe; dwa wiązania wysokoenergetyczne między fosforanami. Hydroliza do ADP uwalnia energię.", "atp"]]}];

const FISZKI={"t6": [["Przedmiot badań", "Zjawisko lub proces, które są poddawane analizie, np. przebieg danej choroby.", "v14"], ["Obiekt badań", "Materiał biologiczny lub organizmy, na których są prowadzone badania, np. fragment liścia lub szczury laboratoryjne.", "v14"], ["Obserwacja jako metoda badawcza", "Badacz nie wpływa na przedmiot badania, a jedynie określa stan faktyczny, czyli to, co widać. Może stanowić niezależną metodę badawczą lub być elementem doświadczenia.", "v14"], ["Przykłady obserwacji", "Obserwacja zachowań godowych ptaków w ich naturalnym środowisku, mikroskopowa obserwacja chromosomów.", "v14"], ["Doświadczenie (eksperyment)", "Metoda, w której badacz celowo, w kontrolowanych warunkach, zmienia jeden z czynników wpływających na przedmiot badań.", "v14"], ["Przykłady doświadczeń", "Badanie wpływu światła na wzrost i rozwój pszenicy, badanie aktywności pepsyny w zależności od pH środowiska.", "v14"], ["Etapy badań biologicznych (kolejno)", "1. Zaobserwowanie zjawiska lub procesu, 2. sformułowanie problemu badawczego, 3. postawienie hipotezy, 4. weryfikacja hipotezy, 5. sformułowanie wniosku.", "v14"], ["Zaobserwowanie zjawiska lub procesu (etap 1)", "Zaobserwowanie przez badacza np. nieznanego organizmu czy niewytłumaczonego procesu, np. nasiona pieprzycy siewnej zaczynają kiełkować po umieszczeniu ich na mokrej wacie.", "v14"], ["Problem badawczy – forma", "Zazwyczaj zdanie pytające, na które badacz chce znaleźć odpowiedź podczas doświadczenia, lub równoważnik zdania; określa cel badań.", "v14"], ["Przykład problemu badawczego (pieprzyca siewna)", "„Czy woda pobudza kiełkowanie nasion pieprzycy siewnej?” lub „Wpływ wody na kiełkowanie nasion pieprzycy siewnej”.", "v14"], ["Hipoteza", "Jedna z kilku możliwych odpowiedzi na pytanie sformułowane w problemie badawczym; może mieć formę zdania oznajmującego twierdzącego lub przeczącego.", "v14"], ["Przykład hipotez (pieprzyca siewna)", "„Woda pobudza kiełkowanie nasion pieprzycy siewnej.” lub „Woda nie pobudza kiełkowania nasion pieprzycy siewnej.”", "v14"], ["Weryfikacja hipotezy", "Sprawdzenie prawdziwości hipotezy za pomocą obserwacji lub doświadczenia.", "v14"], ["Co obejmuje weryfikacja hipotezy?", "Zaplanowanie doświadczeń z odpowiednio dużą wielkością prób badawczej i kontrolnej, przeprowadzenie doświadczeń, zebranie wyników (dokumentacja badań, najczęściej tabele lub wykresy) i analizę wyników.", "v14"], ["Próby w doświadczeniu z pieprzycą siewną", "Próba badawcza: 10 nasion na wilgotnej wacie; próba kontrolna: 10 nasion na suchej wacie; po 3 dniach sprawdza się, ile nasion wykiełkowało w każdej próbie.", "v14"], ["Wniosek", "Musi być oparty bezpośrednio na wynikach obserwacji lub doświadczenia; jest potwierdzeniem lub zaprzeczeniem hipotezy.", "v14"], ["Co się dzieje, gdy hipoteza zostanie odrzucona?", "Zwykle są podejmowane dalsze badania i stawiana jest nowa hipoteza.", "v14"], ["Doświadczenie z fasolą: badany czynnik, przedmiot i obiekt badań", "Badany czynnik: jednostronne oświetlenie; przedmiot badań: kierunek wzrostu pędu i korzenia; obiekt badań: siewki fasoli.", "v15"], ["Próba badawcza", "Próba, w której przedmiot badań jest poddany działaniu badanego czynnika (wymienionego w problemie badawczym).", "v15"], ["Próba kontrolna", "Próba, w której przedmiot badań nie jest poddany działaniu badanego czynnika; służy do określenia, czy czynnik badany w doświadczeniu wpływa na wyniki uzyskane w próbie badawczej.", "v15"], ["Próby w doświadczeniu z fasolą", "Badawcza: siewka w słoiku częściowo wyłożonym czarną bibułą, oświetlana przez 5 dni jednokierunkowym światłem (20°C). Kontrolna: taki sam zestaw, ale oświetlany równomiernie i bez czarnej bibuły.", "v15"], ["Czym powinny się różnić próba kontrolna i badawcza?", "Powinny bezpośrednio wynikać z problemu badawczego i różnić się od siebie tylko badanym czynnikiem.", "v15"], ["Jak zaplanować próbę badawczą?", "Tak, aby jej wyniki pozwoliły udzielić odpowiedzi na pytanie zadane w problemie badawczym.", "v15"], ["Jak zaplanować próbę kontrolną?", "Tak, aby jej wyniki umożliwiły odpowiedź na pytanie, czy zmiany, które zaszły w próbie badawczej, wynikają z wpływu badanego czynnika.", "v15"], ["Próba kontrolna pozytywna", "Próba, w której można zaobserwować badane zjawisko lub proces.", "v15"], ["Próba kontrolna negatywna", "Próba, w której nie można zaobserwować badanego zjawiska lub procesu.", "v15"], ["Kontrole przy wykrywaniu skrobi w bulwie ziemniaka", "Próba kontrolna pozytywna: zawiesina skrobi; próba kontrolna negatywna: woda destylowana.", "v15"], ["Obserwacje makroskopowe", "Dotyczą obiektów o wielkości powyżej 0,01 mm, widocznych gołym okiem lub przez lornetkę albo lupę, np. obserwacja ptaków w lesie.", "v15"], ["Obserwacje mikroskopowe", "Dotyczą obiektów o wielkości poniżej 0,01 mm, niewidocznych gołym okiem – konieczne jest użycie mikroskopów, np. obserwacja organelli komórkowych.", "v15"]], "t7": [["Analiza statystyczna", "Zbieranie, przetwarzanie i prezentowanie danych, m.in. wyników badań biologicznych; umożliwia interpretację wyników i wyciąganie wniosków, które są podstawą do potwierdzenia lub odrzucenia hipotezy.", "v18"], ["Podział zmiennych – kryteria", "Ze względu na przebieg doświadczenia: niezależna i zależna; ze względu na skalę wartości: jakościowa i ilościowa.", "v18"], ["Zmienna niezależna", "Jej wartość jest zmieniana przez badacza podczas doświadczenia, np. temperatura, wilgotność.", "v18"], ["Zmienna zależna", "Jej wartość zmienia się pod wpływem zmiennej niezależnej, np. intensywność fotosyntezy.", "v18"], ["Zmienna jakościowa", "Jej wartość jest opisywana słownie, np. płeć, różne rodzaje zachowań organizmów.", "v18"], ["Zmienna ilościowa", "Jej wartość można uporządkować według skali, np. liczebność osobników w danej populacji.", "v18"], ["Do czego służą tabele?", "Umożliwiają zestawienie i uporządkowanie danych zebranych podczas badań biologicznych.", "v18"], ["Tytuł tabeli", "Określa jej zawartość; znajduje się zawsze nad tabelą.", "v18"], ["Nagłówek tabeli", "Zawiera informacje o danych znajdujących się w poszczególnych kolumnach i wierszach.", "v18"], ["Zapis zmiennych w tabeli", "Zmienne jakościowe (np. gatunek) zapisuje się słownie; zmienne ilościowe – liczbami z taką samą dokładnością (np. do dwóch miejsc po przecinku).", "v18"], ["Jednostka w tabeli", "Symbol jednostki można podać w nagłówku w nawiasie kwadratowym – wtedy dane liczbowe w kolumnie nie muszą być nim opatrzone.", "v18"], ["Do czego służą wykresy?", "Pozwalają zwizualizować dane zebrane w tabeli, co ułatwia wyciąganie wniosków.", "v18"], ["Zasady rysowania wykresu kolumnowego i liniowego", "Osie podpisane, jednostki w nawiasie kwadratowym; tytuł tuż pod wykresem; przy więcej niż jednej serii danych – legenda.", "v18"], ["Osie wykresu: zmienna niezależna i zależna", "Wartości zmiennej niezależnej zwykle zaznacza się na osi X, a zmiennej zależnej – na osi Y.", "v19"], ["Wykres kolumnowy (słupkowy) – zastosowanie", "Porównanie wartości pomiarów.", "v19"], ["Wykres liniowy – zastosowanie", "Określenie tendencji, z jaką wartość zmiennej zależnej zmienia się pod wpływem zmiennej niezależnej.", "v19"], ["Wykres kołowy i jednosłupkowy – zastosowanie", "Przedstawianie procentowego udziału poszczególnych elementów w zbiorze danych.", "v19"], ["Wykres kołowy – zasady", "Wszystkie części powinny być podpisane (wartość procentowa i nazwy zmiennych) lub należy dodać odpowiednią legendę.", "v19"], ["Wykres jednosłupkowy – zasady", "Oś Y podpisana i kończąca się na wartości 100%; na słupku warto zapisać wartości procentowe, a obok wykresu umieścić legendę.", "v19"], ["Pobieranie jonów przez korzenie a temperatura (tabela)", "Potas: 10°C – 0,4; 20°C – 0,9; 30°C – 1,1; 40°C – 1,0 j.u. Fosfor: 0,1; 0,3; 0,5; 0,6 j.u. (od 10°C do 40°C).", "v19"], ["Minimum", "Najniższa wartość uzyskana w badanej próbie.", "v20"], ["Maksimum", "Najwyższa wartość uzyskana w badanej próbie.", "v20"], ["Zakres zmienności", "Przedział wartości między minimum a maksimum, np. grubość blaszki liściowej od 93 µm do 176 µm.", "v20"], ["Dominanta", "Wartość najczęstsza w badanej próbie, występująca więcej niż raz; może nią być zmienna ilościowa lub jakościowa.", "v20"], ["Średnia arytmetyczna", "Suma wartości wszystkich pomiarów podzielona przez liczbę pomiarów, np. (60 + 70 + 75 + 88 + 62) / 5 = 71.", "v20"], ["Mediana", "Wartość środkowa w uporządkowanym (od najniższej do najwyższej) szeregu danych.", "v20"], ["Mediana przy nieparzystej i parzystej liczbie pomiarów", "Nieparzysta – wartość środkowa; parzysta – średnia arytmetyczna z dwóch środkowych pomiarów.", "v20"], ["Średnia ważona – kiedy?", "Gdy pewnym obserwacjom chce się nadać większą wagę, np. przy liczeniu średniej z wcześniej obliczonych, nierównocennych średnich (różna liczebność prób lub wielkość powierzchni badawczych).", "v20"], ["Średnia ważona – wzór", "Suma wartości pomiarów pomnożonych przez ich wagi podzielona przez sumę wag, np. (2 × 100 + 3 × 200 + 8 × 500) / 800 = 6 zięb.", "v20"], ["Odchylenie standardowe (σ)", "Określa, w jakim stopniu wyniki pomiarów odbiegają od obliczonej na ich podstawie średniej arytmetycznej.", "v21"], ["Wysoka i niska wartość σ", "Wysoka – wartości pomiarów są oddalone od średniej; niska – wartości pomiarów są zbliżone do średniej.", "v21"], ["Słupki błędu (wąsy)", "Pionowe linie zakończone poprzeczną kreską, odzwierciedlające zróżnicowanie wartości pomiarów w próbie; mogą przedstawiać m.in. zakres zmienności lub odchylenie standardowe.", "v21"], ["Wąsy zakresu zmienności", "Wyznaczają minimum i maksimum – wszystkie wartości pomiarów mieszczą się w przedziale wyznaczonym przez wąs.", "v21"], ["Wąsy odchylenia standardowego", "Pozwalają określić, czy wyniki pomiarów są zbliżone do średniej (od średniej – σ do średniej + σ); nie można na ich podstawie wyznaczyć zakresu zmienności.", "v21"], ["Interpretacja wąsów odchylenia standardowego dwóch prób", "Gdy zakresy wąsów się pokrywają – przypuszczalnie brak znaczących różnic między próbami; gdy się nie pokrywają – przypuszczalnie występują znaczące różnice.", "v21"]], "t1": [["Świeża masa", "Całkowita masa organizmów lub ich części, wyrażona w jednostkach masy, np. w gramach (g).", "v26"], ["Sucha masa", "Masa organizmów lub ich części po wysuszeniu (odparowaniu wody), wyrażona w jednostkach masy, np. w gramach (g).", "v26"], ["W jakiej postaci występują pierwiastki w organizmach?", "W postaci jonów lub jako składniki związków chemicznych – nieorganicznych lub organicznych.", "v26"], ["Pierwiastki biogenne", "Pierwiastki, które stanowią główny składnik związków organicznych: C, H, O, N, S, P.", "v26"], ["Makroelementy", "Pierwiastki, których zawartość w suchej masie komórek wynosi powyżej 0,01%: biogenne (C, H, O, N, S, P) oraz Ca, Mg, K, Na, Cl.", "v26"], ["Mikroelementy", "Pierwiastki, których zawartość w suchej masie komórek wynosi poniżej 0,01%: Fe, I, Cu, Co, F, Zn, Mn, Mo, B, Se, Cr.", "v26"], ["Azot (N) – forma, funkcje, niedobór", "Forma: NO3–, NH4+. Składnik białek i kwasów nukleinowych. Niedobór: zaburzenia metaboliczne związane z niedoborem białek, zahamowanie wzrostu.", "v26"], ["Fosfor (P) – forma, funkcje, niedobór", "Forma: PO43–. Składnik szkieletu, fosfolipidów, fosfoprotein i kwasów nukleinowych. Niedobór: zniekształcenia i zwiększenie łamliwości kości.", "v26"], ["Siarka (S) – forma, funkcje, niedobór", "Forma: SO42–. Składnik keratyny (białka włosów, skóry, paznokci) i koenzymu A. Niedobór: pogorszenie stanu skóry, włosów i paznokci.", "v26"], ["Wapń (Ca) – forma, funkcje", "Forma: Ca2+, CaCO3. Składnik kości i zębów; niezbędny do funkcjonowania komórek nerwowych i mięśniowych; bierze udział w krzepnięciu krwi; składnik ściany komórkowej roślin.", "v26"], ["Objawy niedoboru wapnia", "Krzywica, osteoporoza, próchnica zębów, zaburzenia krzepnięcia krwi, drgawki i silne skurcze mięśni.", "v26"], ["Magnez (Mg) – forma, funkcje, niedobór", "Forma: Mg2+. Niezbędny do działania komórek mięśniowych i nerwowych, aktywator wielu enzymów, składnik chlorofilu. Niedobór: zwiększenie pobudliwości komórek nerwowych i mięśniowych, zaburzenia rytmu serca.", "v26"], ["Potas (K) – forma, funkcje, niedobór", "Forma: K+. Udział w przewodzeniu impulsów nerwowych, wpływ na skurcze mięśni, składnik płynów ustrojowych; u roślin aktywator enzymów i wpływ na uwodnienie komórek. Niedobór: zaburzenia rytmu serca, osłabienie mięśni.", "v27"], ["Sód (Na) – forma, funkcje, niedobór", "Forma: Na+. Udział w przewodzeniu impulsów nerwowych, ważny składnik płynów ustrojowych. Niedobór: utrata pobudliwości komórek nerwowych.", "v27"], ["Chlor (Cl) – forma, funkcje, niedobór", "Forma: Cl–. Odpowiada za równowagę wodno-mineralną, wchodzi w skład kwasu solnego soku żołądkowego. Niedobór: zaburzenia trawienia i gospodarki wodno-mineralnej.", "v27"], ["Żelazo (Fe) – forma, funkcje, niedobór", "Forma: Fe2+. Składnik białek transportujących (hemoglobina) i magazynujących tlen (mioglobina) oraz enzymów fotosyntezy i oddychania tlenowego. Niedobór: osłabienie i niedokrwistość, zaburzenia rytmu serca, zakłócenie oddychania komórkowego.", "v27"], ["Jod (I) – forma, funkcja, niedobór", "Forma: I–. Składnik hormonów tarczycy. Niedobór: powiększenie tarczycy (wole), niedorozwój umysłowy.", "v27"], ["Fluor (F) – forma, funkcja, niedobór", "Forma: F–. Buduje kości, wchodzi w skład szkliwa zębów. Niedobór: próchnica.", "v27"], ["Oddziaływania międzycząsteczkowe", "Przyciąganie lub odpychanie się cząsteczek lub atomów niepołączonych wiązaniami chemicznymi.", "v27"], ["Wiązanie wodorowe", "Powstaje między dodatnio naładowanym atomem wodoru a ujemnie naładowanym atomem (najczęściej tlenem lub azotem) innej cząsteczki; np. między cząsteczkami wody i między zasadami azotowymi w kwasach nukleinowych.", "v27"], ["Siły van der Waalsa", "Przyciąganie sąsiadujących cząsteczek, które zyskują chwilową polarność wskutek zmian rozkładu ładunków elektronów; efekt zależy od odległości między atomami; występują niemal we wszystkich cząsteczkach.", "v27"], ["Oddziaływania hydrofobowe", "Powstają, gdy w środowisku wodnym są cząsteczki niepolarne – układają się one tak, by ich kontakt z wodą był jak najmniejszy (np. woda i tłuszcz).", "v27"], ["Wiązania chemiczne", "Wiązania występujące w obrębie cząsteczki, łączące atomy wchodzące w jej skład.", "v28"], ["Wiązanie kowalencyjne niespolaryzowane", "Uwspólnienie elektronów; para elektronowa należy w jednakowym stopniu do obu atomów. Np. H2, O2, N2 oraz między atomami węgla w związkach organicznych.", "v28"], ["Wiązanie kowalencyjne spolaryzowane", "Uwspólnienie elektronów; para elektronowa jest przesunięta w stronę jądra atomu o większej elektroujemności. Np. w cząsteczce wody (H2O).", "v28"], ["Wiązanie jonowe", "Powstaje w wyniku przyciągania się różnoimiennych jonów – kationów i anionów. Np. w chlorku sodu (NaCl).", "v28"], ["Budowa cząsteczki wody", "Atom tlenu połączony wiązaniami kowalencyjnymi spolaryzowanymi z dwoma atomami wodoru; wiązania O–H tworzą kąt 104,5°.", "v28"], ["Dipol", "Cząsteczka o budowie polarnej (biegunowej) – z rozdziałem ładunków cząstkowych δ+ i δ– na dwa bieguny, np. cząsteczka wody.", "v28"], ["Dlaczego lód ma mniejszą gęstość niż woda ciekła?", "Wraz ze spadkiem temperatury wiązania wodorowe stają się dłuższe i bardziej regularne. Największą gęstość woda ma w 4°C. Lód chroni głębsze warstwy zbiorników przed zamarzaniem.", "v29"], ["Woda jako rozpuszczalnik", "Dobrze rozpuszcza związki polarne – tworzy otoczki wodne (hydratacyjne) wokół jonów i dipoli; jest środowiskiem reakcji i główną substancją transportującą.", "v29"], ["Kohezja", "Wzajemne przyciąganie się cząsteczek wody; zapewnia dużą wytrzymałość słupa wody na rozciąganie.", "v29"], ["Adhezja", "Przyciąganie cząsteczek wody przez powierzchnie naładowane elektrycznie, np. ściany komórkowe roślin. Z kohezją umożliwia podnoszenie się wody w kapilarach wbrew grawitacji.", "v29"], ["Wysokie napięcie powierzchniowe wody", "Na styku woda – powietrze powstaje cienka, sprężysta błonka; mogą się na niej utrzymywać małe organizmy, np. nartniki.", "v29"], ["Wysokie ciepło parowania wody", "Z powodu licznych wiązań wodorowych zmiana stanu z ciekłego na gazowy wymaga dużo energii; ważne w termoregulacji – ochładzanie przy poceniu się i transpiracji.", "v29"], ["Wysokie ciepło właściwe wody", "Najwyższe spośród znanych substancji; zmiana temperatury wymaga dużej ilości energii – zapewnia stabilne warunki i chroni przed nagłymi zmianami temperatury otoczenia.", "v29"], ["Gęstość wody większa niż powietrza i mała ściśliwość – znaczenie", "Większa gęstość pozwala utrzymywać się w wodzie bardzo dużym organizmom (np. wielorybom); mała ściśliwość utrzymuje turgor (jędrność) komórek.", "v29"], ["Postać składników mineralnych w komórce", "Zwykle dobrze rozpuszczalne w wodzie, więc występują jako jony; nieliczne są nierozpuszczalne, np. węglany i fosforany wapnia budujące kości.", "v30"], ["Wpływ jonów na płynność cytozolu", "Ca2+ i Mg2+ zmniejszają płynność cytozolu, a Na+ i K+ ją zwiększają.", "v30"], ["Roztwór buforowy", "Roztwór, który zachowuje stałe stężenie jonów wodorowych (stałe pH) po dodaniu niewielkiej ilości kwasu lub zasady; w płynach ustrojowych tworzą go m.in. jony wodorowęglanowe i wodorofosforanowe(V).", "v30"]], "t2": [["Związki organiczne", "Związki węgla; atomy węgla są zawsze czterowartościowe i mogą łączyć się w łańcuchy lub pierścienie; oprócz węgla zawierają głównie inne pierwiastki biogenne.", "v30"], ["Grupa funkcyjna", "Część dużej cząsteczki, złożona z atomu lub grupy atomów o charakterystycznym zachowaniu chemicznym; odpowiada za reaktywność związku.", "v30"], ["Grupa hydroksylowa", "–OH; występuje w alkoholach (np. alkohol etylowy) i sacharydach (np. glukoza).", "v30"], ["Grupa aldehydowa", "–CHO (grupa karbonylowa); występuje w aldehydach (np. aldehyd octowy) i aldozach (np. glukoza).", "v30"], ["Grupa ketonowa", ">C=O (grupa karbonylowa); występuje w ketonach (np. aceton) i ketozach (np. fruktoza).", "v30"], ["Grupa karboksylowa", "–COOH (niezjonizowana), –COO– (zjonizowana); występuje w kwasach karboksylowych (np. kwas palmitynowy) i aminokwasach (np. alanina).", "v30"], ["Grupa aminowa", "–NH2 (niezjonizowana), –NH3+ (zjonizowana); występuje w aminokwasach (np. alanina), sacharydach (np. chityna) i zasadach azotowych (np. guanina).", "v30"], ["Sacharydy – skład i podział", "Węglowodany zbudowane głównie z C, H i O (niektóre także z N); dzielą się na monosacharydy, oligosacharydy i polisacharydy.", "v31"], ["Monosacharydy – cechy", "Cukry proste o 3–10 atomach węgla; mają grupę karbonylową i kilka grup hydroksylowych; dobrze rozpuszczalne w wodzie, osmotycznie czynne, o odczynie obojętnym.", "v31"], ["Oligosacharydy", "Kilkocukry powstające przez połączenie kilku monosacharydów wiązaniem O-glikozydowym; należą do nich disacharydy – produkty kondensacji 2 cukrów prostych.", "v31"], ["Polisacharydy – cechy", "Polimery z wielu monosacharydów połączonych wiązaniami O-glikozydowymi; nierozpuszczalne w wodzie, bez aktywności osmotycznej.", "v31"], ["Aldozy i ketozy", "Aldozy – monosacharydy z grupą aldehydową (np. glukoza); ketozy – z grupą ketonową (np. fruktoza).", "v31"], ["Podział monosacharydów według liczby atomów węgla", "Triozy (C3), tetrozy (C4), pentozy (C5), heksozy (C6) itd.", "v31"], ["Postaci pentoz i heksoz w roztworze", "Łańcuchowa i pierścieniowa, które wzajemnie w siebie przechodzą.", "v31"], ["Substancje osmotycznie czynne", "Substancje powodujące zachodzenie osmozy; ich najważniejszą cechą jest dobra rozpuszczalność w wodzie.", "v31"], ["Wiązanie O-glikozydowe", "Wiązanie między atomami węgla różnych cząsteczek monosacharydów za pośrednictwem tlenu (mostka tlenowego).", "v31"], ["Polimery", "Złożone związki o dużej masie cząsteczkowej, powstające w reakcji polimeryzacji z monomerów – cząsteczek o małej masie cząsteczkowej.", "v31"], ["Triozy – przykłady i znaczenie", "Aldehyd glicerynowy i dihydroksyaceton; pośrednie produkty szlaków metabolicznych, np. oddychania komórkowego i fotosyntezy.", "v32"], ["Ryboza – znaczenie", "Składnik RNA (odczytywanie informacji genetycznej, nośnik informacji u niektórych wirusów) i wolnych rybonukleotydów będących nośnikami energii (np. ATP).", "v32"], ["Deoksyryboza – znaczenie", "Składnik DNA – nośnika informacji genetycznej organizmów i wielu wirusów.", "v32"], ["Glukoza – znaczenie", "Monomer wielu oligo- i polisacharydów, forma transportowa cukrów u zwierząt, substrat oddychania komórkowego.", "v32"], ["Fruktoza – znaczenie", "Źródło energii, bo łatwo przekształca się w glukozę; wchodzi w skład wielu oligo- i polisacharydów.", "v32"], ["Galaktoza – znaczenie", "Element budulcowy laktozy, składnik niektórych polisacharydów; jej forma utleniona jest składnikiem związków pektynowych ściany komórkowej roślin.", "v32"], ["Wiązanie 1,4-glikozydowe", "Najczęstsze wiązanie O-glikozydowe – między pierwszym atomem węgla (C1) jednej cząsteczki a czwartym (C4) następnej.", "v33"], ["Wiązania α- i β-glikozydowe – różnica", "α-glikozydowe są łatwo rozkładane przez wszystkie organizmy, β-glikozydowe – tylko przez nieliczne. Przykłady: maltoza (1,4-α), celobioza (1,4-β).", "v33"], ["Najważniejsze disacharydy", "Sacharoza (cukier buraczany, trzcinowy), laktoza (cukier mlekowy), maltoza (cukier słodowy).", "v33"], ["Sacharoza", "Glukoza + fruktoza; forma transportowa cukrów u roślin; substancja zapasowa w korzeniu buraka cukrowego i łodydze trzciny cukrowej.", "v33"], ["Laktoza", "Glukoza + galaktoza; składnik mleka ssaków – funkcja odżywcza.", "v33"], ["Maltoza", "Dwie cząsteczki glukozy; powstaje w wyniku trawienia skrobi i glikogenu; występuje w nasionach (głównie zbóż) i owocach.", "v33"], ["Polisacharydy zapasowe i budulcowe", "Zapasowe: skrobia i glikogen; budulcowe: celuloza i chityna. Mogą pełnić te funkcje, bo są nierozpuszczalne w wodzie.", "v33"], ["Skrobia", "Zbudowana z amylozy (łańcuch nierozgałęziony) i amylopektyny (rozgałęziony) z glukozy; materiał zapasowy roślin, np. w nasionach zbóż i bulwach ziemniaków.", "v34"], ["Glikogen", "Rozgałęzione łańcuchy z glukozy; materiał zapasowy grzybów i zwierząt.", "v34"], ["Celuloza", "Nierozgałęzione łańcuchy z glukozy; funkcja budulcowa – składnik ścian komórkowych roślin i niektórych protistów.", "v34"], ["Chityna", "Nierozgałęzione łańcuchy z glukozaminy (glukoza z grupą aminową zamiast jednej hydroksylowej); buduje ściany komórkowe grzybów i oskórek stawonogów.", "v34"], ["Wykrywanie skrobi", "Skrobia po dodaniu jodyny barwi się na granatowo; próbą kontrolną był kleik skrobiowy z jodyną.", "v34"]], "t3": [["Z jakich pierwiastków zbudowana jest większość lipidów?", "Z węgla, wodoru i tlenu.", "v35"], ["Dlaczego lipidy nie rozpuszczają się w wodzie?", "Ich cząsteczki są niepolarne, dlatego rozpuszczają się w rozpuszczalnikach organicznych (niepolarnych), np. benzenie, acetonie, terpentynie, a nie w wodzie.", "v35"], ["Dlaczego lipidy utrzymują się na powierzchni wody?", "Mają gęstość mniejszą od gęstości wody.", "v35"], ["Podział lipidów ze względu na budowę chemiczną", "Lipidy proste (tłuszcze właściwe – triglicerydy, woski), lipidy złożone (fosfolipidy, glikolipidy), lipidy izoprenowe (steroidy, karotenoidy).", "v35"], ["Jakim odczynnikiem wykrywa się lipidy i jaki jest wynik pozytywny?", "Odczynnikiem Sudan III, który barwi tłuszcz na kolor czerwony.", "v35"], ["Wykrywanie lipidów w nasionach słonecznika – próba badawcza i kontrolna", "Próba badawcza: roztarte nasiona słonecznika z Sudanem III; próba kontrolna: kropla oleju z Sudanem III. Obie próby zabarwiły się na czerwono.", "v35"], ["Czym są lipidy proste?", "Estrami alkoholi (mono- lub polihydroksylowych) oraz kwasów karboksylowych.", "v36"], ["Kwasy tłuszczowe", "Kwasy karboksylowe wchodzące w skład tłuszczów właściwych.", "v36"], ["Budowa tłuszczów właściwych (triglicerydów)", "Estry glicerolu (alkoholu trihydroksylowego) i kwasów tłuszczowych – glicerol tworzy wiązania estrowe z trzema cząsteczkami kwasów tłuszczowych.", "v36"], ["Funkcje tłuszczów właściwych", "Głównie zapasowe, termoizolacyjne oraz ochronne.", "v36"], ["Tłuszcze stałe a ciekłe", "Zwierzęta wytwarzają zwykle tłuszcze stałe (przeważają nasycone kwasy tłuszczowe), rośliny – ciekłe (przeważają nienasycone kwasy tłuszczowe).", "v36"], ["Budowa wosków", "Estry alkoholi monohydroksylowych i kwasów tłuszczowych; kwasy tłuszczowe zwykle nasycone, alkohol nasycony lub nienasycony.", "v36"], ["Funkcje wosków", "Głównie ochronne, izolacyjne i budulcowe.", "v36"], ["Przykłady wosków", "Zwierzęce: wosk pszczeli, wosk wełny owczej (lanolina); u roślin woski wchodzą w skład kutykuli.", "v36"], ["Czym są lipidy złożone?", "Estrami glicerolu i kwasów tłuszczowych zawierającymi dodatkowe hydrofilowe grupy pochodzące z innych związków chemicznych (fosfolipidy i glikolipidy).", "v36"], ["Dlaczego lipidy złożone spontanicznie agregują w wodzie?", "Ich cząsteczki mają hydrofilową głowę i hydrofobowy ogon; w wyniku agregacji tworzą podwójne warstwy lipidowe – podstawę wszystkich błon komórkowych.", "v36"], ["Budowa fosfolipidu", "Glicerol zestryfikowany dwiema cząsteczkami kwasów tłuszczowych i jedną cząsteczką kwasu fosforowego(V); reszta fosforanowa łączy się z niewielkim związkiem polarnym, np. choliną.", "v37"], ["Budowa glikolipidu", "Glicerol zestryfikowany dwiema cząsteczkami kwasów tłuszczowych; trzecia grupa hydroksylowa połączona wiązaniem glikozydowym z cukrem, np. galaktozą.", "v37"], ["Funkcje fosfo- i glikolipidów", "Materiał budulcowy błon biologicznych; jeden z głównych składników tkanki nerwowej; glikolipidy wchodzą m.in. w skład glikokaliksu.", "v37"], ["Glikokaliks – rola", "Zwiększa wytrzymałość komórek na czynniki chemiczne i mechaniczne oraz bierze udział w rozpoznawaniu się komórek.", "v37"], ["Lipidy izoprenowe", "Produkty polimeryzacji cząsteczek pięciowęglowego nienasyconego węglowodoru – izoprenu (steroidy i karotenoidy).", "v37"], ["Steroidy – budowa i przykłady", "Mają złożoną strukturę pierścieniową; np. cholesterol, hormony steroidowe (testosteron, estrogeny).", "v37"], ["Funkcje cholesterolu", "Składnik zwierzęcych błon cytoplazmatycznych i osłonek włókien nerwowych; substancja wyjściowa do syntezy m.in. hormonów steroidowych, kwasów żółciowych i witaminy D.", "v37"], ["Funkcja hormonów steroidowych (testosteron, estrogeny)", "Odpowiadają za prawidłowe funkcjonowanie układu rozrodczego.", "v37"], ["Karotenoidy – budowa i przykłady", "Struktura liniowa lub zakończona pierścieniami; czerwone i pomarańczowe karoteny oraz żółte ksantofile.", "v37"], ["Funkcje karotenoidów", "Uczestniczą w fotosyntezie, nadają barwę kwiatom i owocom, są prekursorami wielu związków (np. retinalu) i są antyoksydantami.", "v37"], ["Antyoksydanty", "Związki opóźniające utlenianie różnych substancji przez wolne rodniki powstające w procesach metabolicznych (np. karotenoidy).", "v37"], ["Retinal", "Związek odpowiedzialny za mechanizm widzenia; jego prekursorami są karotenoidy.", "v37"]], "t4": [["Z jakich pierwiastków zbudowane są aminokwasy?", "Z węgla, wodoru, tlenu i azotu; niektóre (cysteina i metionina) zawierają również siarkę.", "v37"], ["Grupy funkcyjne aminokwasów", "Grupa karboksylowa (–COOH) nadająca właściwości kwasowe i grupa aminowa (–NH2) nadająca właściwości zasadowe.", "v37"], ["Węgiel α", "Atom węgla, z którym w aminokwasach białkowych połączone są obie grupy funkcyjne: aminowa i karboksylowa.", "v37"], ["Aminokwasy białkowe", "Aminokwasy, które łącząc się, mogą tworzyć peptydy lub białka; jest ich 20.", "v37"], ["Aminokwasy niebiałkowe – przykłady", "Nie wchodzą w skład białek, np. ornityna i cytrulina uczestniczące w wytwarzaniu mocznika w wątrobie.", "v37"], ["Formy aminokwasów w roztworach wodnych (zależnie od pH)", "Jon obojnaczy (zjonizowane obie grupy), anion (zjonizowana grupa karboksylowa), kation (zjonizowana grupa aminowa).", "v38"], ["Aminokwasy kwasowe", "Kwas asparaginowy i kwas glutaminowy.", "v38"], ["Aminokwasy zasadowe", "Arginina, histydyna, lizyna.", "v38"], ["Aminokwasy obojętne polarne", "Asparagina, cysteina, glutamina, seryna, treonina.", "v38"], ["Aminokwasy obojętne niepolarne", "Alanina, fenyloalanina, glicyna, izoleucyna, leucyna, metionina, prolina, tryptofan, tyrozyna, walina.", "v38"], ["Wiązanie peptydowe", "Wiązanie kowalencyjne spolaryzowane powstające między grupą karboksylową jednego aminokwasu a grupą aminową drugiego (z wydzieleniem cząsteczki wody).", "v38"], ["Końce łańcucha peptydowego", "Koniec N – wolna grupa aminowa; koniec C – wolna grupa karboksylowa.", "v38"], ["Peptydy a białka – liczba aminokwasów", "Peptydy: od 2 do 50 aminokwasów; białka (polipeptydy): ponad 50 aminokwasów.", "v38"], ["Alternatywny podział: oligopeptydy, polipeptydy, białka", "Oligopeptydy 2–10, polipeptydy 11–100, białka powyżej 100 reszt aminokwasowych.", "v38"], ["Główne funkcje peptydów", "Regulacja procesów biochemicznych i przenoszenie informacji między komórkami.", "v39"], ["Wazopresyna", "Peptyd wytwarzany przez neurony podwzgórza i uwalniany przez tylny płat przysadki; reguluje gospodarkę wodną organizmu.", "v39"], ["Oksytocyna", "Peptyd wytwarzany przez neurony podwzgórza i uwalniany przez tylny płat przysadki; wpływa na pracę układu rozrodczego.", "v39"], ["Jaki udział mają białka w suchej masie komórek?", "Ok. 50%.", "v39"], ["Albuminy – funkcje", "Utrzymują ciśnienie osmotyczne krwi, regulują objętość krwi, transportują różne substancje.", "v39"], ["Globuliny – funkcja", "Zwalczają drobnoustroje chorobotwórcze, np. przeciwciała obecne w osoczu krwi.", "v39"], ["Histony – funkcja", "Wspólnie z DNA tworzą chromatynę.", "v39"], ["Hemoglobina a mioglobina", "Hemoglobina transportuje tlen w organizmie; mioglobina magazynuje tlen w mięśniach.", "v39"], ["Kolageny – funkcje", "Składniki tkanek łącznych (skóra, kości, chrząstki, ścięgna); odpowiadają za mechaniczną wytrzymałość tkanek.", "v39"], ["Keratyny – funkcje", "Składniki skóry, włosów, łusek, piór, dziobów, paznokci, pazurów, kopyt i rogów; głównie ochrona przed uszkodzeniami mechanicznymi.", "v39"], ["Dlaczego białka przyjmują różne formy przestrzenne?", "Wiązania peptydowe są sztywne, ale wokół pozostałych wiązań łańcuch może się swobodnie obracać.", "v40"], ["Struktura pierwszorzędowa białka", "Kolejność aminokwasów w łańcuchu peptydowym; stabilizują ją wiązania peptydowe.", "v40"], ["Struktura drugorzędowa białka", "Układ przestrzenny łańcuchów polipeptydowych (α-helisa, β-harmonijka); stabilizują ją wiązania wodorowe.", "v40"], ["Struktura trzeciorzędowa białka", "Powstaje w wyniku pofałdowania łańcucha o strukturze drugorzędowej, określa kształt białka; stabilizują ją wiązania wodorowe, oddziaływania elektrostatyczne i hydrofobowe, mostki dwusiarczkowe, siły van der Waalsa.", "v40"], ["Struktura czwartorzędowa białka", "Dotyczy białek zbudowanych z dwóch lub większej liczby łańcuchów polipeptydowych; stabilizują ją te same oddziaływania co strukturę trzeciorzędową.", "v40"], ["Mostek dwusiarczkowy", "Wiązanie powstające między dwiema grupami –SH cysteiny.", "v40"], ["Roztwór koloidalny białka", "Większość białek tworzy z wodą roztwór koloidalny; otoczka wodna zapobiega łączeniu się białek w większe grupy i wytrącaniu w postaci osadu.", "v40"], ["Wysalanie", "Proces odwracalny – odwodnienie białka i jego wytrącenie z roztworu pod wpływem soli metali lekkich, np. soli sodu.", "v40"], ["Denaturacja", "Proces nieodwracalny – zmiana struktury przestrzennej białka pod wpływem alkoholi, soli metali ciężkich, stężonych kwasów i zasad oraz wysokiej temperatury.", "v40"], ["Odczynnik biuretowy", "Wodorotlenek miedzi(II) Cu(OH)2 o barwie niebieskiej, otrzymany ze zmieszania roztworu CuSO4 z roztworem NaOH.", "v41"], ["Co wykrywa reakcja biuretowa i jaki jest wynik pozytywny?", "Związki mające co najmniej dwa wiązania peptydowe (m.in. białka); powstają związki kompleksowe o fioletowej barwie.", "v41"], ["Dlaczego reakcja biuretowa jest także próbą ilościową?", "Natężenie barwy jest tym większe, im większa jest liczba wiązań peptydowych w badanym związku.", "v41"], ["Wpływ NaCl, etanolu, H2SO4 i temperatury na białko (doświadczenie)", "Temperatura, etanol i stężony kwas – denaturacja (nieodwracalna); chlorek sodu – wysalanie (osad rozpuszcza się po dodaniu wody).", "v43"], ["Białka fibrylarne (włókniste)", "Nie rozpuszczają się w wodzie; pełnią głównie funkcję budulcową i ochronną; np. keratyna i kolagen.", "v43"], ["Białka globularne (kuliste)", "Rozpuszczają się w wodzie lub wodnych roztworach kwasów, zasad i soli; bardzo aktywne metabolicznie (m.in. funkcja katalityczna); np. histony i globuliny.", "v43"], ["Białka proste", "Zbudowane wyłącznie z aminokwasów; np. keratyna, albuminy.", "v43"], ["Białka złożone", "Zbudowane z aminokwasów i składnika niebiałkowego (np. jonu żelaza, hemu, cukru); np. hemoglobina, mioglobina.", "v43"]], "t5": [["Elementy nukleotydu", "Pięciowęglowy cukier (ryboza lub deoksyryboza), reszta fosforanowa(V) i jedna z pięciu zasad azotowych.", "v44"], ["Pięć zasad azotowych w nukleotydach", "Cytozyna (C), tymina (T), adenina (A), guanina (G) i uracyl (U).", "v44"], ["W jakiej postaci występuje reszta fosforanowa(V) w fizjologicznym pH komórek?", "W postaci anionów.", "v44"], ["Po co atomy węgla deoksyrybozy numeruje się ze znakiem prim?", "Aby odróżnić je od atomów węgla występujących w zasadach azotowych.", "v44"], ["Rybonukleotydy a deoksyrybonukleotydy", "Rybonukleotydy zawierają rybozę, deoksyrybonukleotydy – deoksyrybozę.", "v44"], ["Podział nukleotydów ze względu na liczbę reszt fosforanowych(V)", "Trifosforany, difosforany i monofosforany.", "v44"], ["NAD+ – nazwa i dodatkowy element budulcowy", "Dinukleotyd nikotynoamidoadeninowy; zawiera amid kwasu nikotynowego.", "v44"], ["Czym NADP+ różni się od NAD+?", "Fosforan dinukleotydu nikotynoamidoadeninowego (NADP+) zawiera dodatkowo resztę fosforanową.", "v44"], ["FAD – nazwa i dodatkowy element budulcowy", "Dinukleotyd flawinoadeninowy; zawiera ryboflawinę (witaminę B2).", "v44"], ["Przykłady rybonukleotydów", "ATP, GTP, CTP, UTP, NAD+, FAD.", "v44"], ["Przykłady deoksyrybonukleotydów", "dATP, dGTP, dCTP, dTTP.", "v44"], ["ATP", "Adenozynotrifosforan – rybonukleotyd; główny nośnik energii chemicznej w komórkach.", "v44"], ["CTP", "Cytydynotrifosforan – rybonukleotyd.", "v44"], ["UTP", "Urydynotrifosforan – rybonukleotyd.", "v44"], ["dTTP", "Deoksytymidynotrifosforan – deoksyrybonukleotyd.", "v44"], ["dATP", "Deoksyadenozynotrifosforan – deoksyrybonukleotyd.", "v44"], ["dCTP", "Deoksycytydynotrifosforan – deoksyrybonukleotyd.", "v44"], ["Funkcje nukleotydów", "Monomery kwasów nukleinowych; nośniki energii chemicznej (głównie ATP); przenośniki elektronów w szlakach metabolicznych (NAD+, NADP+, FAD).", "v44"], ["Które nukleotydy są przenośnikami elektronów?", "NAD+, NADP+ i FAD.", "v44"], ["Jednostki budulcowe (monomery) kwasów nukleinowych", "Nukleotydy.", "v44"]], "t8": [["Czym jest komórka?", "Podstawową jednostką budulcową i funkcjonalną organizmu, zdolną do wykonywania wszystkich czynności życiowych.", "v48"], ["Organizmy jednokomórkowe – cechy i przykłady", "Są zbudowane tylko z jednej komórki, która wykonuje wszystkie czynności życiowe. Należą do nich bakterie, protisty, grzyby i rośliny pierwotnie wodne.", "v48"], ["Formy kolonijne – czym są i kto je tworzy?", "To zespoły komórek połączonych ze sobą za pomocą ścian komórkowych lub galaretowatych otoczek. Kolonie tworzą bakterie i protisty.", "v48"], ["Organizmy wielokomórkowe plechowe", "Mają ciało niezróżnicowane lub słabo zróżnicowane na tkanki. Należą do nich protisty, grzyby i rośliny pierwotnie wodne.", "v48"], ["Organizmy wielokomórkowe tkankowe", "Mają ciało wyraźnie zróżnicowane na tkanki. Należą do nich rośliny i zwierzęta.", "v48"], ["Dlaczego większość komórek ma niewielkie rozmiary?", "W dużych komórkach stosunek powierzchni do objętości jest mały, przez co możliwości transportu substancji do komórki i w jej obrębie są mniejsze niż zapotrzebowanie na nie.", "v48"], ["Komórka o krawędzi 1 cm a komórka o krawędzi 2 cm – powierzchnia, objętość, stosunek", "1 cm: powierzchnia 6 cm², objętość 1 cm³, stosunek 6 : 1. 2 cm: powierzchnia 24 cm², objętość 8 cm³, stosunek 3 : 1.", "v48"], ["Komórki prokariotyczne (bezjądrowe) – przykłady", "Komórki bakterii i komórki archeowców.", "v48"], ["Komórki eukariotyczne (jądrowe) – przykłady", "Komórki roślinne, komórki zwierzęce, komórki grzybowe.", "v48"], ["Cechy wspólne komórek prokariotycznych i eukariotycznych", "Oddziela je od otoczenia błona komórkowa (często też ściana komórkowa), wnętrze wypełnia cytozol, materiałem genetycznym jest DNA, zawierają rybosomy.", "v49"], ["Ściana komórkowa u prokariontów i eukariontów – z czego?", "Prokarionty: zwykle z peptydoglikanu – mureiny. Eukarionty: z polisacharydów – celulozy u roślin, chityny u grzybów.", "v49"], ["Peptydoglikan", "Związek zbudowany z peptydów i sacharydów (np. mureina).", "v49"], ["Postać DNA u prokariontów i u eukariontów", "Prokarionty: zwykle koliste cząsteczki, bezpośrednio w cytozolu. Eukarionty: zwykle liniowe cząsteczki oddzielone od cytozolu otoczką jądrową.", "v49"], ["System błon śródplazmatycznych – u kogo występuje?", "Nie występuje u prokariontów. U eukariontów liczne błony śródplazmatyczne dzielą komórkę na przedziały (kompartmenty).", "v49"], ["Chromosom bakteryjny", "Koliście zamknięta cząsteczka DNA zawierająca kilkadziesiąt pętli; liczba pętli jest zmienna i zależy m.in. od fazy rozwoju komórki. Pętle stabilizują zasadowe białka niehistonowe.", "v49"], ["Chromosomy eukariotyczne", "Liniowe cząsteczki DNA nawinięte na białka histonowe.", "v49"], ["Nukleosomy", "Powtarzalne struktury tworzone przez białka histonowe i DNA w chromosomach eukariotycznych.", "v49"], ["Rozmiary komórek prokariotycznych i ich cecha charakterystyczna", "Od jednego do kilku mikrometrów; cechą charakterystyczną jest brak jądra komórkowego.", "v49"], ["Wpuklenia błony komórkowej prokariontów – znaczenie", "Zwiększają jej powierzchnię i umożliwiają zachodzenie niektórych procesów, m.in. oddychania tlenowego.", "v49"], ["Ściana komórkowa i błona zewnętrzna bakterii", "U większości bakterii błonę komórkową otacza sztywna ściana komórkowa zbudowana głównie z mureiny. Niektóre bakterie mają na powierzchni ściany dodatkową błonę zewnętrzną.", "v49"], ["Otoczka śluzowa bakterii", "Może otaczać komórkę bakteryjną; jest utworzona zazwyczaj z polisacharydów.", "v49"], ["Rzęski bakterii", "Występują u niektórych bakterii i umożliwiają im aktywny ruch.", "v49"], ["Nukleoid", "Obszar cytozolu komórki bakteryjnej, w którym zlokalizowany jest chromosom bakteryjny.", "v49"], ["Plazmidy", "Małe, koliste cząsteczki DNA w cytozolu komórki bakteryjnej.", "v49"], ["Rybosomy", "Struktury zbudowane z rRNA i białek, uczestniczące w biosyntezie białek.", "v49"], ["Tylakoidy (chromatofory) bakterii", "Struktury zawierające barwniki fotosyntetyczne, umożliwiające fotosyntezę; występują u autotroficznych bakterii fotosyntetyzujących.", "v49"], ["Rozmiary komórek eukariotycznych", "Zwykle 10–100 µm, ale mogą być znacznie większe (np. komórki jajowe ptaków).", "v50"], ["Cechy charakterystyczne komórek eukariotycznych", "Obecność jądra komórkowego oraz system błon śródplazmatycznych tworzących przedziały o różnej budowie i funkcjach.", "v50"], ["Co należy do przedziałów komórkowych?", "Wszystkie organelle oddzielone błonami od cytozolu.", "v50"], ["Komórka zwierzęca – cechy charakterystyczne", "Jest oddzielona od środowiska wyłącznie błoną komórkową, zawiera lizosomy, jej materiałem zapasowym jest głównie glikogen.", "v50"], ["Komórka roślinna – cechy charakterystyczne", "Ściana komórkowa zbudowana głównie z celulozy, duża, centralnie położona wakuola, plastydy (np. chloroplasty); podstawowy materiał zapasowy – skrobia.", "v51"], ["Komórka grzybowa – cechy charakterystyczne", "Ściana komórkowa zbudowana głównie z chityny; podstawowy materiał zapasowy – glikogen.", "v51"]], "t9": [["Jakie błony mają komórki prokariotyczne, a jakie eukariotyczne?", "Prokariotyczne – tylko błonę komórkową; eukariotyczne – błonę komórkową oraz błony śródplazmatyczne.", "v52"], ["Funkcje błon biologicznych", "Są barierami ochronnymi (przed zmianami składu chemicznego, uszkodzeniami mechanicznymi, wnikaniem drobnoustrojów chorobotwórczych), odbierają sygnały z otoczenia i przekazują je do wnętrza, pośredniczą w wymianie substancji między środowiskami, które rozdzielają.", "v52"], ["Kompartmentacja komórki", "Organelle otoczone błonami tworzą system zamkniętych, ale ściśle współpracujących przedziałów (kompartmentów), w których panują odmienne warunki i zachodzą inne, często przeciwstawne procesy metaboliczne.", "v52"], ["Znaczenie przedziałów komórkowych", "Zapewniają rozdział przestrzenny procesów metabolicznych, dzięki czemu komórka funkcjonuje bez zakłóceń. Przedziały różnią się np. pH, od którego zależy m.in. funkcjonowanie enzymów.", "v52"], ["Jak kontaktują się ze sobą przedziały komórki?", "Za pomocą cytozolu lub pęcherzyków transportujących.", "v52"], ["Podstawowe elementy strukturalne błon biologicznych", "Dwuwarstwa fosfolipidowa oraz białka błonowe, głównie lipoproteiny i glikoproteiny.", "v53"], ["Glikokaliks (płaszcz cukrowcowy)", "Tworzą go w komórkach zwierzęcych łańcuchy cukrowe glikolipidów razem z łańcuchami cukrowymi glikoprotein w zewnętrznej warstwie błony komórkowej.", "v53"], ["Cholesterol w błonie komórkowej", "W komórkach zwierzęcych znajduje się między cząsteczkami fosfolipidów i usztywnia błonę (zmniejsza jej płynność).", "v53"], ["Białka integralne", "Mają części hydrofobowe wnikające do wnętrza dwuwarstwy oraz części hydrofilowe kontaktujące się ze środowiskiem wodnym po jednej lub obu stronach błony.", "v53"], ["Białka integralne transbłonowe", "Przebijają dwuwarstwę lipidową i wystają z obu jej stron.", "v53"], ["Białka integralne nieprzebijające błony", "Wnikają tylko do jednej monowarstwy lipidowej.", "v53"], ["Białka powierzchniowe", "Mają właściwości hydrofilowe, nie wnikają więc do dwuwarstwy lipidowej.", "v53"], ["Białka transportujące", "Umożliwiają wymianę substancji między komórką a otoczeniem oraz między przedziałami komórki (np. pompa sodowo-potasowa).", "v53"], ["Białka kotwiczące", "Zwiększają odporność mechaniczną błony (np. spektryna).", "v53"], ["Białka receptorowe", "Odbierają sygnały ze środowiska zewnętrznego lub od innych komórek (np. receptory hormonów peptydowych).", "v53"], ["Białka enzymatyczne", "Przyspieszają przebieg reakcji zachodzących w komórce (np. cyklaza adenylanowa).", "v53"], ["Płynność błony – przyczyna i znaczenie", "Wynika z przemieszczania się fosfolipidów najczęściej w obrębie jednej warstwy, rzadziej między warstwami. Wpływa na przepuszczalność i spójność błony: im płynniejsza błona, tym większa przepuszczalność.", "v54"], ["Od czego zależy stopień płynności błony?", "Od długości łańcuchów węglowodorowych kwasów tłuszczowych (krótsze – większa płynność), liczby wiązań nienasyconych (więcej – większa płynność) i obecności steroidów, np. cholesterolu (zmniejszają płynność).", "v54"], ["Ruch flip-flop", "Ruch fosfolipidów pomiędzy obiema warstwami dwuwarstwy lipidowej (w obrębie jednej warstwy mogą się one obracać i zamieniać miejscami).", "v54"], ["Asymetria błony", "Wynika z innego składu chemicznego warstw lipidowych dwuwarstwy i innego zestawu osadzonych w nich związków, np. glikolipidy i glikoproteiny są charakterystyczne dla zewnętrznej warstwy błon komórek zwierzęcych.", "v54"], ["Funkcje glikokaliksu", "Chroni komórkę przed uszkodzeniami chemicznymi i mechanicznymi oraz odgrywa ważną rolę w rozpoznawaniu się komórek.", "v54"], ["Selektywna przepuszczalność (półprzepuszczalność) błony", "Błona biologiczna może być przepuszczalna dla jednych substancji, a nieprzepuszczalna dla innych.", "v54"], ["Transport bierny", "Jest zgodny z gradientem stężeń, nie wymaga nakładu energii, może zachodzić bezpośrednio przez dwuwarstwę lipidową lub z udziałem białek błonowych.", "v54"], ["Dyfuzja prosta", "Transport bezpośrednio przez dwuwarstwę lipidową (w tym osmoza); tak przenoszone są m.in.
