, "Ksantofil"], "a": 0, "e": "Cholesterol jest substancją wyjściową m.in. do syntezy hormonów steroidowych, kwasów żółciowych i witaminy D.", "src": "v37"}, {"k": "abcd", "q": "Która funkcja karotenoidów jest związana z mechanizmem widzenia?", "o": ["Są prekursorami retinalu", "Są składnikiem osłonek włókien nerwowych", "Nadają barwę kwiatom i owocom", "Są substancją wyjściową do syntezy witaminy D"], "a": 0, "e": "Karotenoidy są prekursorami m.in. retinalu, odpowiedzialnego za mechanizm widzenia. Witamina D powstaje z cholesterolu.", "src": "v37"}, {"k": "luka", "q": "Karotenoidy są antyoksydantami, czyli związkami ___ utlenianie różnych substancji przez wolne rodniki.", "o": ["opóźniającymi", "przyspieszającymi", "katalizującymi", "inicjującymi"], "a": 0, "e": "Antyoksydanty to związki opóźniające utlenianie substancji przez wolne rodniki powstające w procesach metabolicznych.", "src": "v37"}, {"k": "luka", "q": "Wosk wełny owczej nosi nazwę ___.", "o": ["lanolina", "kutykula", "cholina", "galaktoza"], "a": 0, "e": "Do wosków zwierzęcych należy wosk wełny owczej, czyli lanolina. Kutykula to struktura roślinna, w której skład wchodzą woski.", "src": "v36"}, {"k": "luka", "q": "W fosfolipidach reszta fosforanowa łączy się z niewielkim związkiem polarnym, np. ___.", "o": ["choliną", "galaktozą", "glicerolem", "izoprenem"], "a": 0, "e": "Reszta fosforanowa fosfolipidu łączy się np. z choliną; galaktoza występuje w glikolipidach.", "src": "v37"}, {"k": "pf", "q": "Do lipidów złożonych zalicza się fosfolipidy i glikolipidy, a do lipidów izoprenowych – steroidy i karotenoidy.", "a": true, "e": "Zgodnie z podziałem ze względu na budowę chemiczną lipidy złożone to fosfo- i glikolipidy, a izoprenowe – steroidy i karotenoidy.", "src": "v35"}, {"k": "pf", "q": "Kwasy tłuszczowe wchodzące w skład wosków są zwykle nienasycone, natomiast alkohol może być nasycony lub nienasycony.", "a": false, "e": "Kwasy tłuszczowe w woskach są zwykle nasycone; to alkohol może być nasycony lub nienasycony.", "src": "v36"}, {"k": "pf", "q": "Karoteny są żółte, a ksantofile – czerwone i pomarańczowe.", "a": false, "e": "Odwrotnie: karoteny są czerwone i pomarańczowe, a ksantofile – żółte.", "src": "v37"}, {"k": "pf", "q": "Cholesterol jest składnikiem zwierzęcych błon cytoplazmatycznych oraz osłonek włókien nerwowych.", "a": true, "e": "Tak podaje tekst – to jedna z głównych funkcji cholesterolu.", "src": "v37"}, {"k": "para", "q": "Dopasuj lipid do jego głównych funkcji.", "p": [["tłuszcze właściwe", "zapasowe, termoizolacyjne i ochronne"], ["woski", "ochronne, izolacyjne i budulcowe"], ["glikolipidy", "budulec błon, składnik glikokaliksu"], ["hormony steroidowe", "funkcjonowanie układu rozrodczego"]], "src": "v36"}, {"k": "para", "q": "Dopasuj grupę lipidów do jej przedstawiciela.", "p": [["lipidy proste", "wosk pszczeli"], ["lipidy złożone", "fosfolipid z choliną"], ["steroidy", "testosteron"], ["karotenoidy", "ksantofil"]], "src": "v37"}], "t4": [{"k": "abcd", "q": "Które aminokwasy zawierają w cząsteczce siarkę?", "o": ["Cysteina i metionina", "Ornityna i cytrulina", "Lizyna i arginina", "Seryna i treonina"], "a": 0, "e": "Spośród aminokwasów siarkę zawierają cysteina i metionina. Ornityna i cytrulina to aminokwasy niebiałkowe.", "src": "v37"}, {"k": "abcd", "q": "Która grupa funkcyjna nadaje aminokwasom właściwości zasadowe?", "o": ["Grupa aminowa, bo może przyjmować proton", "Grupa karboksylowa, bo może przyjmować proton", "Grupa aminowa, bo może oddawać proton", "Grupa karboksylowa, bo może oddawać proton"], "a": 0, "e": "Grupa aminowa ma charakter zasadowy, ponieważ może przyjmować proton (H+); grupa karboksylowa oddaje proton i nadaje właściwości kwasowe.", "src": "v38"}, {"k": "abcd", "q": "Do czego służą w organizmie aminokwasy niebiałkowe ornityna i cytrulina?", "o": ["Uczestniczą w wytwarzaniu mocznika w wątrobie", "Tworzą mostki dwusiarczkowe w białkach", "Wchodzą w skład hormonów przysadki", "Transportują tlen we krwi"], "a": 0, "e": "Ornityna i cytrulina nie wchodzą w skład białek – uczestniczą w wytwarzaniu mocznika w wątrobie.", "src": "v37"}, {"k": "abcd", "q": "W jakiej formie występuje aminokwas, w którym zjonizowana jest tylko grupa karboksylowa?", "o": ["Anionu", "Kationu", "Jonu obojnaczego", "Cząsteczki niezjonizowanej"], "a": 0, "e": "Gdy zjonizowana jest grupa karboksylowa (oddała proton), aminokwas jest anionem; zjonizowana grupa aminowa daje kation, a obie – jon obojnaczy.", "src": "v38"}, {"k": "abcd", "q": "Między którymi grupami powstaje wiązanie peptydowe?", "o": ["Karboksylową jednego a aminową drugiego aminokwasu", "Aminową jednego a aminową drugiego aminokwasu", "Karboksylową jednego a karboksylową drugiego aminokwasu", "Grupami –SH dwóch reszt cysteiny"], "a": 0, "e": "Wiązanie peptydowe tworzy się między grupą karboksylową jednego aminokwasu a grupą aminową drugiego. Między grupami –SH cysteiny powstaje mostek dwusiarczkowy.", "src": "v38"}, {"k": "abcd", "q": "Ile cząsteczek wody powstaje podczas syntezy tetrapeptydu z czterech aminokwasów?", "o": ["Trzy", "Cztery", "Dwie", "Pięć"], "a": 0, "e": "Każde wiązanie peptydowe powstaje z wydzieleniem jednej cząsteczki wody, a w tetrapeptydzie są trzy wiązania peptydowe.", "src": "v38"}, {"k": "abcd", "q": "Według podziału stosowanego w książce łańcuch zbudowany z 40 aminokwasów to:", "o": ["peptyd", "białko", "polisacharyd", "polinukleotyd"], "a": 0, "e": "Peptydy zawierają od 2 do 50 aminokwasów, a białka – ponad 50.", "src": "v38"}, {"k": "abcd", "q": "Gdzie są wytwarzane wazopresyna i oksytocyna?", "o": ["W neuronach podwzgórza", "W tylnym płacie przysadki", "W przednim płacie przysadki", "W komórkach wątroby"], "a": 0, "e": "Hormony te są wytwarzane przez neurony podwzgórza, a jedynie uwalniane przez tylny płat przysadki mózgowej.", "src": "v39"}, {"k": "abcd", "q": "Które białko magazynuje tlen w mięśniach?", "o": ["Mioglobina", "Hemoglobina", "Albumina", "Globulina"], "a": 0, "e": "Mioglobina magazynuje tlen w mięśniach, a hemoglobina transportuje tlen w organizmie.", "src": "v39"}, {"k": "abcd", "q": "Które oddziaływania stabilizują strukturę drugorzędową białka?", "o": ["Wiązania wodorowe", "Wiązania peptydowe", "Mostki dwusiarczkowe", "Oddziaływania hydrofobowe"], "a": 0, "e": "Według tabeli strukturę drugorzędową (α-helisę, β-harmonijkę) stabilizują wiązania wodorowe; wiązania peptydowe stabilizują strukturę pierwszorzędową.", "src": "v40"}, {"k": "abcd", "q": "Dlaczego cząsteczki białek mogą przyjmować różne formy przestrzenne?", "o": ["Łańcuch obraca się wokół wiązań innych niż peptydowe", "Łańcuch obraca się swobodnie wokół wiązań peptydowych", "Wszystkie wiązania w łańcuchu są sztywne", "Wiązania peptydowe są niespolaryzowane"], "a": 0, "e": "Wiązania peptydowe są sztywne, ale wokół pozostałych wiązań łańcuch może się swobodnie obracać.", "src": "v40"}, {"k": "abcd", "q": "Co zapobiega łączeniu się cząsteczek białka w większe grupy i wytrącaniu się z roztworu koloidalnego?", "o": ["Otoczka wodna wokół cząsteczek białka", "Sztywność wiązań peptydowych", "Obecność mostków dwusiarczkowych", "Sole metali lekkich w roztworze"], "a": 0, "e": "Cząsteczki białka w roztworze koloidalnym są otoczone cząsteczkami wody; ta otoczka zapobiega ich łączeniu i wytrącaniu. Sole metali lekkich powodują wysalanie.", "src": "v40"}, {"k": "abcd", "q": "Która substancja powoduje wysalanie, a nie denaturację białka?", "o": ["Chlorek sodu", "Etanol", "Stężony kwas siarkowy(VI)", "Sól metalu ciężkiego"], "a": 0, "e": "Wysalanie zachodzi pod wpływem soli metali lekkich, np. sodu. Alkohole, stężone kwasy i sole metali ciężkich powodują denaturację.", "src": "v40"}, {"k": "abcd", "q": "W doświadczeniu z białkiem jaja kurzego po dodaniu wody osad rozpuścił się tylko w probówce z chlorkiem sodu. Co to oznacza?", "o": ["Wysalanie jest procesem odwracalnym", "Denaturacja jest procesem odwracalnym", "Chlorek sodu spowodował denaturację białka", "Woda destylowana denaturuje białko"], "a": 0, "e": "Osad wysolonego białka rozpuszcza się w wodzie, a zdenaturowanego – nie; chlorek sodu spowodował odwracalną zmianę, czyli wysalanie.", "src": "v43"}, {"k": "abcd", "q": "Jaką rolę pełniły probówki z wodą destylowaną w doświadczeniu badającym wpływ etanolu, kwasu, soli i temperatury na białko?", "o": ["Były próbą kontrolną", "Były próbą badawczą", "Stanowiły hipotezę", "Stanowiły wynik doświadczenia"], "a": 0, "e": "W próbie kontrolnej zamiast odczynnika dodano wodę destylowaną w tej samej objętości, a jedną probówkę pozostawiono w temperaturze pokojowej.", "src": "v42"}, {"k": "abcd", "q": "Jaki wynik reakcji biuretowej uzyskano w próbie badawczej z białkiem jaja kurzego?", "o": ["Barwa zmieniła się na fioletową", "Barwa zmieniła się na czerwoną", "Barwa pozostała niebieska", "Wytrącił się biały osad"], "a": 0, "e": "Wodorotlenek miedzi(II) tworzy z białkami związki kompleksowe o fioletowej barwie; w próbie kontrolnej z wodą barwa się nie zmieniła.", "src": "v41"}, {"k": "abcd", "q": "Którego związku NIE wykryje odczynnik biuretowy?", "o": ["Dipeptydu", "Tripeptydu", "Kolagenu", "Albuminy"], "a": 0, "e": "Reakcja biuretowa wykrywa związki z co najmniej dwoma wiązaniami peptydowymi, a dipeptyd ma tylko jedno takie wiązanie.", "src": "v41"}, {"k": "abcd", "q": "Która cecha odróżnia białka globularne od fibrylarnych?", "o": ["Rozpuszczają się w wodzie i są aktywne metabolicznie", "Nie rozpuszczają się w wodzie i pełnią funkcję budulcową", "Są zbudowane wyłącznie z aminokwasów", "Zawierają składnik niebiałkowy, np. hem"], "a": 0, "e": "Białka globularne rozpuszczają się w wodzie lub w roztworach kwasów, zasad i soli i są bardzo aktywne metabolicznie; białka fibrylarne są nierozpuszczalne i budulcowe.", "src": "v43"}, {"k": "abcd", "q": "Które białko jest białkiem złożonym?", "o": ["Hemoglobina", "Keratyna", "Albumina", "Kolagen"], "a": 0, "e": "Hemoglobina zawiera składnik niebiałkowy (np. hem z jonem żelaza), więc jest białkiem złożonym; keratyna i albuminy to białka proste.", "src": "v43"}, {"k": "luka", "q": "Mostek dwusiarczkowy to wiązanie powstające między dwiema grupami –SH ___.", "o": ["cysteiny", "metioniny", "seryny", "glicyny"], "a": 0, "e": "Mostki dwusiarczkowe powstają między grupami –SH cysteiny. Metionina też zawiera siarkę, ale tekst wiąże mostki z cysteiną.", "src": "v40"}, {"k": "luka", "q": "Odczynnik biuretowy otrzymuje się, mieszając wodny roztwór siarczanu(VI) miedzi(II) z wodnym roztworem ___.", "o": ["wodorotlenku sodu", "chlorku sodu", "kwasu siarkowego(VI)", "siarczanu(VI) sodu"], "a": 0, "e": "Cu(OH)2 powstaje ze zmieszania roztworu CuSO4 z roztworem NaOH.", "src": "v41"}, {"k": "luka", "q": "Struktura ___ białka określa kolejność aminokwasów w łańcuchu peptydowym.", "o": ["pierwszorzędowa", "drugorzędowa", "trzeciorzędowa", "czwartorzędowa"], "a": 0, "e": "Kolejność aminokwasów to struktura pierwszorzędowa, stabilizowana wiązaniami peptydowymi.", "src": "v40"}, {"k": "luka", "q": "Na końcu C łańcucha peptydowego znajduje się wolna grupa ___.", "o": ["karboksylowa", "aminowa", "hydroksylowa", "sulfhydrylowa"], "a": 0, "e": "Na końcu N jest wolna grupa aminowa, a na końcu C – wolna grupa karboksylowa.", "src": "v38"}, {"k": "pf", "q": "Denaturacja jest procesem odwracalnym, polegającym na odwodnieniu białka i jego wytrąceniu z roztworu.", "a": false, "e": "Tak opisano wysalanie; denaturacja jest procesem nieodwracalnym, związanym ze zmianą struktury przestrzennej białka.", "src": "v40"}, {"k": "pf", "q": "Natężenie fioletowej barwy w reakcji biuretowej jest tym większe, im większa jest liczba wiązań peptydowych w badanym związku.", "a": true, "e": "Dlatego reakcja biuretowa jest próbą jakościową i ilościową.", "src": "v41"}, {"k": "pf", "q": "Histony wspólnie z RNA tworzą chromatynę.", "a": false, "e": "Histony tworzą chromatynę wspólnie z DNA.", "src": "v39"}, {"k": "pf", "q": "Białka stanowią ok. 50% suchej masy komórek.", "a": true, "e": "Tak podaje tekst; są też najbardziej zróżnicowaną grupą związków pod względem budowy i funkcji.", "src": "v39"}, {"k": "para", "q": "Dopasuj białko do jego głównej funkcji.", "p": [["globuliny", "zwalczanie drobnoustrojów chorobotwórczych"], ["hemoglobina", "transport tlenu w organizmie"], ["kolageny", "mechaniczna wytrzymałość tkanek"], ["keratyny", "ochrona przed uszkodzeniami mechanicznymi"]], "src": "v39"}, {"k": "para", "q": "Dopasuj aminokwas do grupy wyróżnionej ze względu na charakter podstawnika.", "p": [["kwas asparaginowy", "kwasowe"], ["arginina", "zasadowe"], ["glutamina", "obojętne polarne"], ["walina", "obojętne niepolarne"]], "src": "v38"}, {"k": "para", "q": "Dopasuj strukturę białka do jej opisu.", "p": [["pierwszorzędowa", "kolejność aminokwasów w łańcuchu"], ["drugorzędowa", "α-helisa lub β-harmonijka"], ["trzeciorzędowa", "pofałdowanie łańcucha określające kształt"], ["czwartorzędowa", "co najmniej dwa łańcuchy polipeptydowe"]], "src": "v40"}], "t5": [{"k": "abcd", "q": "Który zestaw zawiera wyłącznie elementy budowy nukleotydu?", "o": ["Pentoza, reszta fosforanowa(V), zasada azotowa", "Heksoza, reszta fosforanowa(V), zasada azotowa", "Pentoza, reszta fosforanowa(V), aminokwas", "Glicerol, reszta fosforanowa(V), zasada azotowa"], "a": 0, "e": "Nukleotyd składa się z pięciowęglowego cukru (rybozy lub deoksyrybozy), reszty fosforanowej(V) i zasady azotowej.", "src": "v44"}, {"k": "abcd", "q": "Który cukier wchodzi w skład deoksyrybonukleotydów?", "o": ["Deoksyryboza", "Ryboza", "Galaktoza", "Glukoza"], "a": 0, "e": "Nukleotydy z deoksyrybozą to deoksyrybonukleotydy, a z rybozą – rybonukleotydy.", "src": "v44"}, {"k": "abcd", "q": "Dlaczego atomy węgla deoksyrybozy w nukleotydzie numeruje się, dodając znak prim?", "o": ["Aby odróżnić je od atomów węgla zasady azotowej", "Aby odróżnić je od atomów węgla rybozy", "Aby wskazać atomy połączone z resztą fosforanową", "Aby wskazać atomy tworzące wiązania wodorowe"], "a": 0, "e": "Znak prim odróżnia atomy węgla cukru od atomów węgla występujących w zasadach azotowych.", "src": "v44"}, {"k": "abcd", "q": "W jakiej postaci występuje reszta fosforanowa(V) nukleotydów w fizjologicznym pH komórek?", "o": ["Anionów", "Kationów", "Jonów obojnaczych", "Cząsteczek niezjonizowanych"], "a": 0, "e": "Według tekstu reszta fosforanowa(V) w fizjologicznym pH komórek występuje w postaci anionów.", "src": "v44"}, {"k": "abcd", "q": "Który nukleotyd zawiera ryboflawinę (witaminę B2)?", "o": ["FAD", "NAD+", "NADP+", "ATP"], "a": 0, "e": "W dinukleotydzie flawinoadeninowym (FAD) występuje ryboflawina; NAD+ i NADP+ zawierają amid kwasu nikotynowego.", "src": "v44"}, {"k": "abcd", "q": "Czym różni się budowa NADP+ od budowy NAD+?", "o": ["NADP+ zawiera dodatkowo resztę fosforanową", "NADP+ zawiera dodatkowo ryboflawinę", "NADP+ nie zawiera amidu kwasu nikotynowego", "NADP+ zawiera deoksyrybozę zamiast rybozy"], "a": 0, "e": "Fosforan dinukleotydu nikotynoamidoadeninowego (NADP+) ma – oprócz amidu kwasu nikotynowego – również dodatkową resztę fosforanową.", "src": "v44"}, {"k": "abcd", "q": "Który związek należy do deoksyrybonukleotydów?", "o": ["dTTP", "UTP", "CTP", "FAD"], "a": 0, "e": "dTTP (deoksytymidynotrifosforan) zawiera deoksyrybozę; UTP, CTP i FAD to rybonukleotydy.", "src": "v44"}, {"k": "abcd", "q": "Który związek należy do rybonukleotydów?", "o": ["UTP", "dATP", "dCTP", "dTTP"], "a": 0, "e": "UTP (urydynotrifosforan) jest rybonukleotydem; związki z przedrostkiem „d” to deoksyrybonukleotydy.", "src": "v44"}, {"k": "abcd", "q": "Która zasada azotowa występuje w nukleotydach wymienionych jako deoksyrybonukleotydy (dATP, dGTP, dCTP, dTTP), ale nie w rybonukleotydach ATP, GTP, CTP, UTP?", "o": ["Tymina", "Uracyl", "Adenina", "Cytozyna"], "a": 0, "e": "Wśród deoksyrybonukleotydów występuje dTTP z tyminą, a wśród rybonukleotydów – UTP z uracylem; adenina i cytozyna są w obu grupach.", "src": "v44"}, {"k": "abcd", "q": "Która funkcja nukleotydów jest pełniona głównie przez ATP?", "o": ["Nośnik energii chemicznej w komórkach", "Przenośnik elektronów w szlakach metabolicznych", "Składnik dwuwarstwy lipidowej błon", "Prekursor witaminy B2"], "a": 0, "e": "Funkcję nośnika energii chemicznej pełni głównie ATP; przenośnikami elektronów są NAD+, NADP+ i FAD.", "src": "v44"}, {"k": "abcd", "q": "Który zestaw zawiera wyłącznie przenośniki elektronów wymienione w tekście?", "o": ["NAD+, NADP+, FAD", "ATP, GTP, CTP", "NAD+, ATP, dTTP", "FAD, UTP, dATP"], "a": 0, "e": "Przenośnikami elektronów w wielu szlakach metabolicznych są NAD+, NADP+ i FAD.", "src": "v44"}, {"k": "abcd", "q": "Według jakiego kryterium nukleotydy dzieli się na trifosforany, difosforany i monofosforany?", "o": ["Liczby reszt fosforanowych(V)", "Rodzaju cukru w cząsteczce", "Rodzaju zasady azotowej", "Liczby atomów węgla w cukrze"], "a": 0, "e": "Podział na tri-, di- i monofosforany zależy od liczby reszt fosforanowych(V); rodzaj cukru wyznacza podział na rybo- i deoksyrybonukleotydy.", "src": "v44"}, {"k": "luka", "q": "Nukleotydy są jednostkami budulcowymi (monomerami) ___.", "o": ["kwasów nukleinowych", "białek", "polisacharydów", "lipidów złożonych"], "a": 0, "e": "Pierwszą z wymienionych funkcji nukleotydów jest budowanie kwasów nukleinowych.", "src": "v44"}, {"k": "luka", "q": "W dinukleotydzie nikotynoamidoadeninowym (NAD+) występuje ___.", "o": ["amid kwasu nikotynowego", "ryboflawina", "deoksyryboza", "tymina"], "a": 0, "e": "NAD+ zawiera amid kwasu nikotynowego; ryboflawina występuje w FAD.", "src": "v44"}, {"k": "luka", "q": "Nukleotydy zawierające cukier rybozę noszą nazwę ___.", "o": ["rybonukleotydów", "deoksyrybonukleotydów", "dinukleotydów", "monofosforanów"], "a": 0, "e": "Nazwa grupy pochodzi od cukru: ryboza – rybonukleotydy, deoksyryboza – deoksyrybonukleotydy.", "src": "v44"}, {"k": "pf", "q": "W skład nukleotydów może wchodzić jedna z pięciu zasad azotowych: cytozyna, tymina, adenina, guanina lub uracyl.", "a": true, "e": "Tak wymienia tekst w elementach nukleotydu.", "src": "v44"}, {"k": "pf", "q": "FAD, podobnie jak ATP, należy do deoksyrybonukleotydów.", "a": false, "e": "ATP i FAD są wymienione wśród rybonukleotydów.", "src": "v44"}, {"k": "pf", "q": "W nukleotydzie występuje sześciowęglowy cukier – ryboza lub deoksyryboza.", "a": false, "e": "Ryboza i deoksyryboza to cukry pięciowęglowe.", "src": "v44"}, {"k": "pf", "q": "NAD+, NADP+ i FAD są przenośnikami elektronów w wielu szlakach metabolicznych.", "a": true, "e": "Tak podaje tekst w funkcjach nukleotydów.", "src": "v44"}, {"k": "para", "q": "Dopasuj skrót nukleotydu do jego pełnej nazwy.", "p": [["ATP", "adenozynotrifosforan"], ["UTP", "urydynotrifosforan"], ["dCTP", "deoksycytydynotrifosforan"], ["dTTP", "deoksytymidynotrifosforan"]], "src": "v44"}, {"k": "para", "q": "Dopasuj nukleotyd do charakterystycznego dla niego elementu budowy.", "p": [["FAD", "ryboflawina"], ["NAD+", "amid kwasu nikotynowego"], ["dATP", "deoksyryboza"], ["UTP", "uracyl"]], "src": "v44"}], "t8": [{"k": "abcd", "q": "Z czego zbudowana jest głównie ściana komórkowa większości bakterii?", "o": ["z mureiny", "z celulozy", "z chityny", "z glikogenu"], "a": 0, "e": "Ściana komórkowa bakterii jest zbudowana głównie z peptydoglikanu – mureiny. Celuloza buduje ściany roślin, a chityna – grzybów.", "src": "v49"}, {"k": "abcd", "q": "Jaki jest podstawowy materiał zapasowy komórki grzybowej?", "o": ["glikogen", "skrobia", "chityna", "celuloza"], "a": 0, "e": "Grzyby, podobnie jak zwierzęta, magazynują glikogen. Chityna to materiał budulcowy ich ściany komórkowej, a skrobia to materiał zapasowy roślin.", "src": "v51"}, {"k": "abcd", "q": "Jaki jest stosunek powierzchni do objętości sześciennej komórki o krawędzi 2 cm?", "o": ["3 : 1", "6 : 1", "2 : 1", "4 : 1"], "a": 0, "e": "Powierzchnia wynosi 2 × 2 × 6 = 24 cm², a objętość 2 × 2 × 2 = 8 cm³, więc stosunek to 24 : 8 = 3 : 1. Stosunek 6 : 1 dotyczy komórki o krawędzi 1 cm.", "src": "v48"}, {"k": "abcd", "q": "Dlaczego większość komórek ma niewielkie rozmiary?", "o": ["W dużej komórce stosunek powierzchni do objętości jest mały, więc transport substancji nie nadąża za zapotrzebowaniem.", "W dużej komórce stosunek powierzchni do objętości jest duży, więc komórka pobiera więcej substancji, niż potrzebuje.", "W dużej komórce objętość rośnie wolniej niż powierzchnia, więc brakuje miejsca na organelle komórkowe.", "W dużej komórce powierzchnia rośnie szybciej niż objętość, więc błona komórkowa staje się zbyt cienka."], "a": 0, "e": "Wraz ze wzrostem komórki objętość rośnie szybciej niż powierzchnia, więc stosunek powierzchni do objętości maleje i transport substancji jest niewystarczający.", "src": "v48"}, {"k": "abcd", "q": "Która cecha odróżnia komórkę prokariotyczną od komórki eukariotycznej?", "o": ["DNA w postaci kolistych cząsteczek leżących bezpośrednio w cytozolu", "obecność rybosomów uczestniczących w biosyntezie białek", "oddzielenie od otoczenia błoną komórkową", "materiał genetyczny w postaci cząsteczek DNA"], "a": 0, "e": "U prokariontów DNA ma zwykle postać kolistych cząsteczek w cytozolu, a u eukariontów jest oddzielone otoczką jądrową. Rybosomy, błona komórkowa i DNA to cechy wspólne obu typów komórek.", "src": "v49"}, {"k": "abcd", "q": "W jakim obszarze komórki bakteryjnej znajduje się chromosom bakteryjny?", "o": ["w nukleoidzie", "w plazmidzie", "w chromatoforze", "w jądrze komórkowym"], "a": 0, "e": "Chromosom bakteryjny jest zlokalizowany w obszarze cytozolu zwanym nukleoidem. Bakterie nie mają jądra komórkowego, a plazmidy to osobne, małe cząsteczki DNA.", "src": "v49"}, {"k": "abcd", "q": "Co stabilizuje pętle chromosomu bakteryjnego?", "o": ["zasadowe białka niehistonowe", "zasadowe białka histonowe", "nukleosomy zbudowane z histonów", "otoczka zbudowana z polisacharydów"], "a": 0, "e": "Pętle chromosomu bakteryjnego są stabilizowane przez zasadowe białka niehistonowe. Białka histonowe i nukleosomy występują w chromosomach eukariotycznych.", "src": "v49"}, {"k": "abcd", "q": "Które struktury umożliwiają fotosyntezę autotroficznym bakteriom fotosyntetyzującym?", "o": ["tylakoidy (chromatofory)", "chloroplasty", "plazmidy", "nukleoidy"], "a": 0, "e": "U bakterii barwniki fotosyntetyczne znajdują się w tylakoidach (chromatoforach) w cytozolu. Chloroplasty to plastydy komórek eukariotycznych, np. roślinnych.", "src": "v49"}, {"k": "abcd", "q": "Jakie znaczenie mają wpuklenia błony komórkowej komórek prokariotycznych?", "o": ["zwiększają jej powierzchnię i umożliwiają m.in. oddychanie tlenowe", "umożliwiają komórce aktywny ruch w środowisku wodnym", "przechowują dodatkowe, małe i koliste cząsteczki DNA", "tworzą otoczkę śluzową zbudowaną z polisacharydów"], "a": 0, "e": "Wpuklenia błony komórkowej zwiększają jej powierzchnię i umożliwiają zachodzenie niektórych procesów, m.in. oddychania tlenowego. Ruch umożliwiają rzęski, a dodatkowe DNA to plazmidy.", "src": "v49"}, {"k": "abcd", "q": "Której struktury nie ma komórka zwierzęca?", "o": ["ściany komórkowej", "błony komórkowej", "lizosomów", "rybosomów"], "a": 0, "e": "Komórka zwierzęca jest oddzielona od środowiska wyłącznie błoną komórkową. Lizosomy są dla niej charakterystyczne, a rybosomy występują we wszystkich komórkach.", "src": "v50"}, {"k": "abcd", "q": "Które organizmy mają ciało wyraźnie zróżnicowane na tkanki?", "o": ["rośliny i zwierzęta", "protisty i grzyby", "bakterie i protisty", "grzyby i rośliny pierwotnie wodne"], "a": 0, "e": "Organizmy tkankowe to rośliny i zwierzęta. Protisty, grzyby i rośliny pierwotnie wodne to organizmy plechowe, a bakterie i protisty tworzą kolonie.", "src": "v48"}, {"k": "abcd", "q": "Jak nazywa się organizm wielokomórkowy o ciele niezróżnicowanym lub słabo zróżnicowanym na tkanki?", "o": ["plechowy", "tkankowy", "kolonijny", "jednokomórkowy"], "a": 0, "e": "Organizmy plechowe mają ciało niezróżnicowane lub słabo zróżnicowane na tkanki. Forma kolonijna to zespół połączonych komórek, a nie organizm wielokomórkowy.", "src": "v48"}, {"k": "abcd", "q": "Jakie rozmiary zwykle osiągają komórki eukariotyczne?", "o": ["10–100 µm", "1–kilka µm", "0,1–1 µm", "100–1000 µm"], "a": 0, "e": "Komórki eukariotyczne mają zwykle 10–100 µm (choć mogą być znacznie większe, np. komórki jajowe ptaków). Rozmiary od jednego do kilku mikrometrów mają komórki prokariotyczne.", "src": "v50"}, {"k": "abcd", "q": "Co odróżnia chromosom eukariotyczny od chromosomu bakteryjnego?", "o": ["jest liniową cząsteczką DNA nawiniętą na białka histonowe", "jest kolistą cząsteczką DNA nawiniętą na białka histonowe", "jest liniową cząsteczką DNA tworzącą kilkadziesiąt pętli", "jest kolistą cząsteczką DNA stabilizowaną białkami niehistonowymi"], "a": 0, "e": "Chromosom eukariotyczny to liniowa cząsteczka DNA nawinięta na histony (tworzy nukleosomy). Kolistość, pętle i białka niehistonowe charakteryzują chromosom bakteryjny.", "src": "v49"}, {"k": "luka", "q": "Ściana komórkowa komórki grzybowej jest zbudowana głównie z ___.", "o": ["chityny", "celulozy", "mureiny", "glikogenu"], "a": 0, "e": "Ściana komórkowa grzybów zbudowana jest głównie z chityny, roślin – z celulozy, a bakterii – z mureiny.", "src": "v51"}, {"k": "luka", "q": "Małe, koliste cząsteczki DNA występujące w cytozolu komórki bakteryjnej poza chromosomem to ___.", "o": ["plazmidy", "nukleoidy", "nukleosomy", "chromatofory"], "a": 0, "e": "Plazmidy to małe, koliste cząsteczki DNA. Nukleoid to obszar cytozolu z chromosomem bakteryjnym, a nukleosomy występują u eukariontów.", "src": "v49"}, {"k": "luka", "q": "DNA i białka histonowe w chromosomach eukariotycznych tworzą powtarzalne struktury nazywane ___.", "o": ["nukleosomami", "nukleoidami", "plazmidami", "rybosomami"], "a": 0, "e": "Białka histonowe i DNA tworzą nukleosomy. Nukleoid to obszar cytozolu bakterii, w którym leży chromosom bakteryjny.", "src": "v49"}, {"k": "pf", "q": "Liczba pętli chromosomu bakteryjnego jest stała i nie zależy od fazy rozwoju komórki.", "a": false, "e": "Liczba pętli chromosomu bakteryjnego jest zmienna i zależy m.in. od fazy rozwoju komórki.", "src": "v49"}, {"k": "pf", "q": "Komórka bakteryjna może być otoczona otoczką śluzową utworzoną zazwyczaj z polisacharydów.", "a": true, "e": "Tak – otoczka śluzowa bakterii jest zazwyczaj utworzona z polisacharydów.", "src": "v49"}, {"k": "pf", "q": "Podstawowym materiałem zapasowym komórki roślinnej jest glikogen.", "a": false, "e": "Podstawowym materiałem zapasowym komórki roślinnej jest skrobia; glikogen gromadzą komórki zwierzęce i grzybowe.", "src": "v51"}, {"k": "pf", "q": "Do przedziałów komórkowych należą wszystkie organelle oddzielone błonami od cytozolu.", "a": true, "e": "Tak – przedziały komórkowe tworzą wszystkie organelle oddzielone błonami od cytozolu.", "src": "v50"}, {"k": "para", "q": "Dopasuj komórkę do głównego składnika jej ściany komórkowej.", "p": [["komórka bakteryjna", "mureina"], ["komórka roślinna", "celuloza"], ["komórka grzybowa", "chityna"], ["komórka zwierzęca", "brak ściany komórkowej"]], "src": "v49"}, {"k": "para", "q": "Dopasuj strukturę komórki bakteryjnej do jej funkcji lub opisu.", "p": [["rzęska", "umożliwia aktywny ruch"], ["rybosom", "uczestniczy w biosyntezie białek"], ["tylakoid (chromatofor)", "umożliwia zachodzenie fotosyntezy"], ["nukleoid", "zawiera chromosom bakteryjny"]], "src": "v49"}], "t9": [{"k": "abcd", "q": "Które białko błonowe jest przykładem białka kotwiczącego?", "o": ["spektryna", "pompa sodowo-potasowa", "cyklaza adenylanowa", "receptor hormonu peptydowego"], "a": 0, "e": "Białka kotwiczące zwiększają odporność mechaniczną błony – przykładem jest spektryna. Pompa sodowo-potasowa to białko transportujące, a cyklaza adenylanowa – enzymatyczne.", "src": "v53"}, {"k": "abcd", "q": "Do której grupy białek błonowych należy cyklaza adenylanowa?", "o": ["enzymatycznych", "transportujących", "kotwiczących", "receptorowych"], "a": 0, "e": "Cyklaza adenylanowa przyspiesza przebieg reakcji w komórce, więc jest białkiem enzymatycznym.", "src": "v53"}, {"k": "abcd", "q": "Która cecha odróżnia białka powierzchniowe od białek integralnych?", "o": ["nie wnikają do dwuwarstwy lipidowej, bo mają właściwości hydrofilowe", "przebijają dwuwarstwę lipidową i wystają z obu jej stron", "wnikają tylko do jednej monowarstwy lipidowej błony", "mają części hydrofobowe wnikające do wnętrza dwuwarstwy"], "a": 0, "e": "Białka powierzchniowe są hydrofilowe i nie wnikają do dwuwarstwy. Pozostałe opisy dotyczą białek integralnych (transbłonowych lub nieprzebijających błony).", "src": "v53"}, {"k": "abcd", "q": "Która zmiana w składzie błony zwiększy jej płynność?", "o": ["skrócenie łańcuchów węglowodorowych kwasów tłuszczowych", "wydłużenie łańcuchów węglowodorowych kwasów tłuszczowych", "zmniejszenie liczby wiązań nienasyconych w łańcuchach", "zwiększenie zawartości cholesterolu między fosfolipidami"], "a": 0, "e": "Im krótsze łańcuchy i im więcej wiązań nienasyconych, tym płynniejsza błona; cholesterol zmniejsza płynność.", "src": "v54"}, {"k": "abcd", "q": "Co tworzy glikokaliks komórek zwierzęcych?", "o": ["łańcuchy cukrowe glikolipidów i glikoprotein", "łańcuchy cukrowe glikolipidów i lipoprotein", "cząsteczki cholesterolu i fosfolipidów", "cząsteczki spektryny i glikoprotein"], "a": 0, "e": "Glikokaliks (płaszcz cukrowcowy) tworzą łańcuchy cukrowe glikolipidów razem z łańcuchami cukrowymi glikoprotein.", "src": "v53"}, {"k": "abcd", "q": "Z czego wynika asymetria błony biologicznej?", "o": ["z innego składu chemicznego obu warstw lipidowych i osadzonych w nich związków", "z przemieszczania się fosfolipidów najczęściej w obrębie jednej warstwy lipidowej", "z obecności cząsteczek cholesterolu między cząsteczkami fosfolipidów", "z przepuszczalności błony dla jednych substancji i nieprzepuszczalności dla innych"], "a": 0, "e": "Asymetria wynika z różnego składu warstw dwuwarstwy. Przemieszczanie się fosfolipidów to przyczyna płynności, a przepuszczalność dla wybranych substancji to selektywna przepuszczalność.", "src": "v54"}, {"k": "abcd", "q": "Czym jest spowodowana płynność błony biologicznej?", "o": ["przemieszczaniem się fosfolipidów najczęściej w obrębie jednej warstwy", "przemieszczaniem się fosfolipidów najczęściej pomiędzy obiema warstwami", "obecnością cząsteczek cholesterolu między cząsteczkami fosfolipidów", "obecnością glikolipidów w zewnętrznej warstwie błony komórkowej"], "a": 0, "e": "Fosfolipidy przemieszczają się najczęściej w obrębie jednej warstwy, a rzadziej – między warstwami (ruch flip-flop). Cholesterol zmniejsza płynność.", "src": "v54"}, {"k": "abcd", "q": "W jaki sposób przez błonę biologiczną transportowane są małe cząsteczki niepolarne, np. O₂ i CO₂?", "o": ["przez dyfuzję prostą", "przez dyfuzję ułatwioną", "przez transport czynny", "przez pinocytozę"], "a": 0, "e": "Małe cząsteczki niepolarne przenikają bezpośrednio przez dwuwarstwę lipidową, czyli na drodze dyfuzji prostej, bez udziału białek.", "src": "v54"}, {"k": "abcd", "q": "Która cecha odróżnia transport czynny od dyfuzji ułatwionej?", "o": ["zachodzi wbrew gradientowi stężeń i wymaga nakładu energii", "zachodzi z udziałem białek nośnikowych osadzonych w błonie", "zachodzi zgodnie z gradientem stężeń bez nakładu energii", "zachodzi bezpośrednio przez dwuwarstwę lipidową błony"], "a": 0, "e": "Oba rodzaje transportu mogą wykorzystywać białka nośnikowe, ale tylko transport czynny przebiega wbrew gradientowi stężeń i wymaga energii.", "src": "v54"}, {"k": "abcd", "q": "Białko błonowe przenosi jednocześnie dwie substancje, ale w przeciwnych kierunkach. Jaki to rodzaj transportu?", "o": ["antyport", "symport", "dyfuzja ułatwiona", "dyfuzja prosta"], "a": 0, "e": "W antyporcie cząsteczki są transportowane w przeciwnych kierunkach, a w symporcie – w tym samym kierunku.", "src": "v55"}, {"k": "abcd", "q": "W jakim kierunku przemieszcza się woda podczas osmozy?", "o": ["z roztworu hipotonicznego do hipertonicznego", "z roztworu hipertonicznego do hipotonicznego", "z roztworu izotonicznego do hipotonicznego", "z roztworu hipertonicznego do izotonicznego"], "a": 0, "e": "Woda przenika z roztworu o mniejszym stężeniu substancji rozpuszczonych (hipotonicznego) do roztworu o większym stężeniu (hipertonicznego).", "src": "v55"}, {"k": "abcd", "q": "Co się stanie z erytrocytem umieszczonym w roztworze hipotonicznym?", "o": ["pobierze wodę, napęcznieje i ostatecznie pęknie", "odda wodę, skurczy się i ostatecznie rozpadnie", "pobierze wodę aż do stanu maksymalnej jędrności", "wymieni z otoczeniem jednakową ilość wody"], "a": 0, "e": "W roztworze hipotonicznym erytrocyt pobiera wodę, pęcznieje i pęka. Stan maksymalnej jędrności osiąga komórka roślinna, chroniona przez ścianę komórkową.", "src": "v56"}, {"k": "abcd", "q": "Dlaczego komórka miękiszowa umieszczona w roztworze hipotonicznym nie pęka?", "o": ["sztywna ściana komórkowa nie pozwala jej pobierać wody ponad stan maksymalnej jędrności", "błona komórkowa komórki roślinnej jest całkowicie nieprzepuszczalna dla cząsteczek wody", "duża wakuola oddaje do otoczenia całą wodę, którą komórka pobrała z roztworu", "cząsteczki cholesterolu usztywniają błonę komórkową i zapobiegają jej rozciąganiu"], "a": 0, "e": "Komórka roślinna pobiera wodę do stanu maksymalnej jędrności, a potem przestaje, bo nie pozwala na to sztywna ściana komórkowa. Usztywnianie błony przez cholesterol podręcznik opisuje dla komórek zwierzęcych.", "src": "v56"}, {"k": "abcd", "q": "W doświadczeniu badającym, czy glukoza i skrobia są osmotycznie czynne, co stanowiło próbę kontrolną?", "o": ["lejek z wodą destylowaną, zamknięty błoną półprzepuszczalną, w zlewce z wodą", "lejek z zawiesiną skrobi, zamknięty błoną półprzepuszczalną, w zlewce z wodą", "lejek z roztworem glukozy, zamknięty błoną półprzepuszczalną, w zlewce z wodą", "lejek z roztworem glukozy, zamknięty błoną półprzepuszczalną, w zlewce ze skrobią"], "a": 0, "e": "Próba kontrolna różni się od badawczych tylko brakiem badanej substancji – był to lejek z wodą destylowaną. Lejki z glukozą i skrobią to próby badawcze A i B.", "src": "v57"}, {"k": "abcd", "q": "Dlaczego w lejku z zawiesiną skrobi poziom cieczy się nie zmienił?", "o": ["Skrobia nie rozpuszcza się w wodzie, lecz tworzy z nią zawiesinę.", "Skrobia nie rozpuszcza się w wodzie, lecz tworzy z nią emulsję.", "Skrobia rozpuszcza się w wodzie, tworząc roztwór izotoniczny.", "Skrobia rozpuszcza się w wodzie, tworząc roztwór hipotoniczny."], "a": 0, "e": "Skrobia jest substancją osmotycznie bierną – nie rozpuszcza się w wodzie i tworzy zawiesinę, więc nie zmienia kierunku przepływu wody. Emulsję tworzą oleje.", "src": "v57"}, {"k": "abcd", "q": "Na jakiej drodze komórka wydziela na zewnątrz enzymy trawienne?", "o": ["egzocytozy", "endocytozy", "pinocytozy", "fagocytozy"], "a": 0, "e": "Egzocytoza to transport substancji na zewnątrz komórki w pęcherzykach – tak wydzielane są m.in. hormony, śluzy i enzymy trawienne. Pozostałe procesy to transport do wnętrza komórki.", "src": "v58"}, {"k": "abcd", "q": "Jak nazywa się pobieranie przez komórkę drobnych, nierozpuszczalnych cząstek, np. bakterii?", "o": ["fagocytoza", "pinocytoza", "egzocytoza", "dyfuzja ułatwiona"], "a": 0, "e": "Fagocytoza dotyczy drobnych, nierozpuszczalnych cząstek, a pinocytoza – małych kropli płynów z substancjami rozpuszczonymi w wodzie.", "src": "v58"}, {"k": "abcd", "q": "W jakim roztworze należy umieścić komórkę roślinną, aby zaobserwować plazmolizę?", "o": ["w hipertonicznym", "w hipotonicznym", "w izotonicznym", "w wodzie destylowanej"], "a": 0, "e": "Plazmoliza zachodzi w roztworze hipertonicznym, gdy komórka traci wodę. Woda destylowana lub roztwór hipotoniczny wywołują deplazmolizę.", "src": "v56"}, {"k": "luka", "q": "W komórkach zwierzęcych między cząsteczkami fosfolipidów znajdują się cząsteczki ___, które usztywniają błonę.", "o": ["cholesterolu", "glikolipidów", "glikoprotein", "spektryny"], "a": 0, "e": "Cholesterol usztywnia błonę i zmniejsza jej płynność. Spektryna też zwiększa odporność mechaniczną błony, ale jest białkiem kotwiczącym, a nie składnikiem dwuwarstwy.", "src": "v53"}, {"k": "luka", "q": "Odstawanie protoplastu od ściany komórkowej w roztworze hipertonicznym to ___.", "o": ["plazmoliza", "deplazmoliza", "osmoza", "pinocytoza"], "a": 0, "e": "Plazmoliza to odstawanie protoplastu od ściany komórkowej; deplazmoliza to powrót do stanu sprzed plazmolizy.", "src": "v56"}, {"k": "luka", "q": "Pobieranie przez komórkę małych kropli płynów zawierających substancje rozpuszczalne w wodzie to ___.", "o": ["pinocytoza", "fagocytoza", "egzocytoza", "osmoza"], "a": 0, "e": "Pinocytoza to pobieranie małych kropli płynów, a fagocytoza – drobnych, nierozpuszczalnych cząstek.", "src": "v58"}, {"k": "luka", "q": "Białka integralne ___ przebijają dwuwarstwę lipidową i wystają z obu jej stron.", "o": ["transbłonowe", "nieprzebijające błony", "powierzchniowe", "kotwiczące"], "a": 0, "e": "Białka transbłonowe przebijają całą dwuwarstwę; białka nieprzebijające błony wnikają tylko do jednej monowarstwy.", "src": "v53"}, {"k": "pf", "q": "Im dłuższe są łańcuchy węglowodorowe kwasów tłuszczowych tworzących błonę, tym większa jest jej płynność.", "a": false, "e": "Jest odwrotnie – im krótsze łańcuchy, tym większa płynność błony.", "src": "v54"}, {"k": "pf", "q": "Im płynniejsza jest błona, tym jej przepuszczalność jest większa.", "a": true, "e": "Tak – stopień płynności wpływa na przepuszczalność: płynniejsza błona jest bardziej przepuszczalna.", "src": "v54"}, {"k": "pf", "q": "W endocytozie pęcherzyki powstają przy udziale błon cytoplazmatycznych, a w egzocytozie – z udziałem błony komórkowej.", "a": false, "e": "Jest odwrotnie: w endocytozie pęcherzyki powstają z udziałem błony komórkowej, a w egzocytozie – przy udziale błon cytoplazmatycznych.", "src": "v58"}, {"k": "pf", "q": "Transport bierny nie wymaga nakładu energii i może zachodzić z udziałem białek błonowych.", "a": true, "e": "Tak – transport bierny jest zgodny z gradientem stężeń i może przebiegać przez dwuwarstwę lub z udziałem białek (dyfuzja ułatwiona).", "src": "v54"}, {"k": "para", "q": "Dopasuj białko błonowe do grupy, do której należy ze względu na funkcję.", "p": [["pompa sodowo-potasowa", "białko transportujące"], ["spektryna", "białko kotwiczące"], ["receptor hormonu peptydowego", "białko receptorowe"], ["cyklaza adenylanowa", "białko enzymatyczne"]], "src": "v53"}, {"k": "para", "q": "Dopasuj komórkę i roztwór, w którym ją umieszczono, do skutku osmozy.", "p": [["erytrocyt w roztworze hipertonicznym", "kurczy się i ostatecznie rozpada"], ["erytrocyt w roztworze hipotonicznym", "pęcznieje i ostatecznie pęka"], ["komórka miękiszowa w roztworze hipertonicznym", "ulega plazmolizie"], ["komórka miękiszowa w roztworze hipotonicznym", "osiąga stan maksymalnej jędrności"]], "src": "v56"}, {"k": "para", "q": "Dopasuj rodzaj transportu do przykładu podanego w podręczniku.", "p": [["dyfuzja prosta", "przenikanie CO₂ i O₂"], ["dyfuzja ułatwiona", "przenikanie glukozy i aminokwasów"], ["transport czynny", "działanie pompy protonowej"], ["egzocytoza", "wydzielanie enzymów trawiennych"]], "src": "v54"}], "t10": [{"k": "abcd", "q": "Która struktura jądra komórkowego odpowiada za powstawanie podjednostek rybosomów?", "o": ["jąderko", "kariolimfa", "pory jądrowe", "heterochromatyna"], "a": 0, "e": "W jąderku zachodzi synteza rRNA i jego łączenie z białkami. Pory jądrowe jedynie transportują gotowe podjednostki do cytozolu.", "src": "v59"}, {"k": "abcd", "q": "Która cecha odróżnia euchromatynę od heterochromatyny?", "o": ["Jest zbudowana z luźno upakowanych włókien.", "Zawiera większość pozagenowego DNA.", "Jest zbudowana ze ściśle upakowanych włókien.", "Uważa się, że zawiera nieaktywne geny."], "a": 0, "e": "Euchromatyna to luźno upakowane włókna z aktywnymi genami; pozostałe cechy opisują heterochromatynę.", "src": "v59"}, {"k": "abcd", "q": "Które cząsteczki są transportowane przez pory jądrowe głównie z jądra do cytozolu?", "o": ["mRNA, tRNA i podjednostki rybosomów", "białka histonowe, enzymy i wolne nukleotydy", "mRNA, białka histonowe i wolne nukleotydy", "tRNA, enzymy i podjednostki rybosomów"], "a": 0, "e": "Z jądra wychodzą mRNA, tRNA i podjednostki rybosomów; histony, enzymy i nukleotydy wędrują w przeciwnym kierunku – do jądra.", "src": "v59"}, {"k": "abcd", "q": "Od czego zależy liczba porów jądrowych w otoczce jądrowej?", "o": ["od aktywności metabolicznej komórki", "od liczby chromosomów w jądrze", "od wielkości jąderka w jądrze", "od stopnia kondensacji chromatyny"], "a": 0, "e": "Komórki o dużej aktywności metabolicznej mają więcej porów jądrowych niż komórki o małej aktywności.", "src": "v59"}, {"k": "abcd", "q": "Jak nazywa się jednostka chromatyny, w której fragment DNA jest nawinięty na rdzeń z ośmiu cząsteczek białek histonowych?", "o": ["nukleosom", "centromer", "chromatyda", "centrosom"], "a": 0, "e": "Nukleosom to DNA nawinięte na oktamer histonów; kolejne nukleosomy łączy DNA łącznikowy.", "src": "v60"}, {"k": "abcd", "q": "Która postać chromatyny występuje w komórkach w okresie międzypodziałowym?", "o": ["włókno chromatyny o szerokości 30 nm", "włókno chromatyny o szerokości 300 nm", "włókna chromatyny ułożone w pętle", "chromosom metafazowy z dwiema chromatydami"], "a": 0, "e": "Włókno 30 nm to postać typowa dla okresu międzypodziałowego; pętle i włókna 300 nm powstają dopiero na początku podziału.", "src": "v60"}, {"k": "abcd", "q": "W której postaci DNA występuje tylko podczas replikacji?", "o": ["jako fragment dwuniciowej helisy DNA", "jako chromatyna w postaci sznura nukleosomów", "jako włókno chromatyny o szerokości 30 nm", "jako pętle chromatyny zwinięte w spirale"], "a": 0, "e": "Nieupakowana dwuniciowa helisa DNA występuje tylko w czasie replikacji; w pozostałych okresach DNA jest nawinięte na histony.", "src": "v60"}, {"k": "abcd", "q": "Ile cząsteczek DNA zawiera jeden chromosom metafazowy?", "o": ["dwie identyczne cząsteczki DNA", "jedną liniową cząsteczkę DNA", "dwie różniące się cząsteczki DNA", "cztery identyczne cząsteczki DNA"], "a": 0, "e": "Chromosom metafazowy składa się z dwóch chromatyd siostrzanych utworzonych przez dwie identyczne cząsteczki DNA.", "src": "v60"}, {"k": "abcd", "q": "Jaką funkcję pełni centromer chromosomu metafazowego?", "o": ["jest miejscem przyczepu włókien wrzeciona kariokinetycznego", "jest ośrodkiem formowania mikrotubul wrzeciona podziałowego", "jest miejscem syntezy rRNA i składania podjednostek rybosomów", "jest miejscem połączenia kolejnych nukleosomów chromatyny"], "a": 0, "e": "Centromer (przewężenie pierwotne) to miejsce przyczepu włókien wrzeciona. Ośrodkiem formowania mikrotubul wrzeciona jest centrosom.", "src": "v60"}, {"k": "abcd", "q": "Co stanowi fazę rozpraszającą cytozolu jako roztworu koloidalnego?", "o": ["woda", "białka rozpuszczalne", "związki nieorganiczne", "białka włókienkowe"], "a": 0, "e": "Fazą rozpraszającą cytozolu jest woda; białka i inne związki tworzą fazę rozproszoną.", "src": "v61"}, {"k": "abcd", "q": "Włókna cytoszkieletu w postaci pustych wewnątrz rurek o średnicy 25 nm są zbudowane z:", "o": ["tubuliny", "aktyny", "keratyny", "histonów"], "a": 0, "e": "Rurki o średnicy 25 nm to mikrotubule zbudowane z tubuliny. Aktyna buduje filamenty 7 nm, keratyna – filamenty pośrednie 10 nm.", "src": "v61"}, {"k": "abcd", "q": "Których włókien cytoszkieletu jest najwięcej w komórkach nabłonka i dlaczego?", "o": ["filamentów pośrednich, bo zwiększają wytrzymałość mechaniczną komórki", "filamentów aktynowych, bo umożliwiają ruch pełzakowaty komórek", "mikrotubul, bo tworzą szlaki transportu wewnątrzkomórkowego", "mikrotubul, bo utrzymują organelle w odpowiednim położeniu"], "a": 0, "e": "Filamenty pośrednie zwiększają wytrzymałość na urazy mechaniczne, np. pękanie podczas rozciągania – stąd ich obfitość w nabłonku.", "src": "v62"}, {"k": "abcd", "q": "Które włókna cytoszkieletu odpowiadają za ruch cytozolu obserwowany w komórkach liści moczarki kanadyjskiej?", "o": ["filamenty aktynowe", "filamenty pośrednie", "mikrotubule", "centriole"], "a": 0, "e": "Filamenty aktynowe umożliwiają ruch w obrębie komórki, m.in. ruch organelli i cytozolu.", "src": "v62"}, {"k": "abcd", "q": "Który rodzaj włókien cytoszkieletu wzmacnia wewnętrzną powierzchnię otoczki jądrowej i stabilizuje włókna chromatyny?", "o": ["filamenty pośrednie", "filamenty aktynowe", "mikrotubule", "włókna wrzeciona"], "a": 0, "e": "To funkcja filamentów pośrednich, które tworzą gęstą sieć otaczającą jądro komórkowe.", "src": "v62"}, {"k": "abcd", "q": "Czym różnią się wici od rzęsek komórek eukariotycznych?", "o": ["liczbą i długością", "układem mikrotubul w trzonie", "obecnością ciałka podstawowego", "rodzajem białka budującego trzon"], "a": 0, "e": "Wici i rzęski mają identyczny plan budowy; różnią się jedynie liczbą i długością (rzęski krótkie i liczne, wici długie, pojedyncze lub po kilka).", "src": "v62"}, {"k": "abcd", "q": "Jaki układ mikrotubul tworzy trzon rzęski lub wici?", "o": ["dziewięć par na obwodzie i jedna para w środku", "dziewięć par na obwodzie i brak mikrotubul w środku", "osiem par na obwodzie i jedna para w środku", "dziewięć pojedynczych na obwodzie i dwie w środku"], "a": 0, "e": "Trzon rzęski i wici ma charakterystyczny układ 9 par mikrotubul na obwodzie i 1 pary w środku.", "src": "v62"}, {"k": "luka", "q": "Włókno chromatyny o szerokości 30 nm tworzą ___ zwinięte w helisę i ułożone jeden na drugim.", "o": ["nukleosomy", "chromatydy", "pętle chromatyny", "centromery"], "a": 0, "e": "Nukleosomy zwijają się w helisę, tworząc włókno 30 nm; pętle powstają z tych włókien dopiero na początku podziału.", "src": "v60"}, {"k": "luka", "q": "W chromosomie metafazowym cząsteczka DNA jest ok. ___ razy krótsza niż w postaci rozwiniętej.", "o": ["9 tys.", "300", "900", "90 tys."], "a": 0, "e": "Chromosom metafazowy to najbardziej skondensowana postać DNA – cząsteczka jest ok. 9 tys. razy krótsza niż rozwinięta.", "src": "v60"}, {"k": "luka", "q": "Najwięcej filamentów aktynowych występuje ___.", "o": ["pod błoną komórkową", "wokół jądra komórkowego", "w ciałkach podstawowych", "w kariolimfie jądra"], "a": 0, "e": "Filamenty aktynowe skupiają się pod błoną komórkową; gęstą sieć wokół jądra tworzą filamenty pośrednie.", "src": "v61"}, {"k": "luka", "q": "Rzęski i wici wyrastają z ___ zlokalizowanego pod błoną komórkową.", "o": ["ciałka podstawowego", "centromeru", "jąderka", "centrosomu"], "a": 0, "e": "Rzęski i wici wyrastają z ciałka podstawowego; centrosom jest ośrodkiem formowania mikrotubul wrzeciona podziałowego.", "src": "v62"}, {"k": "pf", "q": "Uważa się, że heterochromatyna zawiera nieaktywne geny oraz większość pozagenowego DNA.", "a": true, "e": "Tak opisuje heterochromatynę książka; jest ona zbudowana ze ściśle upakowanych włókien.", "src": "v59"}, {"k": "pf", "q": "Otoczka jądrowa jest zbudowana z jednej błony, w której znajdują się pory jądrowe.", "a": false, "e": "Otoczka jądrowa to dwie błony oddzielające wnętrze jądra od cytozolu.", "src": "v59"}, {"k": "pf", "q": "Filamenty pośrednie to sztywne włókienka o średnicy 25 nm.", "a": false, "e": "Filamenty pośrednie mają średnicę 10 nm; średnicę 25 nm mają mikrotubule.", "src": "v61"}, {"k": "pf", "q": "Pętle chromatyny zwijają się spiralnie i tworzą włókna chromatyny o szerokości 30 nm.", "a": false, "e": "Spiralnie zwinięte pętle tworzą włókna o szerokości 300 nm; włókno 30 nm to wcześniejszy etap upakowania.", "src": "v60"}, {"k": "pf", "q": "Centriole występują głównie w komórkach zwierzęcych.", "a": true, "e": "Centriole, zbudowane z mikrotubul ułożonych w cylinder, występują głównie w komórkach zwierzęcych.", "src": "v62"}, {"k": "para", "q": "Dopasuj strukturę do jej szerokości (średnicy).", "p": [["Filament aktynowy", "7 nm"], ["Filament pośredni", "10 nm"], ["Mikrotubula", "25 nm"], ["Włókno z nukleosomów zwiniętych w helisę", "30 nm"]], "src": "v61"}, {"k": "para", "q": "Dopasuj element jądra komórkowego do jego opisu.", "p": [["Jąderko", "synteza rRNA i powstawanie podjednostek rybosomów"], ["Pory jądrowe", "transport substancji między jądrem a cytozolem"], ["Kariolimfa", "płyn z białkami enzymatycznymi i RNA wypełniający jądro"], ["Otoczka jądrowa", "dwie błony oddzielające wnętrze jądra od cytozolu"]], "src": "v59"}], "t11": [{"k": "abcd", "q": "Która cecha mitochondriów i plastydów jest argumentem na poparcie teorii endosymbiozy?", "o": ["obecność kolistego DNA niezwiązanego z białkami histonowymi", "obecność liniowego DNA nawiniętego na białka histonowe", "obecność rybosomów takich jak rybosomy cytozolu eukariontów", "powstawanie z pęcherzyków siateczki śródplazmatycznej"], "a": 0, "e": "Koliste DNA bez histonów przypomina DNA prokariontów. Liniowe DNA na histonach jest cechą jądra eukariotycznego.", "src": "v63"}, {"k": "abcd", "q": "Zgodnie z teorią endosymbiozy mitochondria powstały z:", "o": ["cudzożywnych bakterii tlenowych", "bakterii fotosyntetyzujących", "wpuklenia błony komórkowej", "pęcherzyków otoczki jądrowej"], "a": 0, "e": "Wchłonięte cudzożywne bakterie tlenowe przekształciły się w mitochondria, a bakterie fotosyntetyzujące – w chloroplasty.", "src": "v63"}, {"k": "abcd", "q": "W której z wymienionych komórek nie występują mitochondria?", "o": ["w erytrocycie ssaka", "we włóknie mięśniowym", "w neuronie", "w komórce wątroby"], "a": 0, "e": "Erytrocyty ssaków utraciły mitochondria wskutek specjalizacji; we włóknach mięśniowych i neuronach jest ich szczególnie dużo.", "src": "v63"}, {"k": "abcd", "q": "Dlaczego we włóknach mięśniowych występuje szczególnie dużo mitochondriów?", "o": ["mają duże zapotrzebowanie energetyczne", "zawierają wiele jąder komórkowych", "magazynują duże ilości jonów wapnia", "prowadzą intensywną syntezę lipidów"], "a": 0, "e": "Liczba mitochondriów zależy od zapotrzebowania energetycznego komórki. Pozostałe cechy nie wyjaśniają liczby mitochondriów.", "src": "v64"}, {"k": "abcd", "q": "Który element mitochondrium jest pofałdowany i zawiera nośniki oraz pompy transportujące substancje?", "o": ["błona wewnętrzna", "błona zewnętrzna", "matriks", "przestrzeń międzybłonowa"], "a": 0, "e": "Wewnętrzna błona tworzy grzebienie i zawiera nośniki i pompy; zewnętrzna jest gładka i przepuszczalna dla wielu związków.", "src": "v64"}, {"k": "abcd", "q": "Roślinę wyhodowano bez dostępu do światła. Jakie plastydy będą występować w komórkach miękiszu jej liści?", "o": ["etioplasty", "chloroplasty", "chromoplasty", "amyloplasty"], "a": 0, "e": "Etioplasty występują w miękiszu liści i łodyg roślin, które wyrosły bez dostępu do światła.", "src": "v65"}, {"k": "abcd", "q": "Co się stanie z etioplastami po przeniesieniu rośliny na światło?", "o": ["przekształcą się w chloroplasty", "przekształcą się w chromoplasty", "przekształcą się w amyloplasty", "przekształcą się w proplastydy"], "a": 0, "e": "Przy dostępie do światła etioplasty przekształcają się w chloroplasty, a protochlorofilid – w chlorofil.", "src": "v65"}, {"k": "abcd", "q": "Który barwnik zawierają zarówno proplastydy, jak i etioplasty?", "o": ["protochlorofilid", "chlorofil", "karoteny", "ksantofile"], "a": 0, "e": "Proplastydy i etioplasty zawierają żółty protochlorofilid, który pod wpływem światła przekształca się w chlorofil.", "src": "v65"}, {"k": "abcd", "q": "Jaką strukturę przyjmują białka w cysternach siateczki śródplazmatycznej szorstkiej?", "o": ["trzeciorzędową", "pierwszorzędową", "drugorzędową", "czwartorzędową"], "a": 0, "e": "Rybosomy na RER syntetyzują białka o strukturze pierwszorzędowej, a w cysternach białka przyjmują strukturę trzeciorzędową.", "src": "v66"}, {"k": "abcd", "q": "Którą funkcję pełni siateczka śródplazmatyczna gładka w komórkach wątroby?", "o": ["neutralizację substancji toksycznych", "magazynowanie jonów wapnia", "syntezę białek wydzielniczych", "sortowanie i transport białek"], "a": 0, "e": "Neutralizacja toksyn zachodzi w SER np. w wątrobie; magazynowanie jonów wapnia wymieniono jako przykład dla mięśni.", "src": "v66"}, {"k": "abcd", "q": "Które z wymienionych białek jest syntetyzowane na rybosomach związanych z siateczką śródplazmatyczną?", "o": ["enzymy lizosomów", "białka histonowe", "tubulina", "aktyna"], "a": 0, "e": "Na rybosomach związanych powstają białka kierowane poza komórkę, białka błonowe oraz enzymy lizosomów i wakuol; pozostałe białka – na rybosomach wolnych.", "src": "v66"}, {"k": "abcd", "q": "Jaką stałą sedymentacji mają rybosomy mitochondrialne człowieka?", "o": ["55S", "70S", "78S", "80S"], "a": 0, "e": "Rybosomy mitochondrialne ssaków mają 55S (podjednostki 39S i 28S); 78S mają rybosomy mitochondrialne roślin.", "src": "v67"}, {"k": "abcd", "q": "Dlaczego enzymy lizosomalne nie trawią błony lizosomu?", "o": ["błonę pokrywa od wewnątrz warstwa odpornych chemicznie cukrów", "enzymy lizosomów są aktywne wyłącznie w środowisku obojętnym", "pompy protonowe usuwają jony H+ z wnętrza lizosomu", "lizosom jest otoczony dwiema błonami chroniącymi wnętrze"], "a": 0, "e": "Warstwa bardzo odpornych chemicznie cukrów chroni błonę. Lizosom ma pojedynczą błonę, a pompy wprowadzają H+ do wnętrza.", "src": "v67"}, {"k": "abcd", "q": "Co się stanie z enzymami lizosomów, jeśli pompy protonowe w błonie lizosomu przestaną działać?", "o": ["stracą aktywność, bo pH we wnętrzu wzrośnie", "stracą aktywność, bo pH we wnętrzu spadnie", "zachowają aktywność, bo pH we wnętrzu wzrośnie", "zachowają aktywność, bo pH się nie zmieni"], "a": 0, "e": "Pompy wprowadzają H+ i utrzymują pH ≈ 5. Bez nich pH wzrośnie, a enzymy aktywne tylko w środowisku kwasowym przestaną działać.", "src": "v67"}, {"k": "abcd", "q": "Która kolejność przedstawia drogę białka wydzielanego poza komórkę?", "o": ["RER → pęcherzyki → aparat Golgiego → pęcherzyki → błona komórkowa", "aparat Golgiego → pęcherzyki → RER → pęcherzyki → błona komórkowa", "RER → pęcherzyki → lizosom → pęcherzyki → błona komórkowa", "SER → pęcherzyki → aparat Golgiego → lizosom → błona komórkowa"], "a": 0, "e": "Białka z RER trafiają pęcherzykami do aparatu Golgiego, gdzie są modyfikowane, a następnie pęcherzykami do błony i są usuwane na drodze egzocytozy.", "src": "v68"}, {"k": "abcd", "q": "Dlaczego peroksysomy zawierają katalazę?", "o": ["rozkłada szkodliwy nadtlenek wodoru do wody i tlenu", "rozkłada kwasy tłuszczowe do jednostek dwuwęglowych", "neutralizuje leki oraz alkohol etylowy w wątrobie", "uczestniczy w wytwarzaniu mieliny otoczek neuronów"], "a": 0, "e": "Katalaza rozkłada H2O2 – reaktywną formę tlenu powstającą w procesach utleniania w peroksysomach. Pozostałe opcje to inne funkcje peroksysomów, nie katalazy.", "src": "v68"}, {"k": "abcd", "q": "U jakich organizmów występują wodniczki tętniące?", "o": ["u protistów słodkowodnych żyjących w środowisku hipotonicznym", "u protistów morskich żyjących w środowisku hipertonicznym", "u protistów słodkowodnych żyjących w środowisku hipertonicznym", "u protistów morskich żyjących w środowisku izotonicznym"], "a": 0, "e": "Wodniczki tętniące usuwają nadmiar wody napływającej z hipotonicznego środowiska słodkowodnego.", "src": "v69"}, {"k": "luka", "q": "Wewnętrzna błona mitochondrium jest pofałdowana i tworzy ___.", "o": ["grzebienie mitochondrialne", "tylakoidy gran", "cysterny", "tylakoidy stromy"], "a": 0, "e": "Pofałdowania wewnętrznej błony mitochondrium to grzebienie; tylakoidy tworzy wewnętrzna błona chloroplastu.", "src": "v64"}, {"k": "luka", "q": "Tylakoidy stromy mają postać kanalików łączących ze sobą poszczególne ___.", "o": ["grana", "cysterny", "grzebienie", "proplastydy"], "a": 0, "e": "Tylakoidy stromy łączą grana, czyli stosy tylakoidów gran.", "src": "v65"}, {"k": "luka", "q": "Rybosomy typu prokariotycznego są zbudowane z podjednostek o współczynnikach sedymentacji ___.", "o": ["30S i 50S", "40S i 60S", "28S i 39S", "30S i 60S"], "a": 0, "e": "Rybosom prokariotyczny 70S tworzą podjednostki 30S i 50S; 40S i 60S budują rybosom eukariotyczny 80S.", "src": "v66"}, {"k": "luka", "q": "Aparat Golgiego powstaje z pęcherzyków ___.", "o": ["siateczki śródplazmatycznej szorstkiej", "siateczki śródplazmatycznej gładkiej", "błony komórkowej", "otoczki jądrowej"], "a": 0, "e": "Aparat Golgiego powstaje z pęcherzyków RER, które dostarczają mu też białka do modyfikacji.", "src": "v67"}, {"k": "luka", "q": "Wakuolę w komórce roślinnej otacza jedna błona zwana ___.", "o": ["tonoplastem", "tylakoidem", "otoczką", "cysterną"], "a": 0, "e": "Błona wakuoli roślinnej to tonoplast; wnętrze wakuoli wypełnia sok komórkowy.", "src": "v69"}, {"k": "pf", "q": "Zewnętrzna błona chloroplastu jest przepuszczalna tylko dla niektórych substancji.", "a": false, "e": "Tylko dla niektórych substancji przepuszczalna jest błona wewnętrzna; zewnętrzna jest przepuszczalna dla wielu substancji.", "src": "v65"}, {"k": "pf", "q": "Stroma chloroplastu zawiera enzymy, rybosomy, DNA oraz ziarna skrobi.", "a": true, "e": "Taki skład stromy podaje książka.", "src": "v65"}, {"k": "pf", "q": "Lizosomy to niewielkie pęcherzyki otoczone podwójną błoną.", "a": false, "e": "Lizosomy są otoczone pojedynczą błoną; dwie błony mają mitochondria i plastydy.", "src": "v67"}, {"k": "pf", "q": "Peroksysomy przeprowadzają rozkład kwasów tłuszczowych do jednostek trójwęglowych.", "a": false, "e": "Peroksysomy rozkładają kwasy tłuszczowe do jednostek dwuwęglowych.", "src": "v68"}, {"k": "pf", "q": "Wodniczki pokarmowe powstają na skutek endocytozy – pinocytozy lub fagocytozy.", "a": true, "e": "Tak powstają wodniczki pokarmowe niektórych protistów.", "src": "v69"}, {"k": "para", "q": "Dopasuj rodzaj plastydu do jego funkcji.", "p": [["Chloroplasty", "przeprowadzają fotosyntezę"], ["Chromoplasty", "nadają barwę kwiatom i owocom"], ["Amyloplasty", "magazynują skrobię"], ["Elajoplasty", "magazynują tłuszcze"]], "src": "v65"}, {"k": "para", "q": "Dopasuj rodzaj rybosomu do jego stałej sedymentacji.", "p": [["Rybosom eukariotyczny w cytozolu", "80S"], ["Rybosom prokariotyczny", "70S"], ["Rybosom mitochondrialny roślin", "78S"], ["Rybosom mitochondrialny ssaków", "55S"]], "src": "v67"}, {"k": "para", "q": "Dopasuj organellum do funkcji.", "p": [["Lizosom", "trawienie wewnątrzkomórkowe zużytych organelli"], ["Peroksysom", "rozkład kwasów tłuszczowych i neutralizacja alkoholu"], ["Aparat Golgiego", "modyfikowanie, sortowanie i transport białek"], ["Siateczka śródplazmatyczna gładka", "synteza lipidów, np. fosfolipidów i cholesterolu"]], "src": "v68"}], "t12": [{"k": "abcd", "q": "Który związek jest głównym składnikiem ściany komórkowej grzybów?", "o": ["chityna", "mureina", "celuloza", "pektyna"], "a": 0, "e": "U grzybów głównym składnikiem ściany jest chityna; mureina buduje ścianę bakterii, a celuloza – ścianę roślin.", "src": "v69"}, {"k": "abcd", "q": "Która struktura jest podstawową jednostką strukturalną ściany komórkowej roślin?", "o": ["mikrofibryla", "fibryla elementarna", "makrofibryla", "cząsteczka celulozy"], "a": 0, "e": "Podstawową jednostką strukturalną jest mikrofibryla, powstała z kilku fibryli elementarnych; makrofibryle to już grubsze włókna z połączonych mikrofibryli.", "src": "v69"}, {"k": "abcd", "q": "Jakie wiązania łączą ze sobą poszczególne łańcuchy celulozy w mikrofibryle?", "o": ["wodorowe", "glikozydowe", "jonowe", "estrowe"], "a": 0, "e": "Łańcuchy celulozy łączą się ze sobą wiązaniami wodorowymi; wiązania glikozydowe łączą reszty glukozy wewnątrz jednego łańcucha, a nie łańcuchy między sobą.", "src": "v70"}, {"k": "abcd", "q": "Która cecha odróżnia ścianę komórkową wtórną od pierwotnej?", "o": ["Ma dużo celulozy i grube, regularnie ułożone włókna.", "Ma dużo wody i pektyn oraz cienkie włókna.", "Ma dużo białek i nieregularnie ułożone włókna.", "Okrywa młode, rosnące komórki i ma mało celulozy."], "a": 0, "e": "Ściana wtórna zawiera dużo celulozy i ma grube, regularnie ułożone włókna; pozostałe cechy opisują ścianę pierwotną.", "src": "v70"}, {"k": "abcd", "q": "W ściany komórek drewna wnika substancja nadająca im sztywność i umożliwiająca pionowy transport wody. Jaka to substancja i jaki rodzaj zmiany wtórnej?", "o": ["lignina – inkrustacja", "lignina – adkrustacja", "suberyna – inkrustacja", "suberyna – adkrustacja"], "a": 0, "e": "Lignina wnika między włókna celulozowe, czyli jest przykładem inkrustacji; suberyna odkłada się na powierzchni ściany (adkrustacja).", "src": "v70"}, {"k": "abcd", "q": "Który związek, wchodzący w skład kutykuli komórek skórki pędu, zabezpiecza roślinę przed nadmiernym parowaniem wody?", "o": ["kutyna", "suberyna", "lignina", "krzemionka"], "a": 0, "e": "Kutyna buduje kutykulę skórki pędu; suberyna też ogranicza przenikanie wody, ale występuje w komórkach korkowicy.", "src": "v70"}, {"k": "abcd", "q": "Która substancja wysyca ściany komórkowe skrzypów, zwiększając odporność rośliny na patogeny i roślinożerców?", "o": ["krzemionka", "lignina", "kutyna", "suberyna"], "a": 0, "e": "Krzemionka (SiO2) wysyca ściany m.in. skrzypów i niektórych traw; lignina też jest substancją inkrustującą, ale występuje m.in. w drewnie i umożliwia transport wody.", "src": "v70"}, {"k": "abcd", "q": "Które polisacharydy, wytwarzane m.in. przez nasiona lnu i pigwy, chłoną wodę?", "o": ["śluzy", "gumy", "pektyny", "hemicelulozy"], "a": 0, "e": "Śluzy chłoną wodę i są wytwarzane m.in. przez nasiona lnu i pigwy; gumy są wydzielane przez drzewa w miejscach zranień.", "src": "v70"}, {"k": "abcd", "q": "Z jakich związków jest zbudowana blaszka środkowa?", "o": ["z pektyn", "z celulozy", "z hemiceluloz", "z ligniny"], "a": 0, "e": "Blaszka środkowa, leżąca między ścianami pierwotnymi sąsiednich komórek, jest zbudowana z pektyn.", "src": "v71"}, {"k": "abcd", "q": "Co się stanie, gdy blaszka środkowa między dwiema komórkami roślinnymi ulegnie rozpuszczeniu?", "o": ["Komórki się od siebie rozsuną.", "Plazmodesmy trwale się zamkną.", "Ściana pierwotna stanie się wtórną.", "Komórki zleją się w jedną."], "a": 0, "e": "Blaszka środkowa spaja sąsiednie komórki, więc po jej rozpuszczeniu komórki się rozsuwają.", "src": "v71"}, {"k": "abcd", "q": "Które struktury sąsiednich komórek roślinnych łączą plazmodesmy?", "o": ["siateczki śródplazmatyczne", "aparaty Golgiego", "wakuole", "jądra komórkowe"], "a": 0, "e": "Plazmodesmy przechodzą przez otwory w ścianach i łączą siateczki śródplazmatyczne sąsiednich komórek.", "src": "v71"}, {"k": "abcd", "q": "Które połączenia umożliwiają przepływ jonów i małych cząsteczek polarnych między komórkami mięśnia poprzecznie prążkowanego serca?", "o": ["połączenia szczelinowe", "desmosomy", "połączenia zamykające", "półdesmosomy"], "a": 0, "e": "Połączenia szczelinowe tworzą kanały z koneksonów łączące cytoplazmy komórek; desmosomy łączą komórki jedynie mechanicznie.", "src": "v71"}, {"k": "abcd", "q": "Które połączenia międzykomórkowe występują wyłącznie w tkance nabłonkowej?", "o": ["połączenia zamykające", "połączenia szczelinowe", "desmosomy", "plazmodesmy"], "a": 0, "e": "Połączenia zamykające występują wyłącznie w nabłonku; połączenia szczelinowe są też w tkance nerwowej i mięśniu sercowym, a plazmodesmy występują u roślin.", "src": "v71"}, {"k": "abcd", "q": "Z czym półdesmosomy łączą filamenty pośrednie cytoszkieletu?", "o": ["z błoną podstawną", "z blaszką środkową", "z błoną sąsiedniej komórki", "z siateczką śródplazmatyczną"], "a": 0, "e": "Półdesmosomy łączą filamenty pośrednie z błoną podstawną; z sąsiednią komórką łączą komórkę desmosomy.", "src": "v71"}, {"k": "luka", "q": "Wolne miejsca pomiędzy makrofibrylami są wypełnione przez ___, hemicelulozy oraz wodę.", "o": ["pektyny", "ligninę", "suberynę", "chitynę"], "a": 0, "e": "Sieć makrofibryli jest wypełniona pektynami, hemicelulozami i wodą; lignina i suberyna pojawiają się dopiero w wyniku wtórnych zmian ściany.", "src": "v69"}, {"k": "luka", "q": "Plazmodesmy to cytoplazmatyczne połączenia międzykomórkowe otoczone ___.", "o": ["błoną komórkową", "ścianą komórkową", "otoczką jądrową", "blaszką środkową"], "a": 0, "e": "Plazmodesmy są otoczone błoną komórkową i przechodzą przez otwory w ścianie komórkowej.", "src": "v71"}, {"k": "luka", "q": "Połączenia szczelinowe są zbudowane z kompleksów białkowych zwanych ___.", "o": ["koneksonami", "desmosomami", "mikrofibrylami", "filamentami pośrednimi"], "a": 0, "e": "Koneksony tworzą kanały, przez które kontaktują si
