<style>
:root{
 --bg:#F3F1EA;--surface:#FFFFFF;--sunk:#E9E6DC;--ink:#1C2422;--muted:#5F6B66;--line:#DAD6CA;
 --accent:#2F5BEA;--accent-ink:#FFFFFF;--accent-soft:#E3E9FD;
 --ok:#1F8A5B;--ok-soft:#DDF2E7;--bad:#C2410C;--bad-soft:#FBE6DA;--gold:#B7791F;--gold-soft:#FBEFD9;
 --sans:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
 --serif:"Source Serif 4",Georgia,serif;
 --r:18px;--shadow:0 1px 2px rgba(0,0,0,.05),0 6px 18px rgba(30,40,35,.06);
 color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#121615;--surface:#1B201F;--sunk:#252B29;--ink:#E7ECE9;--muted:#9EABA6;--line:#2E3634;
 --accent:#7D9BFF;--accent-ink:#0E1430;--accent-soft:#1E2747;--ok:#5DD39B;--ok-soft:#163327;--bad:#FF8A5C;--bad-soft:#3A2016;--gold:#F0B65A;--gold-soft:#3A2C14;
 --shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121615;--surface:#1B201F;--sunk:#252B29;--ink:#E7ECE9;--muted:#9EABA6;--line:#2E3634;
 --accent:#7D9BFF;--accent-ink:#0E1430;--accent-soft:#1E2747;--ok:#5DD39B;--ok-soft:#163327;--bad:#FF8A5C;--bad-soft:#3A2016;--gold:#F0B65A;--gold-soft:#3A2C14;--shadow:none;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent}
main{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 96px)}
body.sess main{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px)}
h1,h2,h3{margin:0;line-height:1.15;letter-spacing:-.01em}
h1{font-size:1.75rem;font-weight:800}
h2{font-size:1.35rem;font-weight:800}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
a{color:var(--accent)}
button{font:inherit;color:inherit}
.muted{color:var(--muted)}.small{font-size:.86rem}
.stack>*+*{margin-top:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.panel{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);border:1px solid var(--line)}
.btn{appearance:none;border:0;border-radius:14px;padding:14px 18px;font-weight:700;font-size:1rem;background:var(--accent);color:var(--accent-ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px}
.btn.block{width:100%}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn.ok{background:var(--ok);color:#fff}.btn.bad{background:var(--bad);color:#fff}
.btn.big{min-height:60px;font-size:1.15rem;border-radius:16px}
.btn:active{transform:scale(.98)}
.btn:focus-visible,.opt:focus-visible,.chip:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px;font-size:.82rem;font-weight:700;background:var(--sunk);color:var(--ink);border:0}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.gold{background:var(--gold-soft);color:var(--gold)}.chip.acc{background:var(--accent-soft);color:var(--accent)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
/* hero */
.hero{background:var(--accent);color:var(--accent-ink);border-radius:24px;padding:20px;border:0}
.hero h2{font-size:1.6rem}
.hero .seg{background:rgba(255,255,255,.18)}
.hero .seg button{color:inherit}
.hero .seg button[aria-pressed="true"]{background:var(--accent-ink);color:var(--accent)}
.hero .btn{background:var(--accent-ink);color:var(--accent)}
.hero .mix{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.hero .mix span{background:rgba(255,255,255,.18);border-radius:999px;padding:4px 10px;font-size:.84rem;font-weight:600}
.seg{display:flex;background:var(--sunk);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;padding:10px 4px;border-radius:10px;font-weight:700;cursor:pointer;font-size:.95rem;min-height:44px}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow)}
.tabs2{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 4px;position:sticky;top:0;background:var(--bg);z-index:5}
.tabs2::-webkit-scrollbar{display:none}
.tabs2 button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font-weight:700;min-height:44px;cursor:pointer}
.tabs2 button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* stats */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:var(--shadow)}
.kpi b{display:block;font-size:1.5rem;font-weight:800;line-height:1.1}
.kpi span{font-size:.78rem;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:8px;height:130px;padding-top:18px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.bars .b i{display:block;width:100%;max-width:34px;background:var(--accent);border-radius:6px 6px 2px 2px;min-height:2px}
.bars .b.today i{background:var(--ok)}
.bars .b em{font-style:normal;font-size:.75rem;color:var(--muted)}
.bars .b small{font-size:.75rem;font-weight:700}
.meter{height:10px;background:var(--sunk);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok);border-radius:99px}
.ring{--p:0;width:48px;height:48px;border-radius:50%;flex:none;background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--sunk) 0);display:grid;place-items:center}
.ring span{width:36px;height:36px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:.72rem;font-weight:800}
/* topics */
.tcard{display:flex;gap:12px;align-items:center;text-decoration:none;color:inherit;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.tcard+.tcard{margin-top:8px}
.tcard .tx{flex:1;min-width:0}
.dzh{display:flex;justify-content:space-between;align-items:baseline;margin:22px 2px 10px}
.locked{opacity:.6;padding:12px 14px;border:1px dashed var(--line);border-radius:16px}
/* notes */
.ncard{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.ncard+.ncard{margin-top:10px}
.ncard summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;justify-content:space-between;gap:10px;align-items:center;font-weight:700;font-size:1.05rem;min-height:52px}
.ncard summary::-webkit-details-marker{display:none}
.ncard summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);flex:none;margin-top:-4px;transition:transform .2s}
.ncard[open] summary::after{transform:rotate(-135deg);margin-top:4px}
.ncard .bd{padding:0 16px 14px}
.ncard ul{margin:0;padding:0;list-style:none}
.ncard li{position:relative;padding:7px 0 7px 18px;font-family:var(--serif);font-size:1.05rem;line-height:1.5;border-top:1px solid var(--line)}
.ncard li:first-child{border-top:0}
.ncard li::before{content:"";position:absolute;left:2px;top:17px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.ncard li b{font-family:var(--sans);font-weight:700}
.src{display:inline-block;margin-top:8px;font-size:.78rem;color:var(--muted);text-decoration:none}
a.src{text-decoration:underline;text-decoration-color:var(--line)}
.fig{margin:10px 0 0;background:var(--sunk);border-radius:12px;overflow:hidden;cursor:zoom-in}
.fig img{display:block;width:100%;max-height:260px;object-fit:contain;background:#fff}
.fig figcaption{padding:8px 10px;font-size:.82rem}
/* key tables */
.ktab h3{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.krow{padding:11px 0;border-top:1px solid var(--line)}
.krow:first-of-type{border-top:0}
.krow .k{font-weight:800;font-size:1.02rem}
.krow dl{margin:4px 0 0;display:grid;grid-template-columns:auto 1fr;gap:3px 10px}
.krow dt{font-size:.78rem;color:var(--muted);padding-top:2px;text-transform:uppercase;letter-spacing:.03em;font-weight:600}
.krow dd{margin:0;font-family:var(--serif);font-size:1rem}
.krow.one dd{grid-column:1/-1}
/* figures tab */
.figs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.figs .fig{margin:0}
.figs .fig img{height:130px;object-fit:cover;object-position:top}
.pages{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pages button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:4px;font-size:.78rem;font-weight:700;cursor:zoom-in}
.pages img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:6px;margin-bottom:3px}
.svgwrap{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;overflow-x:auto}
.svgwrap svg{width:100%;height:auto;min-width:320px}
.s-t{font:700 13px var(--sans);fill:var(--ink)}.s-m{font:400 11.5px var(--sans);fill:var(--muted)}
.s-b{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5}.s-o{fill:var(--ok-soft);stroke:var(--ok);stroke-width:1.5}.s-w{fill:var(--gold-soft);stroke:var(--gold);stroke-width:1.5}
.s-l{stroke:var(--muted);stroke-width:1.5;fill:none}.s-d{stroke:var(--accent);stroke-width:1.5;stroke-dasharray:3 3;fill:none}
/* session */
.sbar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.x{border:0;background:var(--sunk);width:44px;height:44px;border-radius:50%;font-size:1.3rem;cursor:pointer;flex:none}
.prog{flex:1;height:12px;background:var(--sunk);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .3s}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:22px 20px;min-height:250px;display:flex;flex-direction:column;gap:14px}
.qcard .q{font-size:1.35rem;font-weight:700;line-height:1.3}
.qcard .a{font-family:var(--serif);font-size:1.2rem;line-height:1.45;padding-top:14px;border-top:2px dashed var(--line)}
.tap{cursor:pointer}
.flipin{animation:flip .28s ease-out}
@keyframes flip{from{transform:perspective(800px) rotateX(-12deg);opacity:.4}to{transform:none;opacity:1}}
.pop{animation:pop .25s ease-out}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.02)}100%{transform:scale(1)}}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.flipin,.pop,.shake{animation:none}.prog i{transition:none}}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grades .btn{flex-direction:column;gap:0;padding:10px 6px;min-height:64px}
.grades .btn small{font-weight:500;font-size:.75rem;opacity:.85}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 16px;font-size:1.02rem;cursor:pointer;min-height:54px;display:flex;gap:12px;align-items:center}
.opt .l{width:28px;height:28px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-weight:800;font-size:.85rem;flex:none}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}.opt.right .l{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}.opt.wrong .l{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.done{opacity:.45;border-style:dashed}
.pf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pf .opt{justify-content:center;font-weight:800;font-size:1.1rem;min-height:64px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pair .opt{font-size:.92rem;padding:10px 12px;min-height:58px}
.fb{border-radius:16px;padding:14px 16px}
.fb.ok{background:var(--ok-soft)}.fb.bad{background:var(--bad-soft)}
.fb b{display:block;margin-bottom:4px}
.fb p{font-family:var(--serif)}
.blank{display:inline-block;min-width:70px;border-bottom:3px solid var(--accent);text-align:center;color:var(--accent)}
.combo{font-weight:800;color:var(--gold);font-size:.9rem;min-width:44px;text-align:right}
.sumbig{font-size:3.2rem;font-weight:800;line-height:1}
.wl{padding:10px 0;border-top:1px solid var(--line)}
/* task */
textarea{width:100%;min-height:140px;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;background:var(--bg);color:var(--ink)}
.crit{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.crit input{width:22px;height:22px;margin-top:2px;flex:none}
.official{border-left:5px solid var(--ok)}
.back{border:0;background:none;color:var(--accent);font-weight:700;padding:8px 0;cursor:pointer;min-height:44px}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
body.sess nav.tabs{display:none}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 10px;text-decoration:none;color:var(--muted);font-size:.74rem;font-weight:700;position:relative;min-height:56px}
nav.tabs a svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs a[aria-current="page"]{color:var(--accent)}
.badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--bad);color:#fff;border-radius:99px;font-size:.68rem;padding:1px 6px}
/* lightbox */
#lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:50;display:none;flex-direction:column}
#lb.on{display:flex}
#lb .bar{display:flex;gap:8px;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px;color:#fff}
#lb .bar span{flex:1;font-size:.85rem}
#lb .bar button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:700;min-height:44px}
#lb .sc{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center}
#lb img{max-width:100%;max-height:100%}
#lb.zoom .sc{display:block}#lb.zoom img{max-width:none;max-height:none;width:220%}
.status{font-size:.78rem;text-align:center}
</style>
</head>

const TEMATY=[
{id:"t6",dzial:"d0",name:"Metodyka badań",note:[
["Przedmiot i obiekt badań","Przedmiot badań to zjawisko lub proces, który analizujesz, np. przebieg choroby albo kierunek wzrostu korzenia. Obiekt badań to organizm lub materiał biologiczny, na którym prowadzisz badanie, np. fragment liścia, szczury, siewki fasoli.","v14"],
["Obserwacja i doświadczenie","W obserwacji badacz niczego nie zmienia, tylko opisuje stan faktyczny. W doświadczeniu celowo, w kontrolowanych warunkach, zmienia jeden czynnik, który może wpływać na przedmiot badań.","v14"],
["Etapy badania","1) Zaobserwowanie zjawiska. 2) Problem badawczy – pytanie albo jego równoważnik, np. „Wpływ wody na kiełkowanie nasion pieprzycy”. 3) Hipoteza – możliwa odpowiedź w formie zdania oznajmującego, twierdzącego lub przeczącego. 4) Weryfikacja hipotezy – zaplanowanie prób, przeprowadzenie doświadczenia, zebranie i analiza wyników. 5) Wniosek – oparty bezpośrednio na wynikach, potwierdza albo odrzuca hipotezę.","v14"],
["Schemat X, Y, Z","Problem badawczy: „Czy X wpływa na Y u Z?” albo „Wpływ X na Y u Z”. X to badany czynnik, Y to przedmiot badań, Z to obiekt badań. Hipoteza musi zawierać wszystkie trzy elementy.","v23"],
["Próba badawcza i kontrolna","Próba badawcza jest poddana działaniu badanego czynnika. Próba kontrolna nie jest – służy do sprawdzenia, czy zmiany w próbie badawczej wynikają właśnie z tego czynnika. Obie próby muszą wynikać z problemu badawczego i różnić się tylko badanym czynnikiem.","v15"],
["Kontrola pozytywna i negatywna","W pozytywnej próbie kontrolnej badane zjawisko na pewno zachodzi, w negatywnej na pewno nie. Przy wykrywaniu skrobi w bulwie ziemniaka: pozytywna to zawiesina skrobi, negatywna to woda destylowana.","v15"],
["Wymagania CKE","Problem, hipoteza i wniosek muszą odnosić się do konkretnego doświadczenia opisanego w zadaniu. Ogólna formułka bez nazw z treści zadania nie dostaje punktu.","k23"],
["Obserwacje makro- i mikroskopowe","Makroskopowe dotyczą obiektów większych niż 0,01 mm, widocznych gołym okiem, przez lupę lub lornetkę. Mikroskopowe dotyczą obiektów mniejszych niż 0,01 mm i wymagają mikroskopu. Dalsza część tematu (s. 16–17) czeka na zdjęcia.","v15"]]},
{id:"t7",dzial:"d0",name:"Analiza statystyczna",note:[
["Po co analiza statystyczna","Zbieranie, przetwarzanie i prezentowanie danych pozwala zinterpretować wyniki i wyciągnąć wnioski, które potwierdzają albo odrzucają hipotezę.","v18"],
["Rodzaje zmiennych","Niezależna – zmienia ją badacz (np. temperatura). Zależna – zmienia się pod wpływem niezależnej (np. intensywność fotosyntezy). Jakościowa – opisywana słownie (np. płeć, gatunek). Ilościowa – liczbowa, da się ją uporządkować (np. liczebność populacji).","v18"],
["Tabele","Tytuł zawsze nad tabelą. Jednostki w nagłówku w nawiasie kwadratowym, wtedy liczby w kolumnie są bez jednostek. Liczby zapisuje się z tą samą dokładnością.","v18"],
["Wykresy","Zmienna niezależna zwykle na osi X, zależna na osi Y. Osie podpisane, jednostki w nawiasie kwadratowym, tytuł pod wykresem, legenda przy więcej niż jednej serii danych. Kolumnowy – porównanie wartości pomiarów. Liniowy – tendencja zmian. Kołowy i jednosłupkowy – udział procentowy; w jednosłupkowym oś Y kończy się na 100%.","v19"],
["Minimum, maksimum, dominanta","Minimum i maksimum to najniższa i najwyższa wartość w próbie, a zakres zmienności to przedział między nimi. Dominanta to wartość najczęstsza, występująca więcej niż raz; może być ilościowa lub jakościowa.","v20"],
["Średnie i mediana","Średnia arytmetyczna = suma wartości / liczba pomiarów. Mediana to wartość środkowa po uporządkowaniu danych; przy parzystej liczbie pomiarów to średnia z dwóch środkowych. Średnia ważona = suma (wartość × waga) / suma wag; stosuje się ją, gdy próby mają różną liczebność lub powierzchnię.","v20"],
["Odchylenie standardowe i wąsy","Odchylenie standardowe pokazuje, jak bardzo pomiary odbiegają od średniej: wysokie – rozrzucone, niskie – blisko średniej. Wąsy zakresu zmienności wyznaczają minimum i maksimum. Wąsy odchylenia standardowego nie pokazują zakresu zmienności. Jeśli wąsy SD dwóch prób się pokrywają, przypuszczalnie nie ma między nimi znaczącej różnicy; jeśli się nie pokrywają, przypuszczalnie jest.","v21"]]},
{id:"t1",dzial:"d1",name:"Pierwiastki, wiązania i woda",note:[["Masa i pierwiastki", "Pierwiastki występują w organizmach jako jony albo jako składniki związków nieorganicznych i organicznych. Świeża masa to masa całkowita, sucha – po odparowaniu wody. Pierwiastki biogenne (C, H, O, N, S, P) są głównym składnikiem związków organicznych.", "v26"], ["Makro- i mikroelementy", "Makroelementy: powyżej 0,01% suchej masy komórek – biogenne oraz Ca, Mg, K, Na, Cl. Mikroelementy: poniżej 0,01% – Fe, I, Cu, Co, F, Zn, Mn, Mo, B, Se, Cr.", "v26"], ["Makroelementy (1)", "N – białka, kwasy nukleinowe; niedobór: zaburzenia metabolizmu, zahamowanie wzrostu. P – szkielet, fosfolipidy, fosfoproteiny, kwasy nukleinowe; niedobór: zniekształcenia i łamliwość kości. S – keratyna, koenzym A; niedobór: gorszy stan skóry, włosów i paznokci. Ca – kości i zęby, praca komórek nerwowych i mięśniowych, krzepnięcie krwi, ściana komórkowa roślin; niedobór: krzywica, osteoporoza, próchnica, zaburzenia krzepnięcia, drgawki.", "v26"], ["Makroelementy (2)", "Mg – praca mięśni i nerwów, aktywator enzymów, składnik chlorofilu; niedobór: nadpobudliwość nerwów i mięśni, zaburzenia rytmu serca. K – przewodzenie impulsów, skurcz mięśni, płyny ustrojowe; u roślin aktywator enzymów i uwodnienie komórek. Na – przewodzenie impulsów, płyny ustrojowe; niedobór: utrata pobudliwości nerwów. Cl – równowaga wodno-mineralna, kwas solny w soku żołądkowym.", "v27"], ["Mikroelementy", "Fe – hemoglobina (transport tlenu), mioglobina (magazyn tlenu), enzymy fotosyntezy i oddychania; niedobór: osłabienie, niedokrwistość, zaburzenia rytmu serca. I – hormony tarczycy; niedobór: wole, niedorozwój umysłowy. F – kości i szkliwo; niedobór: próchnica.", "v27"], ["Składniki mineralne", "Zwykle rozpuszczone jako jony; nieliczne nierozpuszczalne, np. węglany i fosforany wapnia w kościach. Funkcje: budulcowa; wpływ na uwodnienie (Ca²⁺ i Mg²⁺ zmniejszają płynność cytozolu, Na⁺ i K⁺ zwiększają); składniki białek; aktywatory enzymów; ruch wody; impulsy nerwowe; utrzymanie pH dzięki buforom wodorowęglanowemu i wodorofosforanowemu.", "v30"], ["Wiązania chemiczne", "Kowalencyjne niespolaryzowane – para elektronów należy po równo do obu atomów (H₂, O₂, N₂, C–C). Kowalencyjne spolaryzowane – para przesunięta do atomu bardziej elektroujemnego (H₂O). Jonowe – przyciąganie kationu i anionu (NaCl).", "v28"], ["Oddziaływania międzycząsteczkowe", "Wiązanie wodorowe – między dodatnim wodorem a ujemnym atomem (zwykle O lub N) innej cząsteczki; np. między cząsteczkami wody i zasadami w kwasach nukleinowych. Siły van der Waalsa – przyciąganie cząsteczek o chwilowej polarności. Oddziaływania hydrofobowe – cząsteczki niepolarne układają się w wodzie tak, by mieć z nią jak najmniej kontaktu.", "v27"], ["Budowa wody", "Tlen połączony z dwoma wodorami wiązaniami kowalencyjnymi spolaryzowanymi pod kątem 104,5°. Tlen ma ładunek δ−, wodory δ+ – cząsteczka jest dipolem i tworzy wiązania wodorowe.", "v28"], ["Właściwości wody i ich znaczenie", "Ciecz w temperaturze pokojowej – środowisko w komórkach i dla organizmów wodnych. Największa gęstość w 4°C, lód lżejszy – chroni głębsze warstwy przed zamarzaniem. Dobry rozpuszczalnik związków polarnych (otoczki hydratacyjne) – środowisko reakcji i transport. Kohezja i adhezja – podnoszenie się wody w kapilarach. Duże napięcie powierzchniowe – nartniki. Wysokie ciepło parowania – chłodzenie przez pot i transpirację. Najwyższe ciepło właściwe – stabilna temperatura. Gęstsza od powietrza – utrzymuje duże organizmy. Mało ściśliwa – turgor.", "v29"], ["Na maturze", "„Wyjaśnij” oznacza: przyczyna, mechanizm i skutek. Sama nazwa właściwości wody nie wystarcza.", "v45"]]},
{id:"t2",dzial:"d1",name:"Związki organiczne i cukry",note:[["Związki organiczne", "Związki węgla. Węgiel jest czterowartościowy i tworzy łańcuchy i pierścienie. O reaktywności decydują grupy funkcyjne: hydroksylowa (–OH), aldehydowa (–CHO), ketonowa (C=O), karboksylowa (–COOH), aminowa (–NH₂).", "v30"], ["Podział sacharydów", "Monosacharydy: 3–10 atomów węgla, grupa karbonylowa i kilka hydroksylowych; rozpuszczalne, osmotycznie czynne. Oligosacharydy: kilka monosacharydów połączonych wiązaniem O-glikozydowym, np. disacharydy. Polisacharydy: polimery wielu monosacharydów; nierozpuszczalne, osmotycznie nieczynne.", "v31"], ["Monosacharydy", "Aldozy mają grupę aldehydową (glukoza), ketozy – ketonową (fruktoza). Według liczby węgli: triozy, tetrozy, pentozy, heksozy. Pentozy i heksozy w roztworze przechodzą między postacią łańcuchową a pierścieniową.", "v31"], ["Znaczenie monosacharydów", "Triozy (aldehyd glicerynowy, dihydroksyaceton) – produkty pośrednie oddychania i fotosyntezy. Ryboza – RNA i ATP. Deoksyryboza – DNA. Glukoza – monomer wielu cukrów, forma transportowa u zwierząt, substrat oddychania. Fruktoza – źródło energii, łatwo przechodzi w glukozę. Galaktoza – składnik laktozy; jej forma utleniona buduje pektyny ściany komórkowej.", "v32"], ["Wiązanie O-glikozydowe", "Łączy dwa cukry przez atom tlenu. Najczęściej 1,4 – między C1 jednej cząsteczki a C4 następnej. Wiązania α rozkładają prawie wszystkie organizmy, β – tylko nieliczne.", "v33"], ["Disacharydy", "Sacharoza = glukoza + fruktoza; forma transportowa cukrów u roślin, zapas w buraku i trzcinie. Laktoza = glukoza + galaktoza; mleko ssaków. Maltoza = glukoza + glukoza; z trawienia skrobi i glikogenu, w nasionach zbóż.", "v33"], ["Polisacharydy", "Nierozpuszczalne, więc pełnią funkcję zapasową lub budulcową. Skrobia: amyloza (nierozgałęziona) + amylopektyna (rozgałęziona); zapas roślin. Glikogen: rozgałęziony; zapas grzybów i zwierząt. Celuloza: nierozgałęziona; ściany roślin i niektórych protistów. Chityna: z glukozaminy; ściany grzybów, oskórek stawonogów.", "v34"], ["Wykrywanie skrobi", "Jodyna (płyn Lugola) barwi skrobię na granatowo. W doświadczeniu z vademecum ziemniak i fasola zabarwiły się, jabłko nie; próbą kontrolną był kleik skrobiowy.", "v34"]]},
{id:"t3",dzial:"d1",name:"Lipidy",note:[["Cechy lipidów", "Głównie C, H i O. Niepolarne – rozpuszczają się w rozpuszczalnikach organicznych (benzen, aceton), nie w wodzie. Mają mniejszą gęstość od wody.", "v35"], ["Podział", "Proste: tłuszcze właściwe (triglicerydy) i woski. Złożone: fosfolipidy i glikolipidy. Izoprenowe: steroidy i karotenoidy.", "v35"], ["Tłuszcze właściwe", "Estry glicerolu i trzech kwasów tłuszczowych. Funkcje: zapasowa, termoizolacyjna, ochronna. Zwierzęce – zwykle stałe, przewaga kwasów nasyconych; roślinne – ciekłe, przewaga nienasyconych (z wiązaniem podwójnym C=C).", "v36"], ["Woski", "Estry alkoholi monohydroksylowych i kwasów tłuszczowych. Funkcje ochronne, izolacyjne, budulcowe. Wosk pszczeli, lanolina, kutykula roślin.", "v36"], ["Lipidy złożone", "Glicerol + 2 kwasy tłuszczowe + grupa hydrofilowa. Fosfolipid: reszta fosforanowa z małym związkiem polarnym (np. choliną). Glikolipid: cukier (np. galaktoza) przyłączony wiązaniem glikozydowym. Hydrofilowa głowa i hydrofobowy ogon – w wodzie same tworzą dwuwarstwę, podstawę błon.", "v36"], ["Funkcje fosfo- i glikolipidów", "Budują błony, są ważnym składnikiem tkanki nerwowej. Glikolipidy wchodzą w skład glikokaliksu, który zwiększa wytrzymałość komórek i umożliwia ich rozpoznawanie.", "v37"], ["Lipidy izoprenowe", "Powstają z izoprenu. Steroidy (pierścieniowe): cholesterol – błony zwierzęce i osłonki nerwów, z niego hormony steroidowe, kwasy żółciowe, witamina D; hormony płciowe (testosteron, estrogeny). Karotenoidy (karoteny, ksantofile): fotosynteza, barwa kwiatów i owoców, prekursory retinalu, antyoksydanty.", "v37"], ["Tłuszcz a glikogen", "Tłuszcze dają więcej energii na jednostkę masy i są magazynowane bez wody.", "k25"], ["Wykrywanie lipidów", "Sudan III barwi tłuszcz na czerwono. W doświadczeniu roztarte nasiona słonecznika zabarwiły się na czerwono; próbą kontrolną była kropla oleju.", "v35"]]},
{id:"t4",dzial:"d1",name:"Aminokwasy i białka",note:[["Aminokwasy", "C, H, O, N; cysteina i metionina także S. Grupa karboksylowa (kwasowa) i aminowa (zasadowa), w aminokwasach białkowych przy tym samym węglu α. Białkowych jest 20; niebiałkowe (ornityna, cytrulina) biorą udział w wytwarzaniu mocznika.", "v37"], ["Aminokwasy egzogenne", "Organizm ich nie wytwarza – muszą być dostarczane z pożywieniem.", "org"], ["Właściwości aminokwasów", "Grupa karboksylowa oddaje proton, aminowa przyjmuje. Zależnie od pH aminokwas jest kationem (niskie pH), jonem obojnaczym albo anionem (wysokie pH). Podział wg podstawnika: kwasowe (asparaginowy, glutaminowy), zasadowe (arginina, histydyna, lizyna), obojętne polarne (np. cysteina, seryna) i niepolarne (np. alanina, glicyna, leucyna).", "v38"], ["Wiązanie peptydowe", "Kowalencyjne spolaryzowane, między grupą karboksylową jednego a aminową drugiego aminokwasu; wydziela się woda. Łańcuch ma koniec N (wolna –NH₂) i koniec C (wolna –COOH). Peptydy: 2–50 aminokwasów, białka: ponad 50.", "v38"], ["Znaczenie peptydów i białek", "Peptydy: wazopresyna (gospodarka wodna), oksytocyna (układ rozrodczy). Białka to ok. 50% suchej masy komórek. Albuminy – ciśnienie osmotyczne i objętość krwi, transport. Globuliny – przeciwciała. Histony – z DNA tworzą chromatynę. Hemoglobina – transport tlenu. Mioglobina – magazyn tlenu w mięśniach. Kolageny – tkanki łączne, wytrzymałość. Keratyny – skóra, włosy, pióra, paznokcie, ochrona.", "v39"], ["Struktura białek", "I – kolejność aminokwasów (wiązania peptydowe). II – α-helisa i β-harmonijka (wiązania wodorowe). III – pofałdowanie łańcucha, kształt białka. IV – dwa lub więcej łańcuchów. III i IV stabilizują: wiązania wodorowe, oddziaływania elektrostatyczne i hydrofobowe, mostki dwusiarczkowe (między grupami –SH cysteiny), siły van der Waalsa.", "v40"], ["Pułapki z matury", "Dowodem struktury IV-rzędowej są co najmniej dwa łańcuchy – sam mostek dwusiarczkowy nie wystarcza. Reszty hydrofobowe są we wnętrzu białka, bo zwija się ono w środowisku wodnym.", "k23"], ["Wysalanie i denaturacja", "Większość białek tworzy z wodą roztwór koloidalny; otoczka wodna zapobiega wytrącaniu. Wysalanie: odwracalne odwodnienie i wytrącenie przez sole metali lekkich (np. sodu). Denaturacja: nieodwracalna zmiana struktury przestrzennej pod wpływem alkoholi, soli metali ciężkich, stężonych kwasów i zasad, wysokiej temperatury.", "v40"], ["Doświadczenie z białkiem jaja", "Temperatura, etanol, H₂SO₄ i NaCl wytrąciły białko. Po dodaniu wody rozpuścił się tylko osad z NaCl – to wysalanie. Pozostałe to denaturacja.", "v43"], ["Rodzaje białek", "Fibrylarne: nierozpuszczalne, budulcowe i ochronne (keratyna, kolagen). Globularne: rozpuszczalne, aktywne metabolicznie (histony, globuliny). Proste: tylko aminokwasy (keratyna, albuminy). Złożone: z częścią niebiałkową – jonem metalu, hemem, cukrem (hemoglobina, mioglobina).", "v43"], ["Wykrywanie białek", "Reakcja biuretowa: niebieski Cu(OH)₂ (z CuSO₄ i NaOH) daje fiolet ze związkami o co najmniej dwóch wiązaniach peptydowych. Im więcej wiązań, tym intensywniejsza barwa.", "v41"]]},
{id:"t5",dzial:"d1",name:"Nukleotydy i kwasy nukleinowe",note:[["Budowa nukleotydu", "Cukier pięciowęglowy (ryboza lub deoksyryboza) + reszta fosforanowa + zasada azotowa (C, T, A, G lub U). Fosforan łączy się z cukrem wiązaniem estrowym, zasada z cukrem – glikozydowym. Nukleozyd to cukier + zasada.", "v44"], ["Zasady azotowe", "Puryny (dwupierścieniowe): guanina, adenina. Pirymidyny (jednopierścieniowe): cytozyna, tymina, uracyl.", "v44"], ["Podział nukleotydów", "Rybonukleotydy: ATP, GTP, CTP, UTP, NAD⁺, FAD. Deoksyrybonukleotydy: dATP, dGTP, dCTP, dTTP. Wg liczby reszt fosforanowych: mono-, di- i trifosforany.", "v44"], ["Funkcje nukleotydów", "Monomery kwasów nukleinowych, nośniki energii (głównie ATP), przenośniki elektronów (NAD⁺, NADP⁺, FAD).", "v44"], ["DNA", "Deoksyryboza, dwie antyrównoległe nici w podwójnej helisie, nukleotydy w nici połączone wiązaniami fosfodiestrowymi. A–T: 2 wiązania wodorowe, G–C: 3. Szczegóły są w vademecum na s. 422.", "kn"], ["RNA", "Ryboza i uracyl zamiast tyminy. mRNA, rRNA i tRNA uczestniczą w syntezie białek.", "knr"], ["ATP", "Adenina + ryboza + 3 reszty fosforanowe; dwa wiązania wysokoenergetyczne między fosforanami. Hydroliza do ADP uwalnia energię.", "atp"]]}];

"pf", "q": "Hemoglobina jest białkiem złożonym.", "a": true, "e": "Zawiera hem z jonem żelaza."}, {"k": "abcd", "q": "Po dodaniu wody osad białka się rozpuścił. Białko było:", "o": ["wysolone", "zdenaturowane temperaturą", "zdenaturowane etanolem", "zdenaturowane kwasem"], "a": 0, "e": "Wraca tylko białko wysolone."}], "t5": [{"k": "abcd", "q": "Nukleozyd to:", "o": ["cukier + zasada azotowa", "cukier + fosforan", "zasada + fosforan", "nukleotyd z 3 fosforanami"], "a": 0, "e": "Nukleotyd = nukleozyd + reszta fosforanowa."}, {"k": "para", "q": "Dopasuj", "p": [["Puryny", "adenina, guanina"], ["Pirymidyny", "cytozyna, tymina, uracyl"], ["DNA", "deoksyryboza"], ["RNA", "ryboza"]]}, {"k": "pf", "q": "Uracyl występuje w DNA.", "a": false, "e": "Uracyl – RNA; tymina – DNA."}, {"k": "abcd", "q": "Substratem syntezy DNA NIE jest:", "o": ["ATP", "dATP", "dGTP", "dTTP"], "a": 0, "e": "ATP to rybonukleotyd. Klucz CKE nie uznaje ATP zamiast dATP."}, {"k": "luka", "q": "Między A i T tworzą się ___ wiązania wodorowe.", "o": ["2", "3", "1", "4"], "a": 0, "e": "G–C: 3 wiązania."}, {"k": "abcd", "q": "Przenośnikiem elektronów jest:", "o": ["NAD⁺", "dTTP", "glukoza", "uracyl"], "a": 0, "e": "Także NADP⁺ i FAD."}, {"k": "pf", "q": "Fosforan łączy się z cukrem w nukleotydzie wiązaniem estrowym.", "a": true, "e": "Cukier z zasadą – wiązaniem glikozydowym."}, {"k": "abcd", "q": "Nukleotydy w jednej nici DNA łączą wiązania:", "o": ["fosfodiestrowe", "peptydowe", "wodorowe", "glikozydowe"], "a": 0, "e": "Wodorowe łączą dwie nici."}, {"k": "abcd", "q": "FAD zawiera witaminę:", "o": ["B₂ (ryboflawinę)", "C", "D", "A"], "a": 0, "e": "NAD⁺ zawiera amid kwasu nikotynowego."}, {"k": "para", "q": "Dopasuj wiązanie", "p": [["Disacharyd", "O-glikozydowe"], ["Wosk", "estrowe"], ["Dipeptyd", "peptydowe"], ["Dwie nici DNA", "wodorowe"]]}, {"k": "pf", "q": "ATP zawiera deoksyrybozę.", "a": false, "e": "ATP = adenina + ryboza + 3 fosforany."}]};

TEMATY.push({"id": "t8", "dzial": "d2", "name": "Budowa komórek", "note": [["Poziomy organizacji", "Organizmy jednokomórkowe – jedna komórka wykonuje wszystkie czynności życiowe (bakterie, protisty, część grzybów i roślin). Formy kolonijne – zespoły komórek połączonych ścianami lub galaretowatą otoczką (bakterie, protisty). Wielokomórkowe plechowe – ciało słabo zróżnicowane, bez tkanek (część protistów, grzybów, rośliny pierwotnie wodne). Wielokomórkowe tkankowe – wyraźne tkanki (większość roślin i zwierzęta).", "v48"], ["Dlaczego komórki są małe", "Gdy komórka rośnie, objętość zwiększa się szybciej niż powierzchnia. Sześcian o krawędzi 1 cm ma stosunek powierzchni do objętości 6 : 1, a o krawędzi 2 cm – tylko 3 : 1. Mała komórka ma względnie dużą powierzchnię, więc sprawniej wymienia substancje z otoczeniem.", "v48"], ["Prokarionty a eukarionty – cechy wspólne", "Obie komórki otacza błona komórkowa, często też ściana. Wnętrze wypełnia cytozol. Materiałem genetycznym jest DNA. Obie mają rybosomy.", "v49"], ["Prokarionty a eukarionty – różnice", "Prokarionty: ściana z peptydoglikanu (mureiny); DNA zwykle koliste, leży w cytozolu bez otoczki; brak systemu błon wewnętrznych. Eukarionty: ściana z polisacharydów (celuloza u roślin, chityna u grzybów); DNA liniowe, w jądrze z otoczką; liczne błony dzielą komórkę na przedziały (kompartmenty).", "v49"], ["Chromosom bakteryjny i eukariotyczny", "Chromosom bakteryjny to kolista cząsteczka DNA tworząca kilkadziesiąt pętli. Pętle stabilizują zasadowe białka niehistonowe. Chromosomy eukariotyczne są liniowe, a DNA jest nawinięte na białka histonowe, tworząc nukleosomy.", "v49"], ["Komórka bakterii", "Bakteria heterotroficzna: ściana, często otoczka śluzowa, błona, cytozol, chromosom bakteryjny, plazmidy, rybosomy, rzęska, substancje zapasowe. Sinica (bakteria autotroficzna) ma dodatkowo tylakoidy – wewnętrzne błony z barwnikami fotosyntetycznymi.", "v50"], ["Komórka zwierzęca", "Ma jądro, mitochondria, siateczkę szorstką i gładką, aparat Golgiego, lizosomy, peroksysomy, rybosomy i cytoszkielet z mikrotubulami. Nie ma ściany komórkowej ani plastydów. Może mieć drobne wodniczki.", "v50"], ["Komórka roślinna", "Ma ścianę celulozową, plazmodesmy, plastydy (chloroplasty, leukoplasty) i dużą wakuolę. Poza tym te same organelle co komórka zwierzęca: jądro, mitochondria, ER, aparat Golgiego, peroksysomy, rybosomy.", "v51"], ["Komórka grzybowa", "Ściana zbudowana głównie z chityny. Materiałem zapasowym jest glikogen. Ma wakuole, mitochondria, ER, aparat Golgiego, peroksysomy. Nie ma plastydów.", "v51"]]});
TEMATY.push({"id": "t9", "dzial": "d2", "name": "Błony i transport", "note": [["Kompartmentacja", "Błony dzielą komórkę eukariotyczną na przedziały, w których panują różne warunki. Przykłady pH: cytozol i jądro ok. 7,2, mitochondrium ok. 8, lizosom ok. 4,7, aparat Golgiego 6–6,7. Dzięki temu w jednej komórce mogą jednocześnie zachodzić procesy wymagające innych warunków.", "v52"], ["Model płynnej mozaiki", "Błona to dwuwarstwa fosfolipidów, w której pływają białka. W błonie zwierzęcej jest też cholesterol. Na zewnętrznej stronie są glikolipidy i glikoproteiny, których łańcuchy cukrowe tworzą glikokaliks.", "v52"], ["Białka błonowe – położenie", "Białka integralne wnikają w dwuwarstwę. Transbłonowe przebijają ją na wylot (hydrofobowa α-helisa lub β-harmonijka), nieprzebijające wnikają tylko w jedną warstwę. Białka powierzchniowe są hydrofilowe i nie wnikają do dwuwarstwy.", "v53"], ["Białka błonowe – funkcje", "Transportujące – przenoszą substancje (np. pompa sodowo-potasowa). Kotwiczące – zwiększają wytrzymałość błony (np. spektryna). Receptorowe – odbierają sygnały, np. hormony. Enzymatyczne – przyspieszają reakcje (np. cyklaza adenylanowa).", "v53"], ["Płynność błony", "Fosfolipidy przemieszczają się w obrębie warstwy, obracają się, rzadziej przechodzą do drugiej warstwy (ruch flip-flop). Razem z nimi przemieszczają się białka.", "v54"], ["Transport bierny", "Zgodny z gradientem stężeń, bez nakładu energii. Dyfuzja prosta – bezpośrednio przez lipidy: małe cząsteczki niepolarne (O₂, CO₂) i woda w osmozie. Dyfuzja ułatwiona – przez białka kanałowe lub nośnikowe: jony, małe polarne cząsteczki, np. glukoza, aminokwasy.", "v54"], ["Transport czynny", "Wbrew gradientowi stężeń, wymaga energii (ATP). Zachodzi przez białka nośnikowe lub pompy, np. pompa sodowo-potasowa, pompa protonowa.", "v54"], ["Transport sprzężony", "Przeniesienie jednej substancji zależy od przeniesienia drugiej. Symport – obie w tym samym kierunku. Antyport – w przeciwnych kierunkach.", "v55"], ["Osmoza", "Osmoza to przenikanie wody przez błonę półprzepuszczalną z roztworu hipotonicznego (niższe stężenie) do hipertonicznego (wyższe stężenie). Przy roztworach izotonicznych woda przepływa w obie strony w równej ilości.", "v55"], ["Osmoza w komórkach", "Roztwór izotoniczny – komórka zachowuje kształt. Hipertoniczny – komórka traci wodę: erytrocyt się kurczy, w komórce roślinnej protoplast odstaje od ściany (plazmoliza). Hipotoniczny – komórka pobiera wodę: erytrocyt pęka, komórka roślinna osiąga pełny turgor, bo ściana nie pozwala jej pęknąć.", "v56"], ["Doświadczenie: substancje osmotycznie czynne", "Lejek z błoną półprzepuszczalną wstawia się do wody. Z roztworem glukozy poziom w rurce rośnie, z zawiesiną skrobi i z samą wodą (kontrola) się nie zmienia. Wniosek: glukoza jest osmotycznie czynna, skrobia – bierna.", "v57"], ["Transport pęcherzykowy", "Endocytoza – pobieranie substancji do komórki w pęcherzykach z błony. Fagocytoza – pochłanianie dużych cząstek, np. bakterii. Pinocytoza – pobieranie kropli płynu. Egzocytoza – pęcherzyk łączy się z błoną i wylewa zawartość na zewnątrz; tak komórka wydziela np. hormony, enzymy trawienne, a także dostarcza lipidy i białka do błony.", "v58"]]});
TEMATY.push({"id": "t10", "dzial": "d2", "name": "Jądro, cytozol i cytoszkielet", "note": [["Budowa jądra", "Otoczka jądrowa – dwie błony oddzielające jądro od cytozolu. Pory jądrowe – kompleksy białkowe w otoczce, przez które substancje przechodzą między jądrem a cytozolem. Kariolimfa – płyn z białkami enzymatycznymi i RNA. Jąderko – fragment chromatyny z genami rRNA; powstają w nim podjednostki rybosomów. Chromatyna – DNA nawinięty na histony.", "v59"], ["Euchromatyna i heterochromatyna", "Euchromatyna jest luźno upakowana i zawiera aktywne geny, które można odczytywać. Heterochromatyna jest ściśle upakowana i zawiera geny nieaktywne oraz dużo DNA pozagenowego.", "v59"], ["Upakowanie DNA", "Kolejne poziomy: podwójna helisa DNA → nukleosomy (DNA nawinięty na rdzeń z 8 histonów, połączone DNA łącznikowym) → włókno 30 nm (w interfazie) → pętle → spirala 300 nm → chromosom metafazowy. Łączna długość DNA w jednej komórce człowieka to ok. 2 m.", "v60"], ["Chromosom metafazowy", "Najbardziej skondensowana postać DNA. Składa się z dwóch identycznych chromatyd siostrzanych połączonych w centromerze, który dzieli chromosom na ramiona. Do centromeru przyczepiają się włókna wrzeciona podziałowego.", "v60"], ["Cytozol", "Roztwór koloidalny: woda z rozpuszczonymi związkami, głównie białkami. Zawiera też białka włókienkowe cytoszkieletu. Jest środowiskiem wielu reakcji i pośredniczy w transporcie między organellami.", "v61"], ["Obserwacja ruchu cytozolu", "Preparat z liści moczarki kanadyjskiej ogrzanej w wodzie ok. 37°C i oświetlonej żarówką. Pod mikroskopem widać, jak chloroplasty przemieszczają się razem z cytozolem.", "v61"], ["Elementy cytoszkieletu", "Filamenty aktynowe (mikrofilamenty) – z aktyny, ok. 7 nm, najwięcej pod błoną. Filamenty pośrednie – z różnych białek, np. keratyny, ok. 10 nm, sztywne, sieć od jądra do błony. Mikrotubule – z tubuliny, puste rurki ok. 25 nm, dynamiczne: wydłużają się i skracają.", "v61"], ["Funkcje cytoszkieletu", "Mikrofilamenty: zmiana kształtu komórki, ruch pełzakowaty, skurcz mięśni, ruch organelli i cytozolu, fagocytoza. Filamenty pośrednie: wytrzymałość mechaniczna (dużo ich w nabłonku), wzmacniają otoczkę jądrową. Mikrotubule: utrzymują położenie organelli, szlaki transportu, wrzeciono podziałowe, szkielet rzęsek i wici.", "v62"], ["Centriole", "Zbudowane z mikrotubul ułożonych w cylinder, głównie w komórkach zwierzęcych. Dwie centriole ułożone prostopadle tworzą centrosom – ośrodek formowania wrzeciona podziałowego.", "v62"], ["Wici i rzęski", "Wypustki cytoplazmy okryte błoną, wyrastające z ciałka podstawowego. Szkielet tworzą mikrotubule w układzie 9 par na obwodzie + 1 para w środku. Różnią się tylko liczbą i długością: rzęski są krótkie i liczne (pantofelek), wici długie, pojedyncze lub po kilka (euglena).", "v62"]]});
TEMATY.push({"id": "t11", "dzial": "d2", "name": "Organelle", "note": [["Organelle półautonomiczne", "Mitochondria i plastydy mają własne DNA i rybosomy, więc same wytwarzają część swoich białek. Są częściowo niezależne od jądra.", "v63"], ["Teoria endosymbiozy", "Cudzożywna komórka pochłonęła bakterie tlenowe, które nie zostały strawione i stały się mitochondriami. Później u przodków roślin pochłonięte bakterie fotosyntetyzujące stały się chloroplastami. Otoczka jądrowa i ER powstały z wpukleń błony komórkowej.", "v63"], ["Dowody endosymbiozy", "Mitochondria i plastydy mają koliste DNA bez histonów, rybosomy podobne do prokariotycznych (70S), dwie błony podobne do błon bakterii i powstają tylko przez podział już istniejących.", "v63"], ["Mitochondria", "Występują w komórkach oddychających tlenowo (nie ma ich np. w erytrocytach ssaków). Dwie błony: zewnętrzna gładka i przepuszczalna, wewnętrzna pofałdowana w grzebienie z białkami transportującymi. Matriks zawiera enzymy, rybosomy i DNA. Funkcja: oddychanie tlenowe i wytwarzanie ATP. Im większe zapotrzebowanie na energię, tym więcej mitochondriów (mięśnie, neurony).", "v64"], ["Rodzaje plastydów", "Wszystkie powstają z proplastydów lub przez podział dojrzałych plastydów. Barwne: chloroplasty, etioplasty, chromoplasty. Bezbarwne (leukoplasty): amyloplasty i elajoplasty. Plastydy mogą się przekształcać w siebie, np. pod wpływem światła.", "v64"], ["Chloroplast", "Dwie błony: zewnętrzna przepuszczalna, wewnętrzna wybiórczo przepuszczalna. Wewnątrz tylakoidy gran (stosy woreczków) i tylakoidy stromy (kanaliki łączące grana). W błonach tylakoidów są barwniki, przenośniki elektronów i enzymy. Stroma zawiera enzymy, rybosomy, DNA i ziarna skrobi.", "v65"], ["Siateczka śródplazmatyczna (ER)", "Szorstka (RER) ma rybosomy: syntetyzuje białka, które w cysternach uzyskują strukturę III-rzędową i w pęcherzykach trafiają do aparatu Golgiego. Gładka (SER) nie ma rybosomów: synteza lipidów (fosfolipidy, glikolipidy, cholesterol), neutralizacja toksyn (wątroba), magazyn jonów wapnia (mięśnie).", "v66"], ["Rybosomy", "Nieobłonione, zbudowane z rRNA i białek, z dwóch podjednostek. Syntetyzują białka. Na rybosomach związanych z ER powstają białka wydzielane, błonowe i enzymy lizosomów; reszta na rybosomach wolnych. Eukariotyczne 80S (40S + 60S), prokariotyczne 70S (30S + 50S). Rybosomy chloroplastów to 70S, mitochondriów roślin 78S, ssaków 55S.", "v66"], ["Lizosomy", "Pęcherzyki z jedną błoną w komórkach zwierzęcych, zawierające enzymy hydrolityczne aktywne w pH ok. 5. Kwaśne środowisko utrzymują pompy protonowe w błonie. Błonę od środka chroni warstwa odpornych cukrów. Funkcja: trawienie wewnątrzkomórkowe zużytych organelli i materiału z endocytozy.", "v67"], ["Aparat Golgiego", "Stos płaskich cystern, od których odrywają się pęcherzyki. Powstaje z pęcherzyków RER. Najwięcej go w komórkach wydzielniczych (tarczyca, ślinianki). Funkcja: modyfikowanie, sortowanie i transport białek.", "v67"], ["Droga białka wydzielanego", "1) Pęcherzyki z białkami odrywają się od RER i płyną do aparatu Golgiego. 2) Tam białka są modyfikowane, np. fosforylowane lub łączone z cukrem. 3) Gotowe białka trafiają do pęcherzyków. 4) Pęcherzyki zlewają się z błoną i wydzielają zawartość (egzocytoza). 5) Enzymy lizosomowe też przechodzą przez RER i Golgiego, a pęcherzyki z nimi stają się lizosomami.", "v68"], ["Peroksysomy", "Drobne pęcherzyki z jedną błoną we wszystkich komórkach eukariotycznych, dużo ich w wątrobie. Rozkładają kwasy tłuszczowe do jednostek dwuwęglowych, wytwarzają mielinę, neutralizują leki i alkohol. Powstaje w nich szkodliwy H₂O₂, który rozkłada katalaza do wody i tlenu.", "v68"], ["Wakuola roślinna", "Pęcherzyk otoczony jedną błoną – tonoplastem, wypełniony sokiem komórkowym. Utrzymuje turgor, magazynuje jony, cukry i białka zapasowe, odkłada uboczne produkty (kryształy szczawianu wapnia), gromadzi glikozydy (barwa kwiatów) oraz alkaloidy i garbniki (obrona).", "v69"], ["Wodniczki protistów", "Pokarmowe – powstają w endocytozie (fago- lub pinocytozie). Tętniące – u protistów słodkowodnych w środowisku hipotonicznym; usuwają nadmiar wody.", "v69"]]});
TEMATY.push({"id": "t12", "dzial": "d2", "name": "Ściana i połączenia komórek", "note": [["Ściana komórkowa – skład", "Występuje u bakterii (mureina), grzybów (chityna), roślin (głównie celuloza) i części protistów. U roślin łańcuchy celulozy łączą się wiązaniami wodorowymi w mikrofibryle. Przestrzenie między nimi wypełnia macierz: hemicelulozy, pektyny, białka i woda.", "v69"], ["Funkcje ściany", "Nadaje kształt, chroni przed uszkodzeniem i przed pęknięciem w roztworze hipotonicznym, zabezpiecza przed patogenami, uczestniczy w transporcie wody.", "v69"], ["Budowa ściany", "Cząsteczki celulozy → fibryle elementarne → mikrofibryle (podstawowa jednostka ściany) → makrofibryle → przestrzenna sieć wypełniona pektynami, hemicelulozami i wodą.", "v69"], ["Ściana pierwotna i wtórna", "Pierwotna okrywa młode, rosnące komórki: mało celulozy, dużo wody, hemiceluloz, pektyn i białek, cienkie nieregularne włókna. Wtórna okrywa komórki wyrośnięte i wyspecjalizowane: dużo celulozy, grube regularne włókna, często warstwy.", "v70"], ["Inkrustacja", "Wysycanie – substancje wnikają między włókna celulozy. Lignina (drewnik) usztywnia ściany i umożliwia pionowy transport wody, np. w drewnie. Krzemionka wzmacnia ściany skrzypów i niektórych traw, chroni przed patogenami i roślinożercami.", "v70"], ["Adkrustacja", "Powlekanie – substancje odkładają się na powierzchni ściany. Kutyna w kutykuli skórki chroni przed parowaniem. Suberyna w korkowicy usztywnia i nie przepuszcza wody. Śluzy (nasiona lnu, pigwy) chłoną wodę. Gumy wydzielają drzewa w miejscach zranień.", "v70"], ["Połączenia u roślin", "Blaszka środkowa z pektyn spaja ściany pierwotne sąsiednich komórek; gdy się rozpuści, komórki się rozsuwają. Plazmodesmy to kanały cytoplazmy otoczone błoną, przechodzące przez ściany; łączą ER sąsiednich komórek i przewodzą np. aminokwasy i kwasy nukleinowe. Mogą się otwierać i zamykać.", "v71"], ["Połączenia u zwierząt", "Zamykające – uszczelniają nabłonek, tylko w tkance nabłonkowej, w szczytowej części komórek. Desmosomy – mechanicznie spajają komórki, połączone z filamentami pośrednimi; półdesmosomy łączą komórki z błoną podstawną. Szczelinowe (neksus) – kanały z koneksonów, przez które przechodzą jony i małe cząsteczki; w nabłonku, tkance nerwowej i mięśniu sercowym.", "v71"]]});
TEMATY.push({"id": "t13", "dzial": "d2", "name": "Cykl komórkowy i podziały", "note": [["Cykl komórkowy", "Interfaza (G₁, S, G₂) i faza M (mitoza + cytokineza). G₁ – wzrost komórki. S – replikacja DNA i synteza histonów. G₂ – synteza białek do podziału, podział mitochondriów i plastydów. G₀ – spoczynek komórek, które się różnicują.", "v72"], ["Regulacja cyklu", "Białka regulatorowe zatrzymują cykl w punktach kontrolnych: w G₁ przy uszkodzonym DNA lub złych warunkach, w S i G₂ przy nieukończonej replikacji lub uszkodzeniu DNA, w M gdy chromosomy są źle przyczepione do wrzeciona. Zapobiega to powstawaniu komórek nieprawidłowych, np. nowotworowych.", "v72"], ["Mitoza – etapy", "Profaza: kondensacja chromatyny w chromosomy z dwóch chromatyd, zanik otoczki i jąderka, powstaje wrzeciono. Metafaza: maksymalna kondensacja, chromosomy w płytce metafazowej na równiku. Anafaza: chromatydy rozdzielają się i wędrują do biegunów. Telofaza: chromosomy się rozluźniają, odtwarzają się otoczka i jąderko, zaczyna się cytokineza.", "v73"], ["Wrzeciono podziałowe", "Struktura z mikrotubul, która przemieszcza chromosomy w czasie podziału. U zwierząt zanika w telofazie, u roślin uczestniczy jeszcze w cytokinezie.", "v73"], ["Cytokineza", "Podział cytoplazmy. U zwierząt zaczyna się w anafazie: mikrofilamenty tworzą pierścień kurczliwy i bruzdę podziałową. U roślin na początku telofazy: wrzeciono cytokinetyczne, pęcherzyki Golgiego układają się na równiku i budują przegrodę.", "v74"], ["Crossing-over", "Wymiana odcinków chromatyd między chromosomami homologicznymi w profazie I. Powstają chromatydy z nowym układem alleli, więc potomstwo różni się od rodziców.", "v74"], ["Mejoza I (redukcyjna)", "Profaza I: kondensacja, koniugacja homologów w biwalenty (tetrady chromatyd), crossing-over, zanik otoczki i jąderka, wrzeciono. Metafaza I: pary homologów na równiku. Anafaza I: homologi rozchodzą się do biegunów. Telofaza I: częściowe rozluźnienie, odtworzenie otoczki, cytokineza.", "v75"], ["Mejoza II", "Przebiega jak mitoza: profaza II, metafaza II (płytka metafazowa), anafaza II (rozdział chromatyd), telofaza II (rozluźnienie, otoczki, cytokineza). Wynik: 4 komórki haploidalne.", "v76"], ["Mitoza a mejoza", "Mitoza: komórki somatyczne (2n i n), jeden podział, 2 komórki identyczne z macierzystą, bez rekombinacji; wzrost, regeneracja, wymiana komórek, rozmnażanie bezpłciowe. Mejoza: komórki macierzyste gamet u zwierząt i mejospor; dwa podziały, 4 komórki z połową chromosomów, crossing-over; rozmnażanie płciowe, zmienność, stała liczba chromosomów gatunku.", "v76"], ["Ilość DNA w cyklu", "Komórka 2n po G₁ ma 2c. Po fazie S: 2n 4c. Po mitozie: dwie komórki 2n 2c. W mejozie: 2n 4c → po mejozie I 1n 2c → po mejozie II 1n 1c.", "v77"], ["Apoptoza", "Zaprogramowana, kontrolowana genetycznie śmierć komórki. Etapy: sygnał, kurczenie i utrata wody, fragmentacja DNA, rozpad cytoszkieletu, zanik otoczki, uwypuklanie błony, rozpad na ciałka apoptotyczne, pochłanianie przez makrofagi. Usuwa komórki uszkodzone i zbędne, np. ogon kijanki.", "v77"]]});

const CKE_SHEETS=[{"key": "m23", "name": "CKE maj 2023", "f": "Formuła 2023", "arkusz": "https://biologhelp.pl/sites/default/files/materialy_maturalne/biologia_2023_pr_maj.pdf", "klucz": "https://biologhelp.pl/sites/default/files/materialy_maturalne/biologia_2023_pr_maj_klucz.pdf", "online": "https://biologhelp.pl/matura/matura-maj-2023-poziom-rozszerzony-formula-2023"}];
const CKE=[{"id": "ck-m23-1-1", "sh": "m23", "n": "1.1", "dz": "d3", "t": "", "max": 1, "cl": 1, "q": "Kompleks dehydrogenazy pirogronianowej (enzymy E1–E3). Przyporządkuj enzym do typu reakcji: transacetylacja, dehydrogenacja, dekarboksylacja.", "key": ["transacetylacja – E2; dehydrogenacja – E3; dekarboksylacja – E1"], "zas": "1 pkt – za poprawne przyporządkowanie trzech oznaczeń enzymów do typów przeprowadzanych reakcji. 0 pkt – za odpowiedź niespełniającą wymagań na 1 pkt albo za brak odpowiedzi.", "uw": "Uznaje się odpowiedzi, w których użyto znaków normalnej wielkości zamiast indeksów dolnych, np. E1 zamiast E1."}, {"id": "ck-m23-1-2", "sh": "m23", "n": "1.2", "dz": "d3", "t": "", "max": 1, "cl": 1, "q": "Gdzie w komórce eukariotycznej działa kompleks dehydrogenazy pirogronianowej? A. cytozol B. macierz mitochondrialna C. zewnętrzna błona mitochondrium D. wewnętrzna błona mitochondrium E. przestrzeń międzybłonowa", "key": ["B"], "zas": "1 pkt – za wybór poprawnej odpowiedzi. 0 pkt – za odpowiedź niespełniającą wymagań na 1 pkt albo za brak odpowiedzi.", "uw": ""}, {"id": "ck-m23-1-3", "sh": "m23", "n": "1.3", "dz": "d3", "t": "", "max": 1, "cl": 0, "q": "Wykaż, że kompleks dehydrogenazy pirogronianowej jest konieczny do połączenia glikolizy z cyklem Krebsa.", "key": ["Dehydrogenaza pirogronianowa umożliwia wytworzenie z pirogronianu acetylo-CoA. Pirogronian jest produktem glikolizy, a acetylo-CoA – substratem cyklu Krebsa.", "Umożliwia to przekształcenie pirogronianu powstającego w glikolizie do acetylo-CoA, który jest substratem cyklu Krebsa."], "zas": "1 pkt – za poprawne wykazanie, że funkcjonowanie dehydrogenazy pirogronianowej jest konieczne do połączenia szlaku glikolizy z cyklem Krebsa, uwzględniające produkt glikolizy – pirogronian i substrat cyklu Krebsa – acetylo-CoA. 0 pkt – za odpowiedź niespełniającą wymagań na 1 pkt albo za brak odpowiedzi.", "uw": "Uznaje się odpowiedzi, w których użyto alternatywnych określeń cyklu Krebsa, np.: cykl kwasów trójkarboksylowych, cykl kwasu cytrynowego, CKT. Uznaje się odpowiedzi, w których użyto alternatywnych określeń acetylo-CoA, np.: aktywny octan, czynny octan."}, {"id": "ck-m23-1-4", "sh": "m23", "n": "1.4", "dz": "d3", "t": "", "max": 1, "cl": 0, "q": "Wykaż, że spadek aktywności dehydrogenazy pirogronianowej zwiększa stężenie mleczanu w mięśniu szkieletowym.", "key": ["Powstający w glikolizie pirogronian jest przetwarzany przez kompleks dehydrogenazy pirogronianowej do acetylo-CoA. Jeżeli ta reakcja jest ograniczona, to nadmiar pirogronianu zostaje przekształcony w mleczan.", "Ograniczenie tlenowych przemian pirogronianu powoduje, że w komórce rośnie jego stężenie ze względu na stale zachodzącą glikolizę. Nadmiar pirogronianu w komórce zostaje zredukowany do mleczanu."], "zas": "1 pkt – za poprawne wykazanie, że zmniejszenie aktywności kompleksu dehydrogenazy pirogronianowej prowadzi do wzrostu stężenia mleczanu w komórce, uwzględniające powstawanie pirogronianu (w glikolizie), który nie może być w całości utleniony w reakcji pomostowej, i przekształcanie ciągle powstającego pirogronianu (nadmiaru pirogronianu) w mleczan.", "uw": "Nie uznaje się odpowiedzi odnoszących się do całkowitej utraty aktywności przez kompleks dehydrogenazy pirogronianowej, np. „Zahamowanie powstawania acetylo-CoA spowoduje redukcję pirogronianu do mleczanu”."}, {"id": "ck-m23-2-1", "sh": "m23", "n": "2.1", "dz": "d6", "t": "", "max": 1, "cl": 0, "q": "Goryczka wiosenna – podaj nazwy elementów okwiatu oznaczonych na rysunku literami A i B.", "key": ["A. korona / płatek (korony) / płatki (korony) / działki korony B. kielich / działka kielicha / działki kielicha"], "zas": "1 pkt – za podanie poprawnych nazw dwóch elementów okwiatu goryczki wiosennej. 0 pkt – za odpowiedź niespełniającą wymagań na 1 pkt albo za brak odpowiedzi.", "uw": "Nie uznaje się odpowiedzi „działka okwiatu”, ponieważ odnosi się ona do obydwu pięter okwiatu – kielicha i korony (odpowiedź zbyt ogólna). Dopuszcza się odpowiedzi: A – „płatek (o)kwiatu”, B – „kielich (o)kwiatu”."}, {"id": "ck-m23-2-2", "sh": "m23", "n": "2.2", "dz": "d6", "t": "", "max": 1, "cl": 1, "q": "Podkreśl właściwe: goryczka należy do (nagonasiennych / okrytonasiennych); pokoleniem dominującym jest (gametofit / sporofit).", "key": ["Goryczka wiosenna należy do ( nagonasiennych / okrytonasiennych). W przemianie pokoleń goryczki wiosennej pokoleniem dominującym jest ( gametofit / sporofit)."], "zas": "1 pkt – za wybór dwóch poprawnych określeń. 0 pkt – za odpowiedź niespełniającą wymagań na 1 pkt albo za brak odpowiedzi.", "uw": ""}, {"id": "ck-m23-2-3", "sh": "m23", "n": "2.3", "dz": "d6", "t": "", "max": 1, "cl": 0, "q": "Wykaż, że produkcja barwnika w kwiatach jest korzystna dla goryczki mimo kosztów energetycznych.", "key": ["Dzięki barwnym kwiatom goryczka przywabia zapylacze.", "Roślina jest niewielka, a dzięki barwnym kwiatom jest widoczna dla zapylaczy."], "zas": "1 pkt – za poprawne wykazanie, że produkcja barwnika jest korzystna dla goryczki wiosennej, odnoszące się do korzyści związanych z możliwością przywabiania owadów będących zapylaczami goryczki. 0 pkt – za odpowiedź niespełniającą wymagań na 1 pkt albo za brak odpowiedzi.", "uw": "Nie uznaje się odpowiedzi odnoszących się wyłącznie do przywabiania zwierząt, bez odniesienia do korzyści dla rośliny – zapylania, np. „Barwne kwiaty przywabiają owady”."}, {"id": "ck-m23-3-1", "sh": "m23", "n": "3.1", "dz": "d2", "t": "t13", "max": 1, "cl": 1, "q": "Na schematach cyklu życiowego roślin (A) i krążkopławów (B) zaznacz „R!” etap, w którym zachodzi mejoza.", "key": ["A (rośliny): R! przy przejściu sporofit → zarodniki. B (krążkopławy): R! przy przejściu meduza → gamety."], "zas": "1 pkt – za poprawne zaznaczenie mejozy na schemacie A i na schemacie B. 0 pkt – za odpowiedź niespełniającą wymagań na 1 pkt albo za brak odpowiedzi.", "uw": "Uznaje się odpowiedzi, w których zamiast symbolu „R!” użyto symboli „R” lub „!”, lub innych jednoznacznych oznaczeń."}, {"id": "ck-m23-3-2", "sh": "m23", "n": "3.2", "dz": "d2", "t": "t13", "max": 1, "cl": 0, "q": "Wykaż, że mejoza jest niezbędna do zamknięcia cyklu życiowego eukariontów rozmnażających się płciowo.", "key": ["W czasie rozmnażania płciowego liczba chromosomów ulega podwojeniu, a mejoza ją zmniejsza, co umożliwia zachowanie stałej liczby chromosomów u gatunku.", "Mejoza zapobiega podwajaniu się liczby chromosomów w każdym kolejnym pokoleniu rozmnażającym się płciowo."], "zas": "1 pkt – za poprawne wykazanie, że mejoza jest niezbędna do zamknięcia cyklu życiowego eukariontów rozmnażających się płciowo, uwzględniające w sposób bezpośredni lub opisowy podwojenie (wzrost) liczby chromosomów w czasie zapłodnienia i konieczność jej redukcji podczas mejozy. 0 pkt – za odpowiedź niespełniającą wymagań na 1 pkt albo za brak odpowiedzi.", "uw": "Nie uznaje się odpowiedzi niepełnych – odnoszących się tylko do powstawania gamet, ale nieuwzględniających zmian liczby chromosomów, np. „To stwierdzenie jest prawdziwe, ponieważ mejoza umożliwia wytworzenie gamet, niezbędnych do rozmnażania płciowego”."}, {"id": "ck-m23-5-1", "sh": "m23", "n": "5.1", "dz": "d3", "t": "", "max": 2, "cl": 0, "q": "Cykl Calvina u roślin C4 – podaj nazwy etapów A, B i C.", "key": ["A. karboksylacja (RuBP); odpowiedź dopuszczalna: asymilacja węgla / asymilacja CO2 B. redukcja (PGA); odpowiedź dopuszczalna: hydrogenacja PGA / uwodornienie PGA C. regeneracja (akceptora CO2 – RuBP); odpowiedź dopuszczalna: odtworzenie RuBP"], "zas": "2 pkt – za podanie poprawnych nazw trzech etapów cyklu Calvina. 1 pkt – za podanie poprawnych nazw dwóch etapów cyklu Calvina. 0 pkt – za odpowiedź niespełniającą wymagań na 1 pkt albo za brak odpowiedzi.", "uw": ""}, {"id": "ck-m23-5-2", "sh": "m23", "n": "5.2", "dz": "d3", "t": "", "max": 1, "cl": 1, "q": "Dokończ zdanie: literą X na schemacie (szlak C4) oznaczono A. RuBisCO / B. acetylo-CoA / C. szczawiooctan, który jest 1. pierwotnym produktem karboksylacji u C4 / 2. kompleksem enzymatycznym karboksylacji / 3. pierwotnym akceptorem CO₂.", "key": ["C1"], "zas": "1 pkt – za poprawne dokończenie zdania. 0 pkt – za odpowiedź niespełniającą wymagań na 1 pkt albo za brak odpowiedzi.", "uw": ""}, {"id": "ck-m23-5-3", "sh": "m23", "n": "5.3", "dz": "d3", "t": "", "max": 2, "cl": 1, "q": "P/F o fotosyntezie C4: 1. CO₂ trafia do pochwy okołowiązkowej jako pirogronian; 2. obecność RuBisCO powoduje intensywne fotooddychanie u C4; 3. redukcja PGA do aldehydu 3-fosfoglicerynowego zachodzi w mezofilu.", "key": ["1. – F, 2. – F, 3. – F."], "zas": "2 pkt – za poprawną ocenę trzech stwierdzeń. 1 pkt – za poprawną ocenę dwóch stwierdzeń. 0 pkt – za odpowiedź niespełniającą wymagań na 1 pkt albo za brak odpowiedzi.", "uw": ""}, {"id": "ck-m23-5-4", "sh": "m23", "n": "5.4", "dz": "d3", "t": "", "max": 2, "cl": 0, "q": "Wykaż związek ograniczenia fotooddychania u C4 z: 1. dwuetapowym wiązaniem CO₂, 2. brakiem PS II w komórkach pochwy okołowiązkowej.", "key": ["1. To pozwala na znaczne zwiększenie stężenia CO2 w komórkach, gdzie znajduje się RuBisCO wiążące CO2. 2. Dzięki temu nie jest wytwarzany tlen, który konkurowałby z CO2 o miejsce aktywne RuBisCO.", "1. Dwuetapowy mechanizm wiązania CO2 umożliwia wzrost stężenia CO2 w komórkach pochwy okołowiązkowej, przez co RuBisCO częściej łączy się z CO2 niż z O2. 2. Ponieważ w komórce brak jest PS II, nie powstaje tlen z fotolizy wody, który przy wysokiej temperaturze otoczenia częściej niż CO2 przyłączyłby się do RuBisCO, czyli wzmagałoby to fotooddychanie."], "zas": "2 pkt – za poprawne wykazanie związku między ograniczeniem procesu fotooddychania a: 1. dwuetapowym mechanizmem wiązania dwutlenku węgla z uwzględnieniem wysokiej dostępności CO2 dla RuBisCO ORAZ 2. brakiem PSII w komórkach pochew okołowiązkowych z uwzględnieniem niskiej dostępności O2 dla RuBisCO.", "uw": ""}, {"id": "ck-m23-6-2", "sh": "m23", "n": "6.2", "dz": "d6", "t": "", "max": 1, "cl": 0, "q": "Na czym polega adaptacja – zrzucanie liści przed zimą przez drzewa liściaste? Uwzględnij dostępność wody zimą i rolę liści w gospodarce wodnej.", "key": ["Roślina zrzuca liście, aby nie dopuścić w procesie transpiracji do utraty wody, której dostępność spada w okresie zimowym.", "Dostępność wody w glebie jest w zimie mała, dlatego rośliny zrzucają liście, aby ograniczyć parowanie wody z liści i w ten sposób zapobiegają nadmiernej utracie wody."], "zas": "1 pkt – za poprawne przedstawienie, na czym polega adaptacja, uwzględniające ograniczenie transpiracji (szparkowej) w warunkach obniżonej dostępności wody w glebie. 0 pkt – za odpowiedź niespełniającą wymagań na 1 pkt albo za brak odpowiedzi.", "uw": ""}, {"id": "ck-m23-7-1", "sh": "m23", "n": "7.1", "dz": "d6", "t": "", "max": 2, "cl": 0, "q": "Dlaczego wymiana gazowa w płucach płazów jest mniej efektywna niż u ssaków? Podaj jedną różnicę w budowie płuc i jedną w wentylacji.", "key": ["Płazy mają płuca workowe, o mniejszym stosunku powierzchni do objętości niż ssaki, które mają pęcherzykowate płuca. Płazy nie mają klatki piersiowej, którą mają ssaki, a której ruchy umożliwiają efektywne przeprowadzanie wdechu i wydechu.", "Płazy mają workowate płuca o mniejszej powierzchni, a ssaki mają płuca o budowie pęcherzykowej i mają większą powierzchnię wymiany gazowej. Płazy prowadzą wentylację za pomocą ruchów dna jamy gębowej, a ssaki – za pomocą mięśni międzyżebrowych wymuszających ruchy klatki piersiowej, i dlatego ssaki wymieniają więcej powietrza niż płazy."], "zas": "2 pkt – za poprawne wyjaśnienie, uwzględniające różnice: • w budowie płuc – płuca płazów są workowate / słabo pofałdowane / nie mają pęcherzyków, a więc mają mniejszą powierzchnię w porównaniu do pęcherzykowatych / silnie pofałdowanych / mających pęcherzyki płuc ssaków ORAZ • w mechanizmie wentylacji płuc – zmiany objętości klatki piersiowej u ssaków zapewni…", "uw": "Uznaje się odpowiedzi odnoszące się do różnicy w mechanizmie wentylacji w postaci tłoczenia powietrza do płuc u płazów i zasysania powietrza do płuc przez ssaki, np. „Płazy wentylują płuca poprzez wtłaczanie powietrza, a ssaki zasysają powietrze”."}, {"id": "ck-m23-7-2", "sh": "m23", "n": "7.2", "dz": "d6", "t": "", "max": 1, "cl": 0, "q": "Jakie znaczenie dla pobierania wody przez płazy ma gromadzenie mocznika w płynach ustrojowych?", "key": ["Osocze jest hipertoniczne.", "Dzięki temu osocze płaza jest silnie hipertoniczne w stosunku do otaczającej go wody."], "zas": "1 pkt – za poprawne określenie gromadzenia mocznika w pobieraniu wody, uwzględniające zapewnienie hiperosmotyczności płynów ustrojowych względem środowiska zewnętrznego LUB zapewnienie wydajnego (osmotycznego) napływu wody. 0 pkt – za odpowiedź niespełniającą wymagań na 1 pkt albo za brak odpowiedzi.", "uw": ""}, {"id": "ck-m23-8-1", "sh": "m23", "n": "8.1", "dz": "d6", "t": "", "max": 1, "cl": 1, "q": "Amfisbeny należą do A. pierścienic / B. stawonogów / C. gadów, o czym świadczy 1. zrzucanie zrogowaciałego naskórka (wylinka) / 2. segmentowe umięśnienie / 3. wydłużone ciało do drążenia tuneli.", "key": ["C1"], "zas": "1 pkt – za poprawne dokończenie zdania. 0 pkt – za odpowiedź niespełniającą wymagań na 1 pkt albo za brak odpowiedzi.", "uw": ""}, {"id": "ck-m23-8-2", "sh": "m23", "n": "8.2", "dz": "d7", "t": "", "max": 1, "cl": 1, "q": "Czaszki amfisben przystosowały się do drążenia tuneli w wyniku: A. dryfu genetycznego B. efektu założyciela C. specjacji D. doboru naturalnego.", "key": ["D"], "zas": "1 pkt – za poprawne dokończenie zdania. 0 pkt – za odpowiedź niespełniającą wymagań na 1 pkt albo za brak odpowiedzi.", "uw": ""}, {"id": "ck-m23-9-1", "sh": "m23", "n": "9.1", "dz": "d4", "t": "", "max": 1, "cl": 1, "q": "Procesy w wątrobie – podkreśl właściwe: aminokwasy → (dekarboksylacja / deaminacja) → ketokwasy + amoniak; glukoza → (glikoliza / glikogenogeneza) → glikogen.", "key": ["aminokwasy → deaminacja; glukoza → glikogenogeneza"], "zas": "1 pkt – za wybór dwóch poprawnych odpowiedzi. 0 pkt – za odpowiedź niespełniającą wymagań na 1 pkt albo za brak odpowiedzi.", "uw": ""}, {"id": "ck-m23-9-2", "sh": "m23", "n": "9.2", "dz": "d4", "t": "", "max": 1, "cl": 0, "q": "Wyjaśnij, jak żółć wspomaga enzymatyczny rozkład lipidów w przewodzie pokarmowym.", "key": ["Żółć fizycznie rozbija krople związków tłuszczowych na mniejsze części, co zwiększa powierzchnię trawienia tłuszczów przez enzymy.", "Lipaza jest enzymem rozpuszczalnym w wodzie, a sole kwasów żółciowych umożliwiają kontakt lipazy z tłuszczami, nierozpuszczalnymi w wodzie."], "zas": "1 pkt – za poprawne wyjaśnienie, uwzględniające emulgację lipidów i – w konsekwencji – zwiększenie powierzchni kontaktu lipazy z tłuszczami LUB uwzględniające ułatwienie kontaktu lipazy z tłuszczami (przez sole kwasów żółciowych lub fosfolipidy) na granicy faz – wodnej i lipidowej. 0 pkt – za odpowiedź niespełniającą wymagań na 1 pkt albo za brak odpowiedzi.", "uw": "Uznaje się odpowiedzi odnoszące się do neutralizacji treści żołądkowej przez żółć i zapewnienia optymalnych warunków do działania lipaz, np. „Żółć wątrobowa ma odczyn zasadowy i dzięki temu zapewnia właściwe pH dla działania lipazy jelitowej”."}, {"id": "ck-m23-10-2", "sh": "m23", "n": "10.2", "dz": "d4", "t": "", "max": 1, "cl": 1, "q": "Podkreśl właściwe: tchawica zaczyna się za (gardłem / krtanią), a dzieli się na (oskrzela główne / oskrzeliki).", "key": ["Tchawica człowieka rozpoczyna się bezpośrednio za ( gardłem / krtanią), a na dolnym końcu dzieli się na (oskrzela główne / oskrzeliki)."], "zas": "1 pkt – za wybór dwóch poprawnych określeń. 0 pkt – za odpowiedź niespełniającą wymagań na 1 pkt albo za brak odpowiedzi.", "uw": ""}, {"id": "ck-m23-10-3", "sh": "m23", "n": "10.3", "dz": "d4", "t": "", "max": 1, "cl": 1, "q": "Do oglądania w czasie rzeczywistym błony śluzowej tchawicy wykonuje się: A. spirometrię B. RTG klatki piersiowej C. bronchoskopię D. gastroskopię.", "key": ["C"], "zas": "1 pkt – za poprawne dokończenie zdania. 0 pkt – za odpowiedź niespełniającą wymagań na 1 pkt albo za brak odpowiedzi.", "uw": ""}, {"id": "ck-m23-11-1", "sh": "m23", "n": "11.1", "dz": "d4", "t": "", "max": 2, "cl": 1, "q": "Krzywe wiązania tlenu (hemoglobina oczyszczona vs w erytrocytach). P/F: 1. oczyszczona ma większe powinowactwo do O₂; 2. przy 100 mmHg oczyszczona wiąże o 8% więcej O₂; 3. maksymalne wysycenie zależy od 2,3-BPG.", "key": ["1. – P, 2. – F, 3. – F."], "zas": "2 pkt – za poprawną ocenę trzech stwierdzeń. 1 pkt – za poprawną ocenę dwóch stwierdzeń. 0 pkt – za odpowiedź niespełniającą wymagań na 1 pkt albo za brak odpowiedzi.", "uw": ""}, {"id": "ck-m23-11-2", "sh": "m23", "n": "11.2", "dz": "d4", "t": "", "max": 1, "cl": 1, "q": "Podkreśl właściwe: więcej 2,3-BPG u ciężarnej powoduje (obniżone / podwyższone) powinowactwo Hb matki do O₂, co (ułatwia / utrudnia) dyfuzję O₂ do płodu.", "key": ["Podwyższone stężenie 2,3-BPG w erytrocytach ciężarnych kobiet jest przyczyną (obniżonego / podwyższonego) powinowactwa hemoglobiny matki do tlenu, co (ułatwia / utrudnia) dyfuzję tlenu z części macicznej łożyska do części płodowej łożyska."], "zas": "1 pkt – za wybór dwóch poprawnych określeń. 0 pkt – za odpowiedź niespełniającą wymagań na 1 pkt albo za brak odpowiedzi.", "uw": ""}, {"id": "ck-m23-11-3", "sh": "m23", "n": "11.3", "dz": "d4", "t": "", "max": 1, "cl": 0, "q": "Podaj funkcję hemoglobiny w erytrocytach inną niż transport tlenu.", "key": ["Transportuje tlenek węgla(IV) / ditlenek węgla / dwutlenek węgla / CO2.", "Transportuje protony / H+."], "zas": "1 pkt – za poprawne podanie funkcji hemoglobiny innej niż transportowanie tlenu. 0 pkt – za odpowiedź niespełniającą wymagań na 1 pkt albo za brak odpowiedzi.", "uw": "Nie uznaje się odpowiedzi odnoszących się do magazynowania lub transportu żelaza, ponieważ te funkcje pełnią inne wyspecjalizowane białka: ferrytyna i transferryna."}, {"id": "ck-m23-12-1", "sh": "m23", "n": "12.1", "dz": "d4", "t": "", "max": 2, "cl": 1, "q": "Toksyna botulinowa w synapsie nerwowo-mięśniowej. P/F: 1. łańcuch lekki przechodzi zględnij właściwości polimerazy DNA.", "key": ["Ponieważ polimeraza dołącza nukleotydy tylko do już istniejących nici.", "Polimeraza DNA nie może sama rozpocząć syntezy nowego łańcucha DNA i dlatego jest jej potrzebny już istniejący odcinek łańcucha nukleotydowego komplementarnego do matrycy, aby do niego dołączyć kolejny nukleotyd."], "zas": "1 pkt – za poprawne wyjaśnienie, uwzględniające możliwość dołączania nowego nukleotydu przez polimerazę DNA wyłącznie do istniejącego już odcinka łańcucha nukleotydowego. 0 pkt – za odpowiedź niespełniającą wymagań na 1 pkt albo za brak odpowiedzi.", "uw": "Nie uznaje się odpowiedzi, które odnoszą się wyłącznie do specyficzności reakcji, np. „Dzięki użyciu specyficznych starterów można powielić wybrany gen”."}, {"id": "ck-m23-14-1", "sh": "m23", "n": "14.1", "dz": "d5", "t": "", "max": 1, "cl": 0, "q": "Podaj sekwencję aminokwasową fragmentu polipeptydu ze schematu A (od końca aminowego).", "key": ["metionina, tryptofan, fenyloalanina, tryptofan", "Met-Trp-Phe-Trp"], "zas": "1 pkt – za podanie poprawnej sekwencji pierwszych czterech reszt aminokwasowych polipeptydu A. 0 pkt – za odpowiedź niespełniającą wymagań na 1 pkt albo za brak odpowiedzi.", "uw": "Dopuszcza się zapisanie sekwencji od końca C do końca N pod warunkiem, że obydwa końce zostały prawidłowo oznaczone, np. „C-Trp-Phe-Trp-Met-N”. Dopuszcza się zapisanie sekwencji z wykorzystaniem kodów IUPAC: „MWFW”."}, {"id": "ck-m23-14-2", "sh": "m23", "n": "14.2", "dz": "d5", "t": "", "max": 1, "cl": 0, "q": "Podaj dwie możliwe sekwencje mRNA (5′→3′) kodujące fragment polipeptydu A.", "key": ["1. 5′ AUG UGG UUU UGG 3′ 2. 5′ AUG UGG UUC UGG 3′", "1. AUG UGG UUU UGG 2. AUG UGG UUC UGG"], "zas": "1 pkt – za podanie poprawnych sekwencji nukleotydowych dwóch możliwych mRNA kodujących fragment polipeptydu przedstawiony na schemacie A. 0 pkt – za odpowiedź niespełniającą wymagań na 1 pkt albo za brak odpowiedzi.", "uw": "Dopuszcza się zapisanie sekwencji od końca 3′ do końca 5′ pod : "d7", "t": "", "max": 2, "cl": 1, "q": "Murawy kserotermiczne w rezerwacie. P/F: 1. ich utrzymanie wymaga działalności człowieka; 2. po zaprzestaniu użytkowania zmienił się skład gatunkowy; 3. umiarkowane użytkowanie pozwala zachować typowy skład.", "key": ["1. – P, 2. – P, 3. – P."], "zas": "2 pkt – za poprawną ocenę trzech stwierdzeń. 1 pkt – za poprawną ocenę dwóch stwierdzeń. 0 pkt – za odpowiedź niespełniającą wymagań na 1 pkt albo za brak odpowiedzi.", "uw": ""}, {"id": "ck-m23-17-2", "sh": "m23", "n": "17.2", "dz": "d7", "t": "", "max": 1, "cl": 0, "q": "Dlaczego zaniechanie koszenia i wypasu wpłynęło negatywnie na murawy kserotermiczne?", "key": ["Brak koszenia był przyczyną nadmiernego rozrostu krzewów i drzew, co doprowadziło do konkurencyjnego wyparcia roślinności muraw kserotermicznych.", "Zaniechanie wypasania zwierząt, które zjadały roślinność porastającą zbocza, przyczyniło się do zwiększenia powierzchni zajmowanej przez zarośla, które zasłaniały roślinom muraw dostęp do światła słonecznego."], "zas": "1 pkt – za poprawne wyjaśnienie, uwzględniające • wzrost niezgryzanych lub niekoszonych roślin – np. drzew lub krzewów, oraz spowolnienie rozwoju lub wyparcie roślin muraw kserotermicznych w wyniku konkurencji o zasoby środowiska LUB • ograniczenie presji roślinożerców lub koszenia i w wyniku tego wzrost konkurencji o zasoby środowiska między gatunkami rośli…", "uw": "Nie uznaje się odpowiedzi zbyt ogólnych, nie odnoszących się do konkretnego rodzaju użytkowania gospodarczego – koszenia roślin lub wypasu zwierząt, np."}, {"id": "ck-m23-17-3", "sh": "m23", "n": "17.3", "dz": "d7", "t": "", "max": 2, "cl": 1, "q": "Wybierz dwa działania ochrony czynnej muraw: A. głęboka orka B. wycinka drzew i krzewów C. kontrolowany wypas D. rośliny uprawne E. nawożenie azotem.", "key": ["B, C"], "zas": "2 pkt – za wybór dwóch poprawnych odpowiedzi. 1 pkt – za wybór jednej poprawnej odpowiedzi. 0 pkt – za odpowiedź niespełniającą wymagań na 1 pkt albo za brak odpowiedzi.", "uw": ""}];

function idb(){if(idbP)return idbP;idbP=new Promise((res,rej)=>{const r=indexedDB.open("bio61",1);r.onupgradeneeded=()=>r.result.createObjectStore("ph");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});return idbP}
async function idbPut(k,v){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction("ph","readwrite");t.objectStore("ph").put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function idbGet(k){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction("ph");const q=t.objectStore("ph").get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function idbDel(k){const d=await idb();return new Promise(res=>{const t=d.transaction("ph","readwrite");t.objectStore("ph").delete(k);t.oncomplete=res;t.onerror=res})}

function norm(d){d=d||{};return {cards:d.cards||{},read:d.read||{},tasks:d.tasks||{},errors:d.errors||{},answers:d.answers||{},quiz:d.quiz||{},log:d.log||{},notes:d.notes||{},photos:d.photos||{},my:d.my||{}}}
function loadLocal(){try{const r=localStorage.getItem("bio61");if(r)S=norm(JSON.parse(r))}catch(e){}}
function merge(a,b){const o=norm(JSON.parse(JSON.stringify(a)));b=norm(b);
 Object.assign(o.read,b.read);Object.assign(o.answers,b.answers,a.answers||{});
 for(const k in b.photos){const seen=new Set((o.photos[k]||[]).map(p=>p.a));o.photos[k]=(o.photos[k]||[]).concat((b.photos[k]||[]).filter(p=>!seen.has(p.a)))}
 for(const k in b.my){const x=o.my[k],y=b.my[k];if(!x||(y.at||0)>(x.at||0))o.my[k]=y}
 for(const k in b.notes){const x=o.notes[k],y=b.notes[k];if(!x||(y.at||0)>(x.at||0))o.notes[k]=y}
 for(const k in b.cards){const x=o.cards[k],y=b.cards[k];if(!x||(y.due||0)>(x.due||0))o.cards[k]=y}
 for(const k in b.quiz){const x=o.quiz[k],y=b.quiz[k];if(!x||(y.at||0)>(x.at||0))o.quiz[k]=y}
 for(const k in b.tasks){const x=o.tasks[k],y=b.tasks[k];if(!x||(y.at||0)>(x.at||0)||((y.at||0)===(x.at||0)&&y.score>x.score))o.tasks[k]=y}
 for(const k in b.errors){if(!o.errors[k])o.errors[k]=b.errors[k]}
 for(const k in o.errors){const t=o.tasks[k];if(t&&t.score>=t.max)delete o.errors[k]}
 for(const k in b.log){const x=o.log[k]||{n:0,ok:0,min:0},y=b.log[k];o.log[k]={n:Math.max(x.n||0,y.n||0),ok:Math.max(x.ok||0,y.ok||0),min:Math.max(x.min||0,y.min||0)}}
 return o}

function cardsOf(tid){return (FISZKI[tid]||[]).map(c=>({id:tid+"_"+hk(c[0]),t:tid,q:c[0],a:c[1],s:c[2]}))}
function quizOf(tid){return (QUIZ[tid]||[]).map((x,i)=>Object.assign({id:tid+"_q"+i,t:tid},x))}
function mastery(tid){let s=0,n=0;
 for(const c of cardsOf(tid)){const r=S.cards[c.id];n++;if(r)s+=r.box>=2?1:r.box>=1?.5:0}
 for(const x of quizOf(tid)){const r=S.quiz[x.id];n++;if(r&&r.last)s+=1}
 for(const z of topicTasks(tid)){const r=S.tasks[z.id];n++;if(r)s+=r.score/r.max}
 return n?s/n:0}
function known(tid){return cardsOf(tid).filter(c=>{const r=S.cards[c.id];return r&&r.box>=2}).length}
function streak(){let d=dayNum(),n=0;if(!(S.log[d]&&S.log[d].n))d--;while(S.log[d]&&S.log[d].n){n++;d--}return n}
function logAns(ok){const d=dayNum();const l=S.log[d]||(S.log[d]={n:0,ok:0,min:0});l.n++;if(ok)l.ok++}
const quizWrong=()=>readyT().flatMap(t=>quizOf(t.id)).filter(x=>{const r=S.quiz[x.id];return r&&r.last===0});
const errTasks=()=>Object.keys(S.errors).filter(id=>ZADANIA.find(z=>z.id===id));
const errCount=()=>quizWrong().length+errTasks().length;

function bullets(t){let p;
 if(/(^|\s)\d\)\s/.test(t))p=t.split(/\s+(?=\d\)\s)/);
 else p=t.split(/(?<=[.;])(?<!\bnp\.)(?<!\bok\.)(?<!\bs\.)(?<!\bin\.)(?<!\btzw\.)\s+(?=[A-ZĄĆĘŁŃÓŚŹŻ„0-9])/);
 return p.map(s=>s.trim().replace(/[.;]$/,"")).filter(Boolean)}
function bulletH(s){const m=s.match(/^([^–:.]{2,46}?)\s(–|:)\s(.+)$/)||s.match(/^([^–:.]{2,46}?)(:)\s(.+)$/);return m?`<b>${esc(m[1])}</b> ${m[2]} ${esc(m[3])}`:esc(s)}

async function shrink(file){const bmp=await createImageBitmap(file);const sc=Math.min(1,1800/Math.max(bmp.width,bmp.height));const c=document.createElement("canvas");c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(r,"image/jpeg",0.82))}

 if(IS_PWA){try{if(st)st.textContent="Zapisuję zdjęcie…";const blob=await shrink(el.files[0]);const k="idb:"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);await idbPut(k,blob);PH[k]=URL.createObjectURL(blob);(S.photos[id]=S.photos[id]||[]).push({a:k,u:"",at:Date.now()});save();render()}catch(err){if(st)st.textContent="Nie udało się zapisać zdjęcia."}return}

 try{if(st)st.textContent="Wysyłam zdjęcie…";const blob=await shrink(el.files[0]);const r=await as.upload(blob);(S.photos[id]=S.photos[id]||[]).push({a:r.id,u:r.url,at:Date.now()});save();render()}

 const photos={};for(const id in S.photos)for(const p of S.photos[id])if(p.a.startsWith("idb:")){const b=await idbGet(p.a);if(b)photos[p.a]=await b2d(b)}
 const data=JSON.stringify({app:"bio61",v:1,at:new Date().toISOString(),S,photos});const name="bio61-kopia-"+new Date().toISOString().slice(0,10)+".json";
 const file=new File([data],name,{type:"application/json"});
 try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"Kopia Bio 61"})}else{const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();a.remove()}
  localStorage.setItem("bio61exp",String(Date.now()));if(st)st.textContent="Kopia gotowa: "+name;}catch(e){if(st)st.textContent=e&&e.name==="AbortError"?"Anulowano.":"Nie udało się zapisać kopii."}};
