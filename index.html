 małe cząsteczki niepolarne, np. CO₂, O₂.", "v54"], ["Dyfuzja ułatwiona", "Transport z udziałem białek błonowych (kanałowych lub nośnikowych); tak przenoszone są jony nieorganiczne i niewielkie polarne cząsteczki, np. aminokwasy, glukoza.", "v54"], ["Transport czynny (aktywny)", "Odbywa się wbrew gradientowi stężeń, wymaga nakładu energii, zachodzi z udziałem białek nośnikowych lub pomp błonowych (np. pompa sodowo-potasowa, pompa protonowa).", "v54"], ["Transport sprzężony", "Przeniesienie cząsteczki jednej substancji zależy od równoczesnego przeniesienia cząsteczki drugiej substancji; realizują go białka nośnikowe i pompy.", "v55"], ["Symport", "Transport sprzężony, w którym obie cząsteczki są przenoszone w tym samym kierunku.", "v55"], ["Antyport", "Transport sprzężony, w którym cząsteczki są przenoszone w przeciwnych kierunkach.", "v55"], ["Osmoza", "Odmiana dyfuzji prostej polegająca na przenikaniu wody przez błonę biologiczną z roztworu o mniejszym stężeniu substancji rozpuszczonych do roztworu o ich większym stężeniu.", "v55"], ["Roztwór hipertoniczny", "Roztwór o wyższym stężeniu substancji osmotycznie czynnych (większym ciśnieniu osmotycznym) niż oddzielony od niego błoną półprzepuszczalną roztwór odniesienia.", "v55"], ["Roztwór hipotoniczny", "Roztwór o niższym stężeniu substancji osmotycznie czynnych niż roztwór odniesienia.", "v55"], ["Roztwór izotoniczny", "Roztwór o takim samym stężeniu substancji osmotycznie czynnych jak roztwór odniesienia; ilość wody przepływającej przez błonę w obu kierunkach jest taka sama.", "v55"], ["Plazmoliza", "Odstawanie protoplastu od ściany komórkowej obserwowane po umieszczeniu komórki roślinnej w roztworze hipertonicznym.", "v56"], ["Deplazmoliza", "Powrót splazmolizowanej komórki do stanu sprzed plazmolizy po umieszczeniu jej w wodzie lub roztworze hipotonicznym.", "v56"], ["Erytrocyt w roztworze hipertonicznym i hipotonicznym", "Hipertoniczny: oddaje wodę, kurczy się i ostatecznie rozpada. Hipotoniczny: pobiera wodę, pęcznieje i ostatecznie pęka.", "v56"], ["Komórka miękiszowa w roztworze hipertonicznym", "Oddaje wodę, co powoduje odwodnienie cytozolu i zmniejszenie objętości wakuoli; skutkiem jest plazmoliza.", "v56"], ["Komórka miękiszowa w roztworze hipotonicznym", "Pobiera wodę aż do osiągnięcia stanu maksymalnej jędrności, potem przestaje, bo nie pozwala na to sztywna ściana komórkowa.", "v56"], ["Jak zaobserwować plazmolizę i deplazmolizę w skórce liścia cebuli?", "Plazmolizę – umieszczając skórkę w kropli stężonego roztworu, np. sacharozy; deplazmolizę – dodając do preparatu kroplę wody destylowanej.", "v56"], ["Substancje osmotycznie czynne i osmotycznie bierne", "Czynne rozpuszczają się w wodzie i zmieniają kierunek przepływu wody przez błonę (np. glukoza). Bierne nie rozpuszczają się w wodzie, tworzą zawiesinę (np. skrobia) lub emulsję (oleje) i nie zmieniają kierunku przepływu wody.", "v57"], ["Transport pęcherzykowy", "Przenoszenie ładunków (substancji chemicznych lub całych struktur) za pomocą pęcherzyków utworzonych z fragmentów błon biologicznych; główne rodzaje: endocytoza i egzocytoza.", "v58"], ["Endocytoza", "Transport substancji do wnętrza komórki za pomocą pęcherzyków powstających z udziałem błony komórkowej; sposób odżywiania się m.in. protistów; dzieli się na fagocytozę i pinocytozę.", "v58"], ["Egzocytoza", "Transport substancji na zewnątrz komórki za pomocą pęcherzyków powstających przy udziale błon cytoplazmatycznych; tak transportowane są lipidy i białka do budowy błony, hormony, śluzy i enzymy trawienne.", "v58"], ["Fagocytoza", "Pobieranie przez komórkę drobnych, nierozpuszczalnych cząstek, m.in. bakterii lub szczątków organicznych.", "v58"], ["Pinocytoza", "Pobieranie przez komórkę małych kropli płynów zawierających substancje rozpuszczalne w wodzie.", "v58"]], "t10": [["Jakie są główne funkcje jądra komórkowego?", "Kontrolowanie przebiegu większości procesów życiowych komórki oraz powielanie i przekazywanie materiału genetycznego (DNA) do komórek potomnych.", "v59"], ["Podaj przykład komórek wielojądrowych.", "Włókna mięśni szkieletowych.", "v59"], ["W jakich komórkach dochodzi do całkowitej redukcji jądra komórkowego i dlaczego?", "M.in. w erytrocytach ssaków i rurkach sitowych roślin okrytozalążkowych – wskutek specjalizacji w pełnieniu określonych funkcji.", "v59"], ["Jąderko – budowa i funkcja", "Część chromatyny zawierająca geny kodujące rRNA. Zachodzi w nim synteza rRNA i jego łączenie z białkami – powstają podjednostki rybosomów transportowane do cytozolu.", "v59"], ["Chromatyna – definicja", "Forma upakowania DNA u organizmów eukariotycznych, w której liniowe cząsteczki DNA są nawinięte na białka histonowe. W czasie podziału komórki tworzy chromosomy.", "v59"], ["Chromosom eukariotyczny – definicja", "Pojedyncza, liniowa cząsteczka DNA u organizmów eukariotycznych.", "v59"], ["Otoczka jądrowa", "Dwie błony, które oddzielają wnętrze jądra komórkowego od cytozolu.", "v59"], ["Pory jądrowe", "Białkowe kompleksy w otoczce jądrowej odpowiadające za transport substancji między wnętrzem jądra a cytozolem.", "v59"], ["Kariolimfa", "Płyn wypełniający jądro, zawierający białka enzymatyczne i RNA; jest w nim zanurzona chromatyna.", "v59"], ["Euchromatyna", "Uważa się, że zawiera aktywne geny; zbudowana z luźno upakowanych włókien, których struktura rozluźnia się dodatkowo podczas odczytywania informacji zawartej w genach.", "v59"], ["Heterochromatyna", "Uważa się, że zawiera nieaktywne geny oraz większość pozagenowego DNA; zbudowana ze ściśle upakowanych włókien.", "v59"], ["Od czego zależy liczba porów jądrowych?", "Od aktywności metabolicznej komórki – w komórkach o dużej aktywności jest ich więcej niż w komórkach o małej aktywności.", "v59"], ["Co jest transportowane z jądra do cytozolu, a co z cytozolu do jądra?", "Z jądra do cytozolu: głównie mRNA, tRNA i podjednostki rybosomów. Z cytozolu do jądra: przede wszystkim białka histonowe, enzymy i wolne nukleotydy.", "v59"], ["Jaka jest łączna długość chromosomów w jądrze komórkowym człowieka?", "Ok. 2 m.", "v60"], ["Kiedy DNA występuje w postaci samej dwuniciowej helisy (bez upakowania)?", "Tylko podczas replikacji.", "v60"], ["Nukleosom", "Fragment cząsteczki DNA nawinięty na rdzeń z ośmiu cząsteczek białek histonowych; nukleosomy są połączone DNA łącznikowym (chromatyna w postaci sznura nukleosomów).", "v60"], ["Włókno chromatyny o szerokości 30 nm", "Nukleosomy zwinięte w helisę i ułożone jeden na drugim; ta postać chromatyny występuje w okresie międzypodziałowym.", "v60"], ["Pętle chromatyny i włókna 300 nm", "Na początku podziału włókna 30 nm układają się w pętle; pętle zwijają się spiralnie i tworzą włókna chromatyny o szerokości 300 nm.", "v60"], ["Kolejne etapy upakowania DNA", "Helisa DNA → sznur nukleosomów → włókno 30 nm → pętle chromatyny → pętle zwinięte w spirale (300 nm) → chromosom metafazowy.", "v60"], ["Chromosom metafazowy", "Najbardziej skondensowana postać DNA (cząsteczka 9 tys. razy krótsza niż rozwinięta); składa się z dwóch chromatyd siostrzanych utworzonych przez dwie identyczne cząsteczki DNA.", "v60"], ["Budowa chromosomu metafazowego", "Dwie chromatydy, ramiona chromosomu oraz centromer.", "v60"], ["Centromer", "Przewężenie pierwotne chromosomu – miejsce przyczepu włókien wrzeciona kariokinetycznego, umożliwiającego przemieszczanie się chromosomów podczas podziału.", "v60"], ["Cytozol – definicja", "Roztwór koloidalny, w którym fazą rozpraszającą jest woda, a fazą rozproszoną inne związki nieorganiczne i organiczne (przeważają białka, także nierozpuszczalne białka włókienkowe tworzące cytoszkielet).", "v61"], ["Funkcje cytozolu", "Stanowi środowisko licznych reakcji biochemicznych; pośredniczy w transporcie substancji między organellami oraz między organellami a środowiskiem zewnętrznym komórki.", "v61"], ["Jak przeprowadza się obserwację ruchu cytozolu u moczarki kanadyjskiej?", "Wodny preparat z liści ze szczytowej części pędu; rośliny w ciepłej wodzie (ok. 37°C), 60 min w świetle żarówki 100 W z ok. 30 cm; obserwacja przemieszczania się cytozolu pod mikroskopem.", "v61"], ["Cytoszkielet – definicja", "Skomplikowana, dynamiczna sieć włókien utworzona przez białka włókienkowe; występuje we wszystkich komórkach eukariotycznych.", "v61"], ["Filamenty aktynowe (mikrofilamenty) – budowa i występowanie", "Białko: aktyna; dwa długie, splecione łańcuchy podjednostek aktynowych o średnicy 7 nm; najwięcej pod błoną komórkową.", "v61"], ["Filamenty pośrednie – budowa i występowanie", "Różne białka, np. keratyna; sztywne włókienka o średnicy 10 nm; gęsta sieć wokół jądra, sięgająca krańców komórki, gdzie łączy się z błonami.", "v61"], ["Mikrotubule – budowa i występowanie", "Białko: tubulina; puste wewnątrz rurki o średnicy 25 nm; dynamiczne – mogą zanikać i znowu się pojawiać, wydłużać się lub skracać.", "v61"], ["Funkcje filamentów aktynowych", "Kontrola zmiany kształtu komórki i wytrzymałość mechaniczna błony; ruch pełzakowaty; skurcz włókien mięśniowych; ruch w obrębie komórki (ruch organelli, cytozolu, otaczanie pokarmu podczas fagocytozy).", "v62"], ["Funkcje filamentów pośrednich", "Wzmacniają komórkę i zwiększają jej wytrzymałość mechaniczną (najwięcej w komórkach nabłonka); wzmacniają wewnętrzną powierzchnię otoczki jądrowej i stabilizują włókna chromatyny.", "v62"], ["Funkcje mikrotubul", "Utrzymują organelle w odpowiednim położeniu; tworzą szlaki transportu wewnątrzkomórkowego; tworzą wrzeciono podziałowe w komórkach zwierzęcych; budują rusztowanie rzęsek i wici.", "v62"], ["Centriole", "Organelle zbudowane z mikrotubul ułożonych w formie cylindra; występują głównie w komórkach zwierzęcych.", "v62"], ["Centrosom", "Dwie centriole ułożone prostopadle do siebie; ośrodek formowania mikrotubul wrzeciona podziałowego.", "v62"], ["Budowa rzęsek i wici", "Cytoplazmatyczne wypustki okryte błoną komórkową, wyrastające z ciałka podstawowego; trzon tworzą mikrotubule: dziewięć par na obwodzie i jedna para w środku.", "v62"], ["Czym różnią się wici od rzęsek?", "Tylko liczbą i długością (plan budowy identyczny): rzęski są krótkie i liczne, wici długie i występują pojedynczo lub po kilka.", "v62"]], "t11": [["Organelle półautonomiczne – definicja", "Organelle częściowo niezależne od jądra komórkowego: mają własne DNA i rybosomy, więc same syntetyzują część potrzebnych białek. Należą do nich mitochondria i plastydy.", "v63"], ["Teoria endosymbiozy", "Komórki eukariotyczne powstały w wyniku wchłonięcia komórek prokariotycznych przez cudzożywną komórkę; wchłonięte komórki nie zostały strawione, stały się symbiontami i przekształciły w organelle (prawdopodobnie mitochondria i plastydy).", "v63"], ["Z czego powstały mitochondria i chloroplasty według teorii endosymbiozy?", "Mitochondria – z wchłoniętych cudzożywnych bakterii tlenowych; chloroplasty – z bakterii fotosyntetyzujących. Z błony komórkowej powstały m.in. siateczka śródplazmatyczna i otoczka jądrowa.", "v63"], ["Cechy mitochondriów i plastydów potwierdzające teorię endosymbiozy", "Koliste DNA niezwiązane z histonami; rybosomy podobne do rybosomów prokariotycznych; dwie błony przypominające błony prokariontów; powstawanie wyłącznie przez podział już istniejących organelli.", "v63"], ["Występowanie mitochondriów", "W większości komórek eukariotycznych (we wszystkich oddychających tlenowo); wyjątkiem są komórki, które utraciły je wskutek specjalizacji, np. erytrocyty ssaków.", "v63"], ["Cechy mitochondriów", "Otoczone dwiema błonami; zawierają wiele kopii kolistych cząsteczek DNA oraz rybosomy; powstają przez podział mitochondriów już istniejących.", "v63"], ["Funkcja mitochondriów", "Uwalnianie energii ze związków organicznych w procesie oddychania tlenowego oraz gromadzenie jej w postaci ATP (wytwarzanie ATP).", "v64"], ["Błony mitochondrium", "Zewnętrzna – gładka, przepuszczalna dla wielu związków i jonów. Wewnętrzna – pofałdowana, tworzy grzebienie mitochondrialne, zawiera białka (nośniki i pompy) transportujące substancje.", "v64"], ["Matriks i przestrzeń międzybłonowa mitochondrium", "Matriks zawiera liczne enzymy, rybosomy oraz DNA. Przestrzeń międzybłonową wypełnia płyn o składzie jonowym zbliżonym do składu cytozolu.", "v64"], ["Od czego zależy liczba mitochondriów w komórce?", "Od zapotrzebowania energetycznego (aktywności metabolicznej) – im większe, tym więcej mitochondriów i bardziej pofałdowana błona wewnętrzna; szczególnie dużo we włóknach mięśniowych i neuronach.", "v64"], ["Plastydy – występowanie i powstawanie", "Typowe dla komórek roślin i niektórych protistów; powstają z form młodocianych – proplastydów – lub przez podział dojrzałych plastydów; mogą się przekształcać pod wpływem czynników środowiska, np. dostępu do światła.", "v64"], ["Podział plastydów", "Barwne: chloroplasty, etioplasty, chromoplasty. Bezbarwne (leukoplasty): amyloplasty i elajoplasty.", "v64"], ["Tylakoidy gran i tylakoidy stromy", "Tylakoidy gran – błoniaste woreczki ułożone w stos zwany granum. Tylakoidy stromy – kanaliki łączące ze sobą poszczególne grana.", "v65"], ["Błony chloroplastu", "Zewnętrzna – gładka, przepuszczalna dla wielu substancji. Wewnętrzna – przepuszczalna tylko dla niektórych substancji; wnika do stromy, tworząc tylakoidy gran i stromy.", "v65"], ["Co znajduje się w błonach tylakoidów, a co w stromie chloroplastu?", "W błonach tylakoidów: barwniki fotosyntetyczne, przenośniki elektronów i enzymy. W stromie: enzymy, rybosomy, DNA i ziarna skrobi.", "v65"], ["Proplastydy", "Słabo rozwinięty system błon wewnętrznych; żółty barwnik protochlorofilid (na świetle przechodzi w chlorofil); powstają z nich inne plastydy; występują w komórkach tkanek merystematycznych.", "v65"], ["Chloroplasty", "Silnie rozwinięty system błon (tylakoidy); chlorofil oraz barwniki pomocnicze – karoteny i ksantofile; przeprowadzają fotosyntezę; komórki miękiszu asymilacyjnego liści i niezdrewniałych łodyg.", "v65"], ["Etioplasty", "Słabo rozwinięty system błon; zawierają protochlorofilid; przy dostępie do światła przekształcają się w chloroplasty; miękisz liści i łodyg roślin wyrosłych bez dostępu do światła.", "v65"], ["Chromoplasty", "Słabo rozwinięty system błon; barwniki karotenoidowe – karoteny i ksantofile; nadają barwę kwiatom i owocom (przyciąga zapylaczy i zwierzęta rozsiewające nasiona); miękisz kwiatów i owoców.", "v65"], ["Leukoplasty: amyloplasty i elajoplasty", "Słabo rozwinięty system błon, brak barwników. Amyloplasty magazynują skrobię, elajoplasty – tłuszcze; miękisz wypełniający (kłącza, bulwy, korzenie spichrzowe, nasiona roślin oleistych).", "v65"], ["Siateczka śródplazmatyczna (ER) – definicja", "Błony biologiczne o kształcie spłaszczonych woreczków (cystern) i rozgałęziających się kanalików, tworzące we wnętrzu komórki złożony system.", "v66"], ["Siateczka śródplazmatyczna szorstka (RER)", "Na powierzchni rybosomy syntetyzujące białka o określonej strukturze pierwszorzędowej; w cysternach białka przyjmują strukturę trzeciorzędową; pęcherzyki z jej błon transportują białka do aparatu Golgiego.", "v66"], ["Siateczka śródplazmatyczna gładka (SER)", "Bez rybosomów; zachodzi w niej synteza kwasów tłuszczowych i lipidów (fosfolipidy, glikolipidy, cholesterol), neutralizacja substancji toksycznych (np. w wątrobie), magazynowanie jonów wapnia (np. w mięśniach).", "v66"], ["Rybosomy – budowa i funkcja", "Nieobłonione struktury zbudowane z rRNA i białek, z dwóch podjednostek (mniejszej i większej) różniących się współczynnikiem sedymentacji; przeprowadzają syntezę białek.", "v66"], ["Co syntetyzują rybosomy związane z ER, a co wolne?", "Związane: białka kierowane poza komórkę, białka błonowe oraz enzymy lizosomów i wakuol. Wolne: pozostałe białka.", "v66"], ["Współczynnik sedymentacji", "Określa szybkość opadania cząsteczek w roztworze podczas wirowania; wyrażany w Svedbergach (S).", "v66"], ["Rybosomy typu eukariotycznego", "80S, z podjednostek 40S i 60S; występują w cytozolu jako wolne lub na błonach RER jako związane.", "v66"], ["Rybosomy typu prokariotycznego", "70S, z podjednostek 30S i 50S; występują w cytozolu komórek prokariotycznych.", "v66"], ["Rybosomy mitochondrialne i chloroplastowe", "Przypominają budową rybosomy prokariotyczne (dowód teorii endosymbiozy); są mniejsze od rybosomów cytozolu i ER. U roślin chloroplastowe – 70S (30S i 50S), mitochondrialne – 78S.", "v67"], ["Rybosomy mitochondrialne ssaków (w tym człowieka)", "Stała sedymentacji 55S; podjednostki 39S i 28S.", "v67"], ["Lizosomy – budowa", "Niewielkie pęcherzyki otoczone pojedynczą błoną (w komórkach zwierzęcych) z enzymami hydrolitycznymi aktywnymi tylko w pH ≈ 5; pompy protonowe wprowadzają H+ do wnętrza; błonę od wewnątrz chroni warstwa odpornych chemicznie cukrów.", "v67"], ["Funkcja lizosomów", "Trawienie wewnątrzkomórkowe, m.in. zużytych lub uszkodzonych organelli oraz składników dostarczonych w wyniku endocytozy.", "v67"], ["Aparat Golgiego – powstawanie, występowanie, funkcja", "Powstaje z pęcherzyków RER; najwięcej w komórkach wydzielniczych (gruczoły dokrewne, np. tarczyca; gruczoły wydzielania zewnętrznego, np. ślinianki); modyfikuje, sortuje i transportuje białka.", "v67"], ["Budowa aparatu Golgiego", "Wiele płaskich, rozszerzających się na końcach woreczków (cystern) ułożonych w stos; na brzegach stosu tworzą się pęcherzyki transportujące określone substancje.", "v67"], ["Droga białka wydzielniczego w systemie błon", "Pęcherzyki z RER → aparat Golgiego (modyfikacja, np. fosforylacja, dołączenie reszty cukrowej) → pęcherzyki → błona komórkowa → egzocytoza.", "v68"], ["Jak powstają lizosomy?", "Enzymy lizosomów powstają w RER, pęcherzykami docierają do aparatu Golgiego (ostateczne modyfikacje), są pakowane w pęcherzyki, które odłączają się od cystern AG i tworzą lizosomy.", "v68"], ["Peroksysomy – budowa i występowanie", "Drobne pęcherzyki otoczone pojedynczą błoną, zawierające liczne enzymy; występują we wszystkich komórkach eukariotycznych, dużo m.in. w komórkach wątroby.", "v68"], ["Funkcje peroksysomów", "Rozkład kwasów tłuszczowych do jednostek dwuwęglowych; wytwarzanie mieliny otoczek komórek nerwowych; neutralizacja m.in. leków i związków szkodliwych, np. alkoholu etylowego.", "v68"], ["Katalaza – rola", "Enzym peroksysomów rozkładający nadtlenek wodoru (H2O2 – reaktywna forma tlenu uszkadzająca białka, nukleotydy i lipidy błonowe) do wody i tlenu.", "v68"], ["Wakuole – występowanie i budowa", "W komórkach roślin, grzybów i niektórych protistów; pęcherzyki otoczone pojedynczą błoną, wypełnione płynem. U roślin błona to tonoplast, a wnętrze wypełnia sok komórkowy (wodny roztwór substancji).", "v69"], ["Funkcje wakuol w komórce roślinnej", "Utrzymanie turgoru; magazynowanie jonów i substancji zapasowych; magazynowanie ubocznych produktów przemiany materii (np. kryształy szczawianu wapnia); gromadzenie glikozydów (barwa kwiatów i owoców), alkaloidów i garbników (obrona).", "v69"], ["Wodniczki pokarmowe i tętniące", "Pokarmowe – u niektórych protistów, powstają na skutek endocytozy (pinocytozy lub fagocytozy). Tętniące – u protistów słodkowodnych w środowisku hipotonicznym, usuwają nadmiar wody.", "v69"]], "t12": [["Ściana komórkowa – czym jest i u jakich organizmów występuje?", "Zewnętrzna warstwa komórek bakterii, grzybów, roślin oraz niektórych protistów.", "v69"], ["Główny składnik ściany komórkowej u bakterii, grzybów i roślin", "Bakterie – mureina, grzyby – chityna, rośliny – głównie celuloza.", "v69"], ["Funkcje ściany komórkowej", "Nadaje komórce kształt; chroni przed uszkodzeniami mechanicznymi i pęknięciem w środowisku hipotonicznym; zabezpiecza przed wnikaniem drobnoustrojów chorobotwórczych; bierze udział w transporcie wody.", "v69"], ["Fibryla elementarna", "Struktura utworzona z długich, nierozgałęzionych cząsteczek celulozy ułożonych równolegle do siebie.", "v69"], ["Mikrofibryla", "Struktura powstała z kilku fibryli elementarnych; podstawowa jednostka strukturalna ściany komórkowej.", "v69"], ["Makrofibryle", "Grubsze jednostki (włókna celulozowe) powstałe z połączenia mikrofibryli; układają się w przestrzenną sieć.", "v69"], ["Co wypełnia wolne miejsca między makrofibrylami?", "Pektyny, hemicelulozy oraz woda.", "v69"], ["Celuloza", "Polisacharyd zbudowany z kilku tysięcy reszt glukozy; podstawowy składnik ściany komórkowej roślin.", "v70"], ["Jak łańcuchy celulozy tworzą mikrofibryle?", "Łączą się ze sobą wiązaniami wodorowymi, tworząc równolegle ułożone wiązki – mikrofibryle (włóknisty szkielet ściany).", "v70"], ["Macierz ściany komórkowej", "Wypełnienie przestrzeni między włóknami szkieletu; zbudowana z rozgałęzionych polisacharydów (hemiceluloz i pektyn) oraz białek i wody.", "v70"], ["Ściana komórkowa pierwotna – jakie komórki okrywa i jaki ma skład?", "Okrywa młode, rosnące komórki roślin; mała zawartość celulozy, duża zawartość wody, hemiceluloz, pektyn i białek.", "v70"], ["Ściana komórkowa pierwotna – układ włókien", "Stosunkowo cienkie i nieregularnie rozmieszczone włókna celulozowe.", "v70"], ["Ściana komórkowa wtórna – jakie komórki okrywa i jaki ma skład?", "Okrywa wyrośnięte i wyspecjalizowane komórki roślin; duża zawartość celulozy, mniejsza zawartość białek i wody.", "v70"], ["Ściana komórkowa wtórna – układ włókien", "Grube, regularnie ułożone włókna celulozowe; często budowa warstwowa.", "v70"], ["Inkrustacja (wysycanie)", "Wtórna zmiana ściany komórkowej polegająca na wnikaniu substancji do przestrzeni między włóknami celulozowymi (np. lignina, krzemionka).", "v70"], ["Adkrustacja (powlekanie)", "Wtórna zmiana ściany komórkowej polegająca na odkładaniu się substancji na powierzchni ściany (np. kutyna, suberyna, śluzy, gumy).", "v70"], ["Lignina (drzewnik)", "Substancja inkrustująca; nadaje ścianom sztywność i umożliwia pionowy transport wody w roślinie; występuje m.in. w komórkach drewna.", "v70"], ["Krzemionka (SiO2)", "Wysyca ściany komórkowe m.in. skrzypów i niektórych traw; wzmacnia roślinę i zwiększa jej odporność na ataki patogenów i roślinożerców.", "v70"], ["Kutyna", "Związek o charakterze tłuszczowym (adkrustacja); wchodzi w skład kutykuli pokrywającej komórki skórki pędu; zabezpiecza przed nadmiernym parowaniem wody.", "v70"], ["Suberyna", "Związek o charakterze tłuszczowym (adkrustacja); występuje w komórkach korkowicy; nadaje ścianom sztywność i zapobiega przenikaniu wody.", "v70"], ["Śluzy", "Polisacharydy odkładane na ścianie (adkrustacja), które chłoną wodę; wytwarzane m.in. przez nasiona lnu i pigwy.", "v70"], ["Gumy", "Polisacharydy wydzielane przez drzewa w miejscach zranień (np. guma arabska).", "v70"], ["Rola połączeń międzykomórkowych", "Umożliwiają kontakt komórkom budującym tkanki.", "v71"], ["Blaszka środkowa", "Spaja sąsiadujące komórki roślinne; leży między ich ścianami pierwotnymi; zbudowana z pektyn. Po jej rozpuszczeniu komórki się rozsuwają.", "v71"], ["Plazmodesmy", "Cytoplazmatyczne połączenia międzykomórkowe otoczone błoną komórkową, przechodzące przez otwory w ścianach dwóch sąsiednich komórek; łączą ich siateczki śródplazmatyczne.", "v71"], ["Funkcja plazmodesm", "Transport niektórych związków, m.in. fosfolipidów, aminokwasów i kwasów nukleinowych; mogą się otwierać lub zamykać zależnie od potrzeb komórki.", "v71"], ["W której tkance zwierzęcej jest najwięcej różnorodnych połączeń międzykomórkowych?", "W tkance nabłonkowej.", "v71"], ["Połączenia zamykające", "Uszczelniają warstwę nabłonka, izolując wewnętrzne środowisko narządu od otoczenia; występują wyłącznie w tkance nabłonkowej, w szczytowych częściach komórek.", "v71"], ["Desmosomy", "Łączą sąsiednie komórki w sposób mechaniczny; są z nimi połączone filamenty pośrednie (keratynowe) cytoszkieletu, co tworzy wytrzymałą sieć.", "v71"], ["Półdesmosomy", "Łączą filamenty pośrednie z błoną podstawną, co zapewnia integralność tkanki.", "v71"], ["Połączenia szczelinowe (neksus)", "Zbudowane z kompleksów białkowych – koneksonów – tworzących kanały łączące cytoplazmy sąsiednich komórek; umożliwiają transport jonów i małych cząsteczek polarnych.", "v71"], ["Gdzie występują połączenia szczelinowe?", "W tkance nabłonkowej, nerwowej i poprzecznie prążkowanej serca.", "v71"]], "t13": [["Cykl komórkowy", "Uporządkowany ciąg procesów zachodzących w trakcie życia komórki, obejmujący wzrost komórki, a następnie jej podział na dwie komórki potomne.", "v72"], ["Z jakich etapów składa się cykl komórkowy?", "Z interfazy (fazy G1, S i G2) oraz z fazy M (mitoza i cytokineza).", "v72"], ["Interfaza", "Okres międzypodziałowy cyklu komórkowego, obejmujący fazy G1, S i G2.", "v72"], ["Faza M", "Faza cyklu komórkowego obejmująca mitozę i cytokinezę.", "v72"], ["Co reguluje cykl komórkowy u eukariontów?", "Układ kontroli złożony z białek regulatorowych; przy nieprawidłowościach może na pewien czas zatrzymać cykl w określonych punktach (punkty kontrolne).", "v72"], ["Znaczenie białek regulatorowych cyklu", "Zapobiegają powstawaniu nieprawidłowych komórek, np. nowotworowych; wpływają na kluczowe zdarzenia, takie jak replikacja DNA i oddzielanie się chromosomów.", "v72"], ["Mitoza", "Podział jądra komórkowego na dwa identyczne pod względem genetycznym jądra potomne.", "v73"], ["Profaza (mitoza)", "Kondensacja chromatyny w chromosomy z dwiema chromatydami; zanik otoczki jądrowej i jąderka; powstaje wrzeciono podziałowe.", "v73"], ["Metafaza (mitoza)", "Chromosomy osiągają maksymalny stopień kondensacji; połączone z włóknami wrzeciona układają się w płaszczyźnie równikowej, tworząc płytkę metafazową.", "v73"], ["Anafaza (mitoza)", "Rozdzielenie chromosomów na dwie chromatydy (chromosomy potomne); skracające się włókna wrzeciona odciągają je do przeciwległych biegunów.", "v73"], ["Telofaza (mitoza)", "Rozluźnienie chromosomów do włókien chromatynowych; odtworzenie otoczki jądrowej i jąderka; u zwierząt zanik wrzeciona (u roślin uczestniczy jeszcze w cytokinezie); rozpoczyna się cytokineza.", "v73"], ["Wrzeciono podziałowe (kariokinetyczne)", "Zbudowana z mikrotubul struktura komórek eukariotycznych umożliwiająca kontrolowane przemieszczanie się chromosomów podczas podziału.", "v73"], ["Cytokineza", "Podział cytoplazmy (cytozolu i organelli); u zwierząt rozpoczyna się w anafazie, u roślin – na początku telofazy.", "v74"], ["Cytokineza w komórce roślinnej", "Zaczyna się od uformowania wrzeciona cytokinetycznego; w płaszczyźnie równikowej układają się pęcherzyki aparatu Golgiego, dostarczające materiał do budowy ścian komórek potomnych.", "v74"], ["Cytokineza w komórce zwierzęcej", "Mikrofilamenty tworzą w płaszczyźnie równikowej pierścień kurczliwy; jego skurcz tworzy bruzdę podziałową, co prowadzi do rozdzielenia komórek.", "v74"], ["Mejoza", "Podział jądra komórkowego na cztery jądra potomne, z których każde ma zredukowaną o połowę liczbę chromosomów w porównaniu z komórką macierzystą.", "v74"], ["Crossing-over", "Wymiana odcinków chromatyd między chromosomami homologicznymi w profazie pierwszego podziału mejotycznego.", "v74"], ["Znaczenie crossing-over", "Podstawa zróżnicowania genetycznego osobników w obrębie gatunku – powstają chromatydy o zmodyfikowanym układzie alleli, więc potomstwo różni się od rodziców.", "v74"], ["Allele", "Wersje genów zawarte w chromosomach homologicznych, które mogą się od siebie różnić.", "v74"], ["Profaza I", "Kondensacja chromatyny; koniugacja chromosomów homologicznych w biwalenty; może zajść crossing-over; zanik otoczki i jąderka; tworzy się wrzeciono.", "v75"], ["Koniugacja", "Proces układania się chromosomów homologicznych w pary (biwalenty) w profazie I.", "v75"], ["Biwalent", "Para połączonych ze sobą chromosomów homologicznych, czyli tetrada chromatyd.", "v75"], ["Metafaza I", "Chromosomy osiągają maksymalną kondensację; pary chromosomów homologicznych układają się w płaszczyźnie równikowej.", "v75"], ["Anafaza I", "Rozdzielenie chromosomów homologicznych; skracające się włókna wrzeciona odciągają chromosomy do przeciwległych biegunów.", "v75"], ["Telofaza I", "Struktura chromosomów częściowo się rozluźnia; odtwarzają się otoczka jądrowa i jąderko; rozpoczyna się cytokineza.", "v75"], ["Profaza II", "Kondensacja chromatyny w chromosomy z dwiema chromatydami; zanik otoczki i jąderka; formuje się wrzeciono podziałowe.", "v75"], ["Metafaza II", "Maksymalna kondensacja chromosomów; chromosomy połączone z wrzecionem układają się w płaszczyźnie równikowej w płytkę metafazową.", "v75"], ["Anafaza II", "Chromosomy rozdzielają się na dwie chromatydy (chromosomy potomne), odciągane przez skracające się włókna wrzeciona do biegunów.", "v76"], ["Telofaza II", "Rozluźnienie chromosomów do włókien chromatynowych; odtworzenie otoczki i jąderka; zanik wrzeciona; zachodzi cytokineza.", "v76"], ["Jakie komórki dzielą się mitotycznie?", "Diploidalne i haploidalne komórki somatyczne oraz komórki macierzyste mitospor i gamet u roślin.", "v76"], ["Jakie komórki dzielą się mejotycznie?", "Diploidalne komórki macierzyste gamet u zwierząt i niektórych typów zarodników (mejospor).", "v76"], ["Mitoza a mejoza – liczba podziałów i komórek potomnych", "Mitoza: jeden podział, dwie komórki o takim samym zestawie chromosomów jak macierzysta. Mejoza: dwa podziały, cztery komórki o zestawie zredukowanym o połowę.", "v76"], ["Czy w mitozie i mejozie zachodzi rekombinacja materiału genetycznego?", "W mitozie nie zachodzi; w mejozie zachodzi (crossing-over).", "v76"], ["Znaczenie mitozy", "Wzrost i rozwój organizmu, regeneracja, wymiana zużytych komórek, rozmnażanie bezpłciowe niektórych roślin, grzybów i protistów.", "v76"], ["Znaczenie mejozy", "Rozmnażanie płciowe, zróżnicowanie genetyczne osobników gatunku (crossing-over), zachowanie stałej liczby chromosomów charakterystycznej dla gatunku.", "v76"], ["Zmiany n i c w mitozie", "2n 2c → replikacja DNA → 2n 4c → mitoza → 2n 2c.", "v76"], ["Zmiany n i c w mejozie", "2n 2c → replikacja DNA → 2n 4c → mejoza I → 1n 2c → mejoza II → 1n 1c.", "v76"], ["Apoptoza", "Naturalna, zaplanowana śmierć komórki, kontrolowana przez geny; zachodzi odwodnienie i kurczenie się komórki oraz enzymatyczny rozkład DNA.", "v77"], ["Co umożliwia apoptoza?", "Usuwanie komórek uszkodzonych, nieprawidłowych lub zainfekowanych; eliminację komórek niepotrzebnych lub nadmiarowych (np. neuronów w rozwoju zarodkowym); usuwanie zbędnych struktur (np. zanik ogona u kijanki).", "v77"], ["Etapy apoptozy", "1. Początek (regulacja zewnątrz- i wewnątrzkomórkowa); 2. obkurczanie jądra, fragmentacja DNA, utrata wody, rozpad cytoszkieletu; 3. zanik otoczki jądrowej, uwypuklanie błony; 4. rozpad na ciałka apoptotyczne; 5. pochłanianie ich przez makrofagi.", "v77"]]};

note:"W vademecum zadanie ma łącznie 0–3 pkt (a i b). Podział na 2 + 1 pkt jest mój. Problem musi dotyczyć barwników, nie plonowania.",
expl:"Badany czynnik to zanieczyszczenie, więc kontrola to rośliny bez niego. Polecenie każe odnieść się do fotosyntezy, a z tabeli fotosyntezy dotyczą tylko barwniki."},
{id:"cke14-10b",topic:"t6",src:"CKE, grudzień 2014, zad. 10 b",book:"s. 23",kl:"rozwiązanie w vademecum s. 23",type:"open",max:1,scoring:"all",
ask:"Sformułuj hipotezę dotyczącą wpływu zanieczyszczeń powietrza na plonowanie gorczycy.",
crit:["Zdanie oznajmujące o wpływie tlenków siarki i azotu","Dotyczy plonowania gorczycy (np. liczby tworzonych nasion), nie barwników"],
note:"Poprawna jest też hipoteza przecząca: „…nie wpływają na plonowanie gorczycy”.",
expl:"Hipoteza ma zawierać X (tlenki siarki i azotu), Y (plonowanie) i Z (gorczyca). Przykład: „Zanieczyszczenia tlenkami siarki i azotu obniżają plonowanie gorczycy”."},
{id:"m23-4-2",topic:"t6",src:"CKE, maj 2023",a:"m23a",k:"m23k",where:"Zadanie 4.2",type:"open",max:1,scoring:"any",
ask:"W pierwszym etapie doświadczenia z chlorofilem wszystkie rośliny uprawiano w takich samych warunkach. Określ, w jakim celu.",
crit:["Aby otrzymać rośliny możliwie do siebie podobne (np. o zbliżonej zawartości chlorofilu)","LUB: aby wykluczyć wpływ innych czynników środowiska na wynik doświadczenia"],
note:"Wystarczy jeden z dwóch elementów.",
expl:"To klasyczny motyw: próby mają się różnić tylko badanym czynnikiem. Wspólna hodowla na starcie daje pewność, że późniejsze różnice wynikają z oświetlenia, a nie z historii roślin."},
{id:"m23-4-3",topic:"t6",src:"CKE, maj 2023",a:"m23a",k:"m23k",where:"Zadanie 4.3",type:"open",max:1,scoring:"any",
ask:"Określ, w jakim celu zmierzono zawartość chlorofilu w pierwszym dniu drugiego etapu doświadczenia.",
crit:["Pomiar kontrolny – pozwala obliczyć zmianę zawartości chlorofilu po zmianie oświetlenia","LUB: pozwala sprawdzić, czy badane rośliny były do siebie podobne"],
note:"Wystarczy jeden z dwóch elementów.",
expl:"Bez pomiaru na starcie nie wiesz, czy wynik końcowy to zmiana, czy stan wyjściowy. Pomiar początkowy działa jak punkt odniesienia."},
{id:"m23-6-1",topic:"t6",src:"CKE, maj 2023",a:"m23a",k:"m23k",where:"Zadanie 6.1",type:"open",max:1,scoring:"all",
ask:"Sformułuj wniosek z doświadczenia o wpływie młodych liści jabłoni na rozwój strefy odcinającej w ogonkach liściowych.",
crit:["Auksyny wytwarzane przez młode liście","hamują rozwój strefy odcinającej"],
note:"Klucz uznaje też krótko: „Jest on hamujący”.",
expl:"Wniosek musi wynikać z wyników i dotyczyć tego doświadczenia. Tu kierunek wpływu to hamowanie."},
{id:"m23-4-1",topic:"t7",src:"CKE, maj 2023",a:"m23a",k:"m23k",where:"Zadanie 4.1",type:"closed",max:2,
ask:"Ocena prawdziwości trzech stwierdzeń na podstawie wyników doświadczenia z chlorofilem (analiza danych).",answer:"1 – P, 2 – F, 3 – F",
expl:"2 pkt za trzy poprawne oceny, 1 pkt za dwie. Przy takich stwierdzeniach zawsze porównuj z danymi liczbowymi, a nie z tym, co „powinno” wyjść."},
{id:"m23-18",topic:"t7",src:"CKE, maj 2023",a:"m23a",k:"m23k",where:"Zadanie 18",type:"closed",max:2,
ask:"Określ, czy dane spełniają trzy podane kryteria (analiza wyników badań populacji).",answer:"1 – T, 2 – T, 3 – T",
expl:"2 pkt za trzy poprawne, 1 pkt za dwie. Zadanie sprawdza umiejętność analizy danych w oparciu o proste statystyki."},
{id:"c25-1-1",topic:"t1",src:"CKE, czerwiec 2025",a:"c25a",k:"c25k",where:"Zadanie 1.1, początek arkusza",type:"closed",max:1,
ask:"Zadanie zamknięte o mioglobinie i roli żelaza. Przeczytaj tekst w arkuszu i wybierz odpowiedź.",
answer:"D",
expl:"Mioglobina to białko mięśni, które magazynuje tlen. Wiąże go dzięki hemowi z jonem żelaza – tak samo jak hemoglobina, tylko ma jeden łańcuch zamiast czterech."},
{id:"m23-10-1",topic:"t2",src:"CKE, maj 2023",a:"m23a",k:"m23k",where:"Zadanie 10.1, strony 16–17",type:"open",max:1,scoring:"all",
ask:"Podaj nazwę białka budującego pierścienie tchawicy człowieka oraz polisacharydu budującego zgrubienia kutykuli w tchawkach owadów.",
crit:["Białko w tchawicy człowieka: kolagen","Polisacharyd w tchawkach owadów: chityna"],
note:"Punkt tylko za obie nazwy. Klucz przyjmuje też opis chityny jako polimeru N-acetyloglukozaminy.",
expl:"Kolagen to wytrzymałe białko tkanki łącznej, także chrząstki. Chityna to polisacharyd z azotem, który buduje kutykulę stawonogów i ściany grzybów. Typowe błędy to keratyna (białko naskórka i włosów) oraz celuloza (ściany roślin)."},
{id:"c25-22-2",topic:"t3",src:"CKE, czerwiec 2025",a:"c25a",k:"c25k",where:"Zadanie 22.2, koniec arkusza",type:"open",max:2,scoring:"sum",
ask:"Podaj dwa argumenty za tym, że tłuszcze (trójglicerydy) są korzystniejszym materiałem zapasowym niż glikogen.",
crit:["Tłuszcze dostarczają więcej energii w przeliczeniu na masę","Tłuszcze są magazynowane bez wody (glikogen wiąże wodę)"],
note:"Każdy z dwóch argumentów jest wart 1 punkt.",
expl:"Gram tłuszczu daje ponad dwa razy więcej energii niż gram cukru. Glikogen jest hydrofilowy i wiąże dużo wody, więc ten sam zapas energii w glikogenie byłby znacznie cięższy. Dla zwierząt, które muszą oszczędzać masę ciała, na przykład latających, to bardzo ważna przewaga."},
{id:"c25-1-2",topic:"t4",src:"CKE, czerwiec 2025",a:"c25a",k:"c25k",where:"Zadanie 1.2, początek arkusza",type:"open",max:1,scoring:"all",
ask:"Wyjaśnij, dlaczego aminokwasy niepolarne znajdują się głównie we wnętrzu cząsteczki mioglobiny.",
crit:["Podstawniki (reszty R) aminokwasów niepolarnych są hydrofobowe","Białko zwija się w środowisku wodnym (cytozolu)"],
note:"Punkt wymaga obu elementów: hydrofobowości i wodnego środowiska.",
expl:"To ta sama zasada, która sprawia, że krople oleju łączą się w wodzie. Hydrofobowe fragmenty łańcucha „uciekają” od wody do środka, a polarne zostają na powierzchni i kontaktują się z cytozolem."},
{id:"m23-12-2",topic:"t4",src:"CKE, maj 2023",a:"m23a",k:"m23k",where:"Zadanie 12.2, strony 20–21",type:"open",max:1,scoring:"all",
ask:"Na podstawie tekstu określ najwyższą rzędowość struktury toksyny botulinowej i uzasadnij to jedną cechą jej budowy.",
crit:["Struktura IV-rzędowa","Uzasadnienie: toksyna ma dwa łańcuchy polipeptydowe (lekki i ciężki)"],
note:"Nie wystarczy sama definicja IV-rzędowości bez odniesienia do tej toksyny. Nie wystarczy też wskazanie mostka disiarczkowego.",
expl:"Struktura IV-rzędowa oznacza co najmniej dwa łańcuchy polipeptydowe. W tekście opisano łańcuch lekki i ciężki – i to jest dowód. Mostek disiarczkowy może łączyć fragmenty jednego łańcucha w strukturze III-rzędowej, więc sam niczego nie przesądza."},
{id:"m23-13-1",topic:"t5",src:"CKE, maj 2023",a:"m23a",k:"m23k",where:"Zadanie 13.1, strona 22",type:"open",max:1,scoring:"all",
ask:"Uzupełnij schemat PCR: na schemacie są dGTP i dTTP. Dopisz dwa brakujące deoksyrybonukleotydy.",
crit:["dATP","dCTP"],
note:"Klucz nie uznaje rybonukleotydów, np. ATP zamiast dATP.",
expl:"DNA buduje się z czterech deoksyrybonukleotydów: dATP, dGTP, dCTP i dTTP. Litera „d” oznacza deoksyrybozę. ATP i CTP to rybonukleotydy do syntezy RNA, a dUTP odpada, bo uracyl występuje w RNA."},
{id:"c25-2-1",topic:"t5",src:"CKE, czerwiec 2025",a:"c25a",k:"c25k",where:"Zadanie 2.1",type:"closed",max:1,
ask:"Zadanie zamknięte o budowie ATP i jej związku z funkcją. Rozwiąż w arkuszu.",
answer:"C",
expl:"ATP to adenina + ryboza + trzy reszty fosforanowe. Energia jest uwalniana przy odłączaniu reszty fosforanowej (hydroliza do ADP i fosforanu)."},
{id:"c25-2-2",topic:"t5",src:"CKE, czerwiec 2025",a:"c25a",k:"c25k",where:"Zadanie 2.2",type:"closed",max:1,
ask:"Ocena prawdziwości dwóch stwierdzeń o ATP. Rozwiąż w arkuszu.",
answer:"1 – P, 2 – F (punkt tylko za oba)",
expl:"W zadaniach P/F czytaj każde słowo stwierdzenia. Jedno nieprecyzyjne określenie, np. rodzaj cukru albo liczba reszt fosforanowych, robi z całości fałsz."}];

const QUIZ={"t6": [{"k": "abcd", "q": "W doświadczeniu „Wpływ jednostronnego oświetlenia na kierunek wzrostu pędu i korzenia siewki fasoli” obiektem badań są:", "o": ["siewki fasoli", "kierunek wzrostu pędu i korzenia", "jednostronne oświetlenie", "równomierne oświetlenie"], "a": 0, "e": "Obiekt badań to organizmy lub materiał biologiczny, na których prowadzi się badania – tu siewki fasoli. Kierunek wzrostu to przedmiot badań, a oświetlenie to badany czynnik.", "src": "v15"}, {"k": "abcd", "q": "W tym samym doświadczeniu z siewkami fasoli przedmiotem badań jest:", "o": ["kierunek wzrostu pędu i korzenia", "siewka fasoli w słoiku z wodą", "jednostronne oświetlenie siewki", "czarna bibuła w słoiku"], "a": 0, "e": "Przedmiot badań to zjawisko lub proces poddawane analizie – tu kierunek wzrostu pędu i korzenia. Jednostronne oświetlenie to badany czynnik.", "src": "v15"}, {"k": "abcd", "q": "Które zdanie jest hipotezą w badaniu kiełkowania nasion pieprzycy siewnej?", "o": ["Woda nie pobudza kiełkowania nasion pieprzycy siewnej.", "Czy woda pobudza kiełkowanie nasion pieprzycy siewnej?", "Wpływ wody na kiełkowanie nasion pieprzycy siewnej.", "Dziesięć nasion pieprzycy umieszczono na suchej wacie."], "a": 0, "e": "Hipoteza to możliwa odpowiedź na problem badawczy, w formie zdania oznajmującego – także przeczącego. Pytanie i równoważnik zdania to formy problemu badawczego.", "src": "v14"}, {"k": "abcd", "q": "Zdanie „Wpływ stężenia CO2 na intensywność fotosyntezy u moczarki kanadyjskiej” to:", "o": ["problem badawczy", "hipoteza", "wniosek", "próba badawcza"], "a": 0, "e": "Problem badawczy może mieć postać równoważnika zdania typu „Wpływ X na Y u Z”. Hipoteza i wniosek mają formę zdania oznajmującego.", "src": "v14"}, {"k": "abcd", "q": "Która cecha odróżnia doświadczenie od obserwacji?", "o": ["Badacz celowo zmienia jeden czynnik w kontrolowanych warunkach.", "Badacz określa stan faktyczny bez wpływu na przedmiot badań.", "Badacz prowadzi badania w naturalnym środowisku organizmów.", "Badacz do analizy obiektu badań używa mikroskopu."], "a": 0, "e": "W doświadczeniu badacz celowo, w kontrolowanych warunkach, zmienia jeden z czynników. Określanie stanu faktycznego bez ingerencji to cecha obserwacji.", "src": "v14"}, {"k": "abcd", "q": "Który przykład jest doświadczeniem, a nie obserwacją?", "o": ["badanie aktywności pepsyny w zależności od pH", "badanie zachowań godowych ptaków w ich środowisku", "mikroskopowe badanie chromosomów w komórce", "badanie liczby ptaków w wybranym lesie"], "a": 0, "e": "W badaniu pepsyny badacz celowo zmienia pH środowiska. W pozostałych przykładach jedynie określa się stan faktyczny, bez wpływu na przedmiot badań.", "src": "v14"}, {"k": "abcd", "q": "Która próba jest prawidłową próbą kontrolną w doświadczeniu „Czy woda pobudza kiełkowanie nasion pieprzycy siewnej?”", "o": ["10 nasion pieprzycy siewnej na suchej wacie", "10 nasion pieprzycy siewnej na wilgotnej wacie", "20 nasion pieprzycy siewnej na wilgotnej wacie", "10 nasion pieprzycy siewnej na mokrej wacie w 10°C"], "a": 0, "e": "W próbie kontrolnej brak badanego czynnika (wody), a wszystko inne jest takie jak w próbie badawczej. Wilgotna wata to warunki próby badawczej.", "src": "v14"}, {"k": "abcd", "q": "Która próba jest prawidłową próbą kontrolną w doświadczeniu z jednostronnym oświetleniem siewek fasoli?", "o": ["Taki sam zestaw, oświetlany równomiernie, bez czarnej bibuły.", "Taki sam zestaw, oświetlany jednokierunkowo, bez czarnej bibuły.", "Taki sam zestaw, oświetlany jednokierunkowo, w temperaturze 10°C.", "Taki sam zestaw z czarną bibułą, oświetlany jednokierunkowo."], "a": 0, "e": "Próba kontrolna nie jest poddana badanemu czynnikowi (jednostronnemu oświetleniu), więc dostaje równomierne światło. Zmiana temperatury wprowadzałaby inny czynnik.", "src": "v15"}, {"k": "abcd", "q": "Do czego służy próba kontrolna?", "o": ["Do określenia, czy badany czynnik wpływa na wyniki próby badawczej.", "Do zwiększenia liczebności nasion lub organizmów w  "abcd", "q": "Na którym etapie badań planuje się próbę badawczą i próbę kontrolną?", "o": ["weryfikacja hipotezy", "postawienie hipotezy", "sformułowanie problemu badawczego", "sformułowanie wniosku"], "a": 0, "e": "Weryfikacja hipotezy obejmuje zaplanowanie doświadczeń z próbami badawczą i kontrolną, ich przeprowadzenie, zebranie i analizę wyników.", "src": "v14"}, {"k": "luka", "q": "Problem badawczy określa ___ badań.", "o": ["cel", "obiekt", "wynik", "wniosek"], "a": 0, "e": "Problem badawczy – pytanie lub równoważnik zdania – określa cel badań.", "src": "v14"}, {"k": "luka", "q": "Próba kontrolna ___ to próba, w której można zaobserwować badane zjawisko lub proces.", "o": ["pozytywna", "negatywna", "badawcza", "wzorcowa"], "a": 0, "e": "W próbie kontrolnej pozytywnej badane zjawisko występuje (np. zawiesina skrobi), w negatywnej – nie (np. woda destylowana).", "src": "v15"}, {"k": "luka", "q": "Obserwacje makroskopowe dotyczą obiektów o wielkości powyżej ___.", "o": ["0,01 mm", "0,1 mm", "0,001 mm", "1 mm"], "a": 0, "e": "Granica między obserwacjami makroskopowymi a mikroskopowymi to 0,01 mm.", "src": "v15"}, {"k": "pf", "q": "Obserwacja może stanowić niezależną metodę badawczą lub być elementem doświadczenia.", "a": true, "e": "Tak – obserwacja bywa samodzielną metodą albo częścią doświadczenia.", "src": "v14"}, {"k": "pf", "q": "Wniosek jest potwierdzeniem lub zaprzeczeniem problemu badawczego.", "a": false, "e": "Wniosek potwierdza lub zaprzecza hipotezie, a nie problemowi badawczemu.", "src": "v14"}, {"k": "pf", "q": "Próba kontrolna to próba, w której przedmiot badań jest poddany działaniu badanego czynnika.", "a": false, "e": "To definicja próby badawczej. W próbie kontrolnej przedmiot badań nie jest poddany działaniu badanego czynnika.", "src": "v15"}, {"k": "pf", "q": "Hipoteza może mieć formę zdania oznajmującego przeczącego.", "a": true, "e": "Hipoteza ma formę zdania oznajmującego twierdzącego lub przeczącego, np. „Woda nie pobudza kiełkowania nasion pieprzycy siewnej”.", "src": "v14"}, {"k": "para", "q": "Dopasuj etap badań do przykładu z doświadczenia z pieprzycą siewną.", "p": [["Zaobserwowanie zjawiska", "Nasiona zaczynają kiełkować na mokrej wacie."], ["Sformułowanie problemu badawczego", "Czy woda pobudza kiełkowanie nasion pieprzycy?"], ["Postawienie hipotezy", "Woda nie pobudza kiełkowania nasion pieprzycy."], ["Weryfikacja hipotezy", "Po 3 dniach liczy się wykiełkowane nasiona w obu próbach."]], "src": "v14"}, {"k": "para", "q": "Dopasuj pojęcie do elementu doświadczenia „Wpływ jednostronnego oświetlenia na kierunek wzrostu pędu i korzenia siewki fasoli”.", "p": [["Badany czynnik", "jednostronne oświetlenie"], ["Przedmiot badań", "kierunek wzrostu pędu i korzenia"], ["Obiekt badań", "siewki fasoli"], ["Próba kontrolna", "siewka oświetlana równomiernie"]], "src": "v15"}], "t7": [{"k": "abcd", "q": "We wniosku „Mikoryzacja pobudza pobieranie Fe, Mn i Zn przez wilca wodnego” zmienną niezależną jest:", "o": ["mikoryzacja", "pobieranie Fe, Mn i Zn", "wilec wodny", "zawartość Fe, Mn i Zn"], "a": 0, "e": "Zmienna niezależna to czynnik zmieniany przez badacza – obecność mikoryzy. Pobieranie pierwiastków zmienia się pod jej wpływem, więc jest zmienną zależną.", "src": "v18"}, {"k": "abcd", "q": "Który przykład jest zmienną jakościową?", "o": ["rodzaj zachowania organizmu", "liczebność osobników w populacji", "intensywność fotosyntezy", "grubość blaszki liściowej"], "a": 0, "e": "Zmienną jakościową opisuje się słownie (np. płeć, rodzaje zachowań). Pozostałe wartości można uporządkować według skali – są ilościowe.", "src": "v18"}, {"k": "abcd", "q": "Na której osi wykresu zwykle zaznacza się wartości zmiennej niezależnej?", "o": ["na osi X", "na osi Y", "w legendzie wykresu", "w tytule wykresu"], "a": 0, "e": "Zmienną niezależną (np. temperaturę) zaznacza się zwykle na osi X, a zależną na osi Y.", "src": "v19"}, {"k": "abcd", "q": "Badacz chce pokazać tendencję, z jaką intensywność pobierania jonów zmienia się wraz z temperaturą. Jaki wykres powinien wybrać?", "o": ["liniowy", "kolumnowy", "kołowy", "jednosłupkowy"], "a": 0, "e": "Wykres liniowy służy do określania tendencji zmian zmiennej zależnej pod wpływem niezależnej; kolumnowy – do porównania wartości pomiarów.", "src": "v19"}, {"k": "abcd", "q": "Które wykresy służą do przedstawiania procentowego udziału elementów w zbiorze danych?", "o": ["kołowy i jednosłupkowy", "kolumnowy i liniowy", "liniowy i kołowy", "kolumnowy i jednosłupkowy"], "a": 0, "e": "Procentowy udział (np. kolorów sierści myszy) przedstawia się na wykresie kołowym lub jednosłupkowym. Kolumnowy i liniowy pokazują zależność zmiennych.", "src": "v19"}, {"k": "abcd", "q": "Według tabeli pobierania jonów przez korzenie, przy jakiej temperaturze intensywność pobierania potasu była najwyższa?", "o": ["30°C", "40°C", "20°C", "10°C"], "a": 0, "e": "Potas: 1,1 j.u. w 30°C, a w 40°C spadek do 1,0 j.u. Najwyższe pobieranie w 40°C dotyczy fosforu (0,6 j.u.).", "src": "v19"}, {"k": "abcd", "q": "Jak zmienia się intensywność pobierania fosforu przez korzenie w zakresie 10–40°C?", "o": ["Rośnie w całym badanym zakresie temperatur.", "Rośnie do 30°C, a potem nieznacznie spada.", "Maleje w całym badanym zakresie temperatur.", "Nie zmienia się w badanym zakresie temperatur."], "a": 0, "e": "Fosfor: 0,1 → 0,3 → 0,5 → 0,6 j.u. – wartości rosną stale. Wzrost do 30°C i spadek w 40°C to przebieg dla potasu.", "src": "v19"}, {"k": "abcd", "q": "Grubość blaszki liściowej: wiąz pospolity 176 µm, olsza czarna 146 µm, grab pospolity 93 µm. Zakres zmienności wynosi:", "o": ["od 93 µm do 176 µm", "od 93 µm do 146 µm", "od 146 µm do 176 µm", "od 0 µm do 176 µm"], "a": 0, "e": "Zakres zmienności to przedział między minimum (93 µm – grab) a maksimum (176 µm – wiąz).", "src": "v20"}, {"k": "abcd", "q": "W badanej próbie stwierdzono: szarobrązowe z normalnymi skrzydłami – 965, czarne ze skrzydłami zredukowanymi – 944, szarobrązowe ze skrzydłami zredukowanymi – 206, czarne z normalnymi skrzydłami – 185. Dominantą jest fenotyp:", "o": ["szarobrązowy z normalnymi skrzydłami", "czarny ze skrzydłami zredukowanymi", "szarobrązowy ze skrzydłami zredukowanymi", "czarny z normalnymi skrzydłami"], "a": 0, "e": "Dominanta to wartość najczęstsza – fenotyp szarobrązowy z normalnymi skrzydłami (965). Dominantą może być też zmienna jakościowa.", "src": "v20"}, {"k": "abcd", "q": "Wyniki pomiaru tętna: 60, 70, 75, 88, 62. Mediana wynosi:", "o": ["70", "75", "71", "62"], "a": 0, "e": "Po uszeregowaniu (60, 62, 70, 75, 88) wartością środkową jest 70. 75 to środek nieuporządkowanej listy, a 71 to średnia arytmetyczna.", "src": "v20"}, {"k": "abcd", "q": "Wyniki pomiaru tętna: 60, 70, 75, 88, 62. Średnia arytmetyczna wynosi:", "o": ["71", "70", "75", "74"], "a": 0, "e": "Suma 355 podzielona przez 5 pomiarów daje 71. Wartość 70 to mediana.", "src": "v20"}, {"k": "abcd", "q": "Kiedy należy zastosować średnią ważoną?", "o": ["gdy liczy się średnią ze średnich prób o różnej liczebności", "gdy liczba pomiarów w próbie jest parzysta", "gdy dane w próbie są zmienną jakościową", "gdy szuka się wartości najczęstszej w próbie"], "a": 0, "e": "Średnią ważoną liczy się m.in. z wcześniej obliczonych, nierównocennych średnich – wagą jest np. liczebność próby. Przy parzystej liczbie pomiarów chodzi o medianę.", "src": "v20"}, {"k": "abcd", "q": "Średnia liczebność zięb: powierzchnia A (100 m²) – 2, B (200 m²) – 3, C (500 m²) – 8. Średnia ważona liczebność zięb wynosi:", "o": ["6 zięb", "około 4,3 zięby", "8 zięb", "13 zięb"], "a": 0, "e": "(2 × 100 + 3 × 200 + 8 × 500) / 800 = 6. Wynik około 4,3 to zwykła średnia arytmetyczna, która pomija różną wielkość powierzchni.", "src": "v20"}, {"k": "abcd", "q": "Czego NIE można określić na podstawie wąsów odchylenia standardowego?", "o": ["zakresu zmienności wyników", "czy wyniki są zbliżone do średniej", "wartości średniej w danej próbie", "zróżnicowania pomiarów w próbie"], "a": 0, "e": "Wąsy odchylenia standardowego wyznaczają średnią ± σ, więc nie pokazują minimum i maksimum, czyli zakresu zmienności.", "src": "v21"}, {"k": "abcd", "q": "Na wykresie wąsy odchylenia standardowego prób A i D nie pokrywają się. Co można przypuszczać?", "o": ["Między próbami występują znaczące różnice.", "Między próbami nie ma znaczących różnic.", "Obie próby mają ten sam zakres zmienności.", "Obie próby mają takie samo odchylenie."], "a": 0, "e": "Brak pokrywania się wąsów odchylenia standardowego sugeruje znaczące różnice; gdy wąsy się pokrywają (jak w A i B), różnice są przypuszczalnie nieznaczące.", "src": "v21"}, {"k": "abcd", "q": "Wysoka wartość odchylenia standardowego oznacza, że:", "o": ["wartości pomiarów są oddalone od średniej", "wartości pomiarów są zbliżone do średniej", "średnia arytmetyczna próby jest wysoka", "w próbie jest dużo pomiarów o tej samej wartości"], "a": 0, "e": "σ określa, jak bardzo wyniki odbiegają od średniej – wysoka σ to duży rozrzut wokół średniej, niezależnie od samej wartości średniej.", "src": "v21"}, {"k": "luka", "q": "Tytuł wykresu powinien znajdować się tuż ___ nim.", "o": ["pod", "nad", "przed", "obok"], "a": 0, "e": "Tytuł wykresu umieszcza się tuż pod wykresem – inaczej niż tytuł tabeli, który jest zawsze nad tabelą.", "src": "v18"}, {"k": "luka", "q": "Mediana to wartość ___ w uporządkowanym szeregu danych.", "o": ["środkowa", "najczęstsza", "najwyższa", "najniższa"], "a": 0, "e": "Mediana to wartość środkowa; najczęstsza to dominanta, najwyższa – maksimum, najniższa – minimum.", "src": "v20"}, {"k": "luka", "q": "Symbol jednostki można podać w nagłówku tabeli w nawiasie ___.", "o": ["kwadratowym", "okrągłym", "klamrowym", "ostrym"], "a": 0, "e": "Jednostkę zapisuje się w nawiasie kwadratowym, np. [µm] – wtedy liczby w kolumnie nie muszą mieć symbolu jednostki.", "src": "v18"}, {"k": "luka", "q": "Wartość zmiennej ___ jest zmieniana przez badacza podczas doświadczenia.", "o": ["niezależnej", "zależnej", "jakościowej", "ilościowej"], "a": 0, "e": "Badacz zmienia zmienną niezależną (np. temperaturę), a zmienna zależna zmienia się pod jej wpływem.", "src": "v18"}, {"k": "pf", "q": "Dominantą może być zarówno zmienna ilościowa, jak i jakościowa.", "a": true, "e": "Tak – np. dominantą może być fenotyp (zmienna jakościowa), jeśli występuje najczęściej.", "src": "v20"}, {"k": "pf", "q": "Jeśli liczba pomiarów jest nieparzysta, medianą jest średnia arytmetyczna z dwóch środkowych pomiarów.", "a": false, "e": "Średnią z dwóch środkowych pomiarów liczy się przy parzystej liczbie pomiarów; przy nieparzystej mediana to wartość środkowa.", "src": "v20"}, {"k": "pf", "q": "Na podstawie wąsów odchylenia standardowego można wyznaczyć minimum i maksimum w próbie.", "a": false, "e": "Minimum i maksimum wyznaczają wąsy zakresu zmienności. Z wąsów odchylenia standardowego nie można wyznaczyć zakresu zmienności.", "src": "v21"}, {"k": "pf", "q": "Tytuł tabeli znajduje się zawsze nad tabelą.", "a": true, "e": "Tak – tytuł tabeli określa jej zawartość i jest zawsze nad nią (tytuł wykresu – pod wykresem).", "src": "v18"}, {"k": "para", "q": "Dopasuj parametr statystyczny do jego definicji.", "p": [["Minimum", "najniższa wartość uzyskana w próbie"], ["Maksimum", "najwyższa wartość uzyskana w próbie"], ["Dominanta", "najczęstsza wartość w próbie"], ["Mediana", "środkowa wartość uporządkowanego szeregu"]], "src": "v20"}, {"k": "para", "q": "Dopasuj element do jego miejsca w tabeli lub na wykresie.", "p": [["Tytuł tabeli", "zawsze nad tabelą"], ["Tytuł wykresu", "tuż pod wykresem"], ["Zmienna niezależna", "zwykle na osi X"], ["Zmienna zależna", "zwykle na osi Y"]], "src": "v19"}], "t1": [{"k": "abcd", "q": "Który zestaw zawiera wyłącznie pierwiastki biogenne?", "o": ["C, H, O, N, S, P", "C, H, O, N, Ca, Mg", "C, H, O, N, Fe, I", "C, H, O, K, Na, Cl"], "a": 0, "e": "Pierwiastki biogenne to C, H, O, N, S, P. Ca, Mg, K, Na, Cl to pozostałe makroelementy, a Fe i I – mikroelementy.", "src": "v26"}, {"k": "abcd", "q": "Który z wymienionych pierwiastków należy do mikroelementów?", "o": ["żelazo", "magnez", "potas", "siarka"], "a": 0, "e": "Żelazo stanowi poniżej 0,01% suchej masy komórek. Magnez i potas to makroelementy niebiogenne, a siarka – pierwiastek biogenny.", "src": "v26"}, {"k": "abcd", "q": "Który pierwiastek jest składnikiem chlorofilu?", "o": ["magnez", "żelazo", "wapń", "potas"], "a": 0, "e": "Magnez jest składnikiem chlorofilu. Żelazo wchodzi w skład enzymów fotosyntezy, ale nie jest składnikiem chlorofilu.", "src": "v26"}, {"k": "abcd", "q": "Niedobór którego pierwiastka może prowadzić do powiększenia tarczycy (wola)?", "o": ["jodu", "fluoru", "żelaza", "wapnia"], "a": 0, "e": "Jod jest składnikiem hormonów tarczycy, a jego niedobór powoduje wole i niedorozwój umysłowy.", "src": "v27"}, {"k": "abcd", "q": "Który pierwiastek jest składnikiem keratyny i koenzymu A?", "o": ["siarka", "azot", "fosfor", "wapń"], "a": 0, "e": "Siarka (SO42–) wchodzi w skład keratyny i koenzymu A; jej niedobór pogarsza stan skóry, włosów i paznokci.", "src": "v26"}, {"k": "abcd", "q": "U pacjenta stwierdzono niedokrwistość i zakłócenie procesu oddychania komórkowego. Niedobór którego pierwiastka może być przyczyną?", "o": ["żelaza", "magnezu", "potasu", "jodu"], "a": 0, "e": "Żelazo jest składnikiem hemoglobiny i enzymów oddychania tlenowego. Niedobór magnezu i potasu również zaburza rytm serca, ale nie powoduje niedokrwistości.", "src": "v27"}, {"k": "abcd", "q": "Zaburzenia krzepnięcia krwi oraz drgawki i silne skurcze mięśni to objawy niedoboru:", "o": ["wapnia", "fosforu", "fluoru", "magnezu"], "a": 0, "e": "Wapń bierze udział w krzepnięciu krwi i działaniu komórek mięśniowych. Niedobór fosforu daje łamliwość kości, a fluoru – próchnicę.", "src": "v26"}, {"k": "abcd", "q": "W jakiej głównej formie fosfor występuje w organizmach?", "o": ["PO43–", "SO42–", "NO3–", "NH4+"], "a": 0, "e": "Fosfor występuje głównie jako jon fosforanowy PO43–; SO42– to forma siarki, a NO3– i NH4+ – azotu.", "src": "v26"}, {"k": "abcd", "q": "Które oddziaływanie występuje między zasadami azotowymi w kwasach nukleinowych?", "o": ["wiązanie wodorowe", "siły van der Waalsa", "oddziaływanie hydrofobowe", "wiązanie jonowe"], "a": 0, "e": "Według tabeli wiązania wodorowe występują między cząsteczkami wody oraz między zasadami azotowymi w kwasach nukleinowych.", "src": "v27"}, {"k": "abcd", "q": "Co się dzieje z cząsteczkami niepolarnymi umieszczonymi w środowisku wodnym?", "o": ["Układają się tak, aby ich kontakt z wodą był jak najmniejszy.", "Układają się tak, aby ich kontakt z wodą był jak największy.", "Tworzą wokół siebie otoczki hydratacyjne z cząsteczek wody.", "Łączą się z cząsteczkami wody wiązaniami wodorowymi."], "a": 0, "e": "To oddziaływania hydrofobowe. Otoczki hydratacyjne woda tworzy wokół jonów i dipoli, a nie cząsteczek niepolarnych.", "src": "v27"}, {"k": "abcd", "q": "Jakim wiązaniem atom tlenu łączy się z atomami wodoru w cząsteczce wody?", "o": ["kowalencyjnym spolaryzowanym", "kowalencyjnym niespolaryzowanym", "jonowym", "wodorowym"], "a": 0, "e": "W H2O para elektronowa jest przesunięta w stronę bardziej elektroujemnego tlenu. Wiązania wodorowe łączą różne cząsteczki wody, a nie atomy w jednej cząsteczce.", "src": "v28"}, {"k": "abcd", "q": "Dlaczego cząsteczka wody jest dipolem?", "o": ["Wiązania O–H tworzą kąt 104,5°, co rozdziela ładunki cząstkowe na dwa bieguny.", "Wiązania O–H leżą na jednej prostej, co równomiernie rozkłada ładunki cząstkowe.", "Atom tlenu łączy się z atomami wodoru wiązaniami jonowymi o przeciwnych ładunkach.", "Cząsteczki wody łączą się ze sobą wiązaniami wodorowymi w regularną sieć."], "a": 0, "e": "Kątowe ułożenie spolaryzowanych wiązań O–H powoduje rozdział ładunków δ+ i δ–. Wiązania wodorowe są skutkiem polarności, a nie jej przyczyną.", "src": "v28"}, {"k": "abcd", "q": "Dlaczego lód utrzymuje się na powierzchni zbiorników wodnych?", "o": ["Przy spadku temperatury wiązania wodorowe stają się dłuższe i bardziej regularne.", "Przy spadku temperatury wiązania wodorowe stają się krótsze i bardziej nieregularne.", "Przy spadku temperatury cząsteczki wody tracą polarność i przestają się przyciągać.", "Przy spadku temperatury wiązania kowalencyjne O–H wydłużają się i słabną."], "a": 0, "e": "Dłuższe, regularnie rozmieszczone wiązania wodorowe zmniejszają gęstość lodu względem wody ciekłej. Krótkie i nieregularne wiązania cechują wodę w stanie ciekłym.", "src": "v29"}, {"k": "abcd", "q": "Którą właściwość wody wykorzystuje organizm ssaka, ochładzając się podczas pocenia?", "o": ["wysokie ciepło parowania", "wysokie ciepło właściwe", "wysokie napięcie powierzchniowe", "małą ściśliwość"], "a": 0, "e": "Odparowanie wody wymaga dostarczenia dużej ilości energii, co ochładza organizm. Wysokie ciepło właściwe chroni przed nagłymi zmianami temperatury, ale nie wiąże się z parowaniem.", "src": "v29"}, {"k": "abcd", "q": "Która właściwość wody umożliwia nartnikom poruszanie się po jej powierzchni?", "o": ["wysokie napięcie powierzchniowe", "wysokie ciepło właściwe", "zdolność do adhezji", "mała ściśliwość"], "a": 0, "e": "Na styku woda – powietrze powstaje cienka, sprężysta błonka, na której mogą utrzymywać się małe organizmy.", "src": "v29"}, {"k": "abcd", "q": "Które właściwości wody umożliwiają jej podnoszenie się w komórkach drewna wbrew sile grawitacji?", "o": ["kohezja i adhezja", "napięcie powierzchniowe i mała ściśliwość", "wysokie ciepło właściwe i ciepło parowania", "duża gęstość i mała ściśliwość"], "a": 0, "e": "Kohezja zapewnia wytrzymałość słupa wody na rozciąganie, a adhezja – przyciąganie wody przez naładowane ściany komórkowe.", "src": "v29"}, {"k": "abcd", "q": "Które jony zmniejszają płynność cytozolu?", "o": ["Ca2+ i Mg2+", "Na+ i K+", "Na+ i Cl–", "K+ i Cl–"], "a": 0, "e": "Jony Ca2+ i Mg2+ zmniejszają płynność cytozolu, a Na+ i K+ ją zwiększają.", "src": "v30"}, {"k": "abcd", "q": "Jaką funkcję w płynach ustrojowych pełnią jony wodorowęglanowe i wodorofosforanowe(V)?", "o": ["Utrzymują stałe pH jako składniki roztworów buforowych.", "Zmniejszają płynność cytozolu jako składniki szkieletu.", "Generują impulsy nerwowe jako składniki płynów ustrojowych.", "Budują kości jako nierozpuszczalne składniki mineralne."], "a": 0, "e": "Jony te wchodzą w skład roztworów buforowych, które zachowują stałe stężenie jonów wodorowych po dodaniu niewielkiej ilości kwasu lub zasady.", "src": "v30"}, {"k": "luka", "q": "Makroelementy to pierwiastki, których zawartość w suchej masie komórek wynosi powyżej ___.", "o": ["0,01%", "0,1%", "1%", "0,001%"], "a": 0, "e": "Granica między makro- i mikroelementami to 0,01% suchej masy komórek.", "src": "v26"}, {"k": "luka", "q": "Największą gęstość woda ma w temperaturze ___.", "o": ["4°C", "0°C", "–4°C", "10°C"], "a": 0, "e": "Woda jest najgęstsza w 4°C, dlatego lód (0°C i niżej) unosi się na jej powierzchni.", "src": "v29"}, {"k": "luka", "q": "Wiązania O–H w cząsteczce wody tworzą kąt ___.", "o": ["104,5°", "109,5°", "120°", "180°"], "a": 0, "e": "Kąt 104,5° powoduje rozdział ładunków cząstkowych i polarny charakter cząsteczki.", "src": "v28"}, {"k": "luka", "q": "Wokół jonów i dipoli polarne cząsteczki wody tworzą otoczki ___.", "o": ["hydratacyjne", "hydrofobowe", "lipidowe", "buforowe"], "a": 0, "e": "Otoczki wodne nazywa się hydratacyjnymi; dzięki nim woda dobrze rozpuszcza związki polarne.", "src": "v29"}, {"k": "pf", "q": "Siły van der Waalsa występują niemal we wszystkich cząsteczkach, niezależnie od ich rozmiaru i kształtu.", "a": true, "e": "Tak podaje tabela oddziaływań międzycząsteczkowych; ich efekt zależy od odległości między atomami.", "src": "v27"}, {"k": "pf", "q": "W wiązaniu kowalencyjnym niespolaryzowanym para elektronowa jest przesunięta w stronę atomu o większej elektroujemności.", "a": false, "e": "To cecha wiązania spolaryzowanego; w niespolaryzowanym para elektronowa należy w jednakowym stopniu do obu atomów.", "src": "v28"}, {"k": "pf", "q": "Fluor jest makroelementem wchodzącym w skład szkliwa zębów.", "a": false, "e": "Fluor wchodzi w skład szkliwa, ale jest mikroelementem (poniżej 0,01% suchej masy).", "src": "v26"}, {"k": "pf", "q": "Węglany i fosforany wapnia budujące kości należą do nielicznych składników mineralnych nierozpuszczalnych w wodzie.", "a": true, "e": "Większość składników mineralnych występuje jako jony, ale węglany i fosforany wapnia w kościach są nierozpuszczalne.", "src": "v30"}, {"k": "pf", "q": "Kohezja polega na przyciąganiu cząsteczek wody przez powierzchnie naładowane elektrycznie, np. ściany komórkowe.", "a": false, "e": "To definicja adhezji; kohezja to wzajemne przyciąganie się cząsteczek wody.", "src": "v29"}, {"k": "para", "q": "Dopasuj cechę wody do jej znaczenia biologicznego.", "p": [["wysokie ciepło właściwe", "ochrona przed nagłymi zmianami temperatury otoczenia"], ["mała ściśliwość", "utrzymywanie turgoru komórek"], ["większa gęstość niż powietrze", "utrzymywanie się w wodzie dużych organizmów"], ["mniejsza gęstość lodu niż wody", "przetrwanie zimy przez organizmy wodne"]], "src": "v29"}, {"k": "para", "q": "Dopasuj pierwiastek do objawu jego niedoboru.", "p": [["jod", "powiększenie tarczycy"], ["sód", "utrata pobudliwości komórek nerwowych"], ["chlor", "zaburzenia trawienia"], ["fosfor", "zwiększenie łamliwości kości"]], "src": "v27"}, {"k": "para", "q": "Dopasuj rodzaj wiązania do przykładu jego występowania.", "p": [["kowalencyjne niespolaryzowane", "cząsteczka azotu N2"], ["kowalencyjne spolaryzowane", "cząsteczka wody H2O"], ["jonowe", "chlorek sodu NaCl"], ["wodorowe", "między różnymi cząsteczkami wody"]], "src": "v28"}], "t2": [{"k": "abcd", "q": "Która grupa funkcyjna występuje w cząsteczce glukozy, a nie występuje w cząsteczce fruktozy?", "o": ["aldehydowa", "ketonowa", "hydroksylowa", "karboksylowa"], "a": 0, "e": "Glukoza jest aldozą (grupa –CHO), a fruktoza – ketozą (grupa >C=O). Grupy hydroksylowe mają oba cukry.", "src": "v31"}, {"k": "abcd", "q": "Fruktozę należy zaliczyć do:", "o": ["ketoheksoz", "aldoheksoz", "ketopentoz", "aldopentoz"], "a": 0, "e": "Fruktoza jest ketozą (ma grupę ketonową) i heksozą (6 atomów węgla).", "src": "v32"}, {"k": "abcd", "q": "Który monosacharyd jest składnikiem ATP?", "o": ["ryboza", "deoksyryboza", "glukoza", "galaktoza"], "a": 0, "e": "Ryboza wchodzi w skład wolnych rybonukleotydów, np. ATP. Deoksyryboza buduje DNA.", "src": "v32"}, {"k": "abcd", "q": "Który zestaw zawiera wyłącznie triozy?", "o": ["aldehyd glicerynowy i dihydroksyaceton", "ryboza i deoksyryboza", "glukoza i galaktoza", "aldehyd glicerynowy i ryboza"], "a": 0, "e": "Triozy (C3) to aldehyd glicerynowy i dihydroksyaceton; ryboza i deoksyryboza to pentozy, a glukoza i galaktoza – heksozy.", "src": "v32"}, {"k": "abcd", "q": "Który cukier jest formą transportową cukrów u roślin?", "o": ["sacharoza", "glukoza", "maltoza", "laktoza"], "a": 0, "e": "Sacharoza jest formą transportową u roślin, a glukoza – u zwierząt.", "src": "v33"}, {"k": "abcd", "q": "Który cukier jest formą transportową cukrów u zwierząt?", "o": ["glukoza", "sacharoza", "fruktoza", "glikogen"], "a": 0, "e": "Glukoza jest formą transportową u zwierząt; sacharoza pełni tę funkcję u roślin, a glikogen jest materiałem zapasowym.", "src": "v32"}, {"k": "abcd", "q": "Z jakich monosacharydów jest zbudowana laktoza?", "o": ["z glukozy i galaktozy", "z glukozy i fruktozy", "z dwóch cząsteczek glukozy", "z galaktozy i fruktozy"], "a": 0, "e": "Laktoza to glukoza + galaktoza; sacharoza to glukoza + fruktoza, a maltoza – dwie glukozy.", "src": "v33"}, {"k": "abcd", "q": "W wyniku jakiego procesu powstaje maltoza?", "o": ["trawienia skrobi i glikogenu", "trawienia celulozy i chityny", "kondensacji glukozy i fruktozy", "kondensacji glukozy i galaktozy"], "a": 0, "e": "Maltoza (dwie glukozy) powstaje przy trawieniu skrobi i glikogenu. Kondensacja glukozy z fruktozą daje sacharozę, a z galaktozą – laktozę.", "src": "v33"}, {"k": "abcd", "q": "Który polisacharyd jest materiałem zapasowym u grzybów i zwierząt?", "o": ["glikogen", "skrobia", "chityna", "celuloza"], "a": 0, "e": "Glikogen to materiał zapasowy grzybów i zwierząt; skrobia pełni tę funkcję u roślin, a chityna u grzybów jest budulcowa.", "src": "v34"}, {"k": "abcd", "q": "Monomerem chityny jest:", "o": ["glukozamina", "glukoza", "galaktoza", "fruktoza"], "a": 0, "e": "Chityna jest zbudowana z glukozaminy – pochodnej glukozy, w której grupę hydroksylową zastąpiła grupa aminowa.", "src": "v34"}, {"k": "abcd", "q": "Która cecha odróżnia amylozę od amylopektyny?", "o": ["Amyloza ma łańcuch nierozgałęziony, a amylopektyna – rozgałęziony.", "Amyloza ma łańcuch rozgałęziony, a amylopektyna – nierozgałęziony.", "Amyloza jest zbudowana z glukozy, a amylopektyna – z glukozaminy.", "Amyloza występuje w nasionach zbóż, a amylopektyna – w bulwach ziemniaków."], "a": 0, "e": "Obie są zbudowane z glukozy i razem tworzą skrobię; różnią się rozgałęzieniem łańcucha.", "src": "v34"}, {"k": "abcd", "q": "Dlaczego polisacharydy mogą pełnić w organizmie funkcję zapasową?", "o": ["Są nierozpuszczalne w wodzie i nie wykazują aktywności osmotycznej.", "Są dobrze rozpuszczalne w wodzie i wykazują aktywność osmotyczną.", "Zawierają wiązania β-glikozydowe rozkładane przez nieliczne organizmy.", "Występują w roztworach w postaci łańcuchowej i pierścieniowej."], "a": 0, "e": "Nierozpuszczalność sprawia, że polisacharydy nie wywołują osmozy i mogą być magazynowane; rozpuszczalność i aktywność osmotyczna cechują monosacharydy.", "src": "v33"}, {"k": "abcd", "q": "Między którymi atomami węgla tworzy się wiązanie 1,4-glikozydowe?", "o": ["C1 jednej cząsteczki i C4 następnej", "C1 jednej cząsteczki i C1 następnej", "C4 jednej cząsteczki i C6 następnej", "C2 jednej cząsteczki i C4 następnej"], "a": 0, "e": "Liczby w nazwie wiązania oznaczają numery atomów węgla: pierwszego (C1) i czwartego (C4).", "src": "v33"}, {"k": "abcd", "q": "Która cecha odróżnia wiązania β-glikozydowe od α-glikozydowych?", "o": ["są rozkładane tylko przez nieliczne organizmy", "są łatwo rozkładane przez wszystkie organizmy", "łączą monosacharydy bez mostka tlenowego", "występują wyłącznie w cząsteczkach disacharydów"], "a": 0, "e": "Wiązania α-glikozydowe są łatwo rozkładane przez wszystkie organizmy, a β-glikozydowe – tylko przez nieliczne. Oba typy to wiązania O-glikozydowe z mostkiem tlenowym.", "src": "v33"}, {"k": "abcd", "q": "W doświadczeniu wykrywania skrobi w ziemniaku, fasoli i jabłku co stanowiło próbę kontrolną?", "o": ["kleik skrobiowy z dodatkiem jodyny", "przekrojone jabłko z dodatkiem jodyny", "przekrojony ziemniak bez dodatku jodyny", "nasienie fasoli z dodatkiem wody"], "a": 0, "e": "Kleik skrobiowy z jodyną pokazuje, jak wygląda wynik pozytywny (granatowe zabarwienie), z którym porównuje się próbę badawczą.", "src": "v34"}, {"k": "abcd", "q": "Który wniosek wynika z wyników doświadczenia z jodyną?", "o": ["Skrobia występuje w bulwach ziemniaka i nasionach fasoli, a nie w jabłkach.", "Skrobia występuje w bulwach ziemniaka, nasionach fasoli i w jabłkach.", "Skrobia występuje w jabłkach i nasionach fasoli, a nie w bulwach ziemniaka.", "Skrobia występuje tylko w bulwach ziemniaka, a nie w fasoli i jabłkach."], "a": 0, "e": "Granatowe plamy pojawiły się na ziemniaku i fasoli, a na jabłku – nie.", "src": "v34"}, {"k": "abcd", "q": "Utleniona forma którego monosacharydu jest składnikiem związków pektynowych ściany komórkowej roślin?", "o": ["galaktozy", "glukozy", "fruktozy", "rybozy"], "a": 0, "e": "Forma utleniona galaktozy wchodzi w skład związków pektynowych budujących ścianę komórkową roślin.", "src": "v32"}, {"k": "abcd", "q": "W którym z wymienionych związków występuje grupa aminowa?", "o": ["w chitynie", "w celulozie", "w acetonie", "w kwasie palmitynowym"], "a": 0, "e": "Chityna zawiera glukozaminę z grupą aminową. Aceton ma grupę ketonową, a kwas palmitynowy – karboksylową.", "src": "v30"}, {"k": "luka", "q": "Monosacharydy zawierają od ___ atomów węgla w cząsteczce.", "o": ["3 do 10", "2 do 8", "5 do 6", "3 do 7"], "a": 0, "e": "Najmniejsze monosacharydy to triozy (C3), a największe mają 10 atomów węgla.", "src": "v31"}, {"k": "luka", "q": "Heksozy to monosacharydy zawierające w cząsteczce ___ atomów węgla.", "o": ["6", "5", "4", "3"], "a": 0, "e": "Heksozy mają C6 (np. glukoza), pentozy C5, tetrozy C4, a triozy C3.", "src": "v31"}, {"k": "luka", "q": "Do polisacharydów budulcowych należą celuloza i ___.", "o": ["chityna", "glikogen", "skrobia", "amylopektyna"], "a": 0, "e": "Glikogen i skrobia (z amylopektyną) to polisacharydy zapasowe; budulcowe to celuloza i chityna.", "src": "v33"}, {"k": "luka", "q": "Disacharydy są produktami ___ dwóch cząsteczek cukrów prostych.", "o": ["kondensacji", "hydrolizy", "utleniania", "redukcji"], "a": 0, "e": "Disacharydy powstają przez kondensację dwóch monosacharydów, połączonych wiązaniem O-glikozydowym.", "src": "v31"}, {"k": "pf", "q": "Monosacharydy są osmotycznie czynne i mają odczyn obojętny.", "a": true, "e": "Monosacharydy dobrze rozpuszczają się w wodzie, są osmotycznie czynne i mają odczyn obojętny.", "src": "v31"}, {"k": "pf", "q": "Celuloza jest składnikiem ścian komórkowych grzybów oraz oskórka stawonogów.", "a": false, "e": "Tak występuje chityna; celuloza buduje ściany komórkowe roślin i niektórych protistów.", "src": "v34"}, {"k": "pf", "q": "Glikogen ma postać nierozgałęzionych łańcuchów zbudowanych z cząsteczek glukozy.", "a": false, "e": "Łańcuchy glikogenu są rozgałęzione; nierozgałęzione ma celuloza.", "src": "v34"}, {"k": "pf", "q": "Deoksyryboza jest składnikiem DNA, który jest nośnikiem informacji genetycznej u organizmów i wielu wirusów.", "a": true, "e": "Tak opisuje deoksyrybozę tabela monosacharydów.", "src": "v32"}, {"k": "pf", "q": "Sacharoza powstaje w wyniku trawienia skrobi i występuje głównie w nasionach zbóż.", "a": false, "e": "Tak powstaje i występuje maltoza; sacharoza jest zapasem w korzeniu buraka i łodydze trzciny cukrowej.", "src": "v33"}, {"k": "para", "q": "Dopasuj grupę funkcyjną do przykładowego związku, w którym występuje.", "p": [["hydroksylowa", "alkohol etylowy"], ["aldehydowa", "aldehyd octowy"], ["ketonowa", "aceton"], ["karboksylowa", "kwas palmitynowy"]], "src": "v30"}, {"k": "para", "q": "Dopasuj polisacharyd do jego znaczenia biologicznego.", "p": [["skrobia", "materiał zapasowy u roślin"], ["glikogen", "materiał zapasowy u grzybów i zwierząt"], ["celuloza", "składnik ścian komórkowych roślin"], ["chityna", "składnik oskórka stawonogów"]], "src": "v34"}, {"k": "para", "q": "Dopasuj monosacharyd do jego znaczenia biologicznego.", "p": [["ryboza", "składnik RNA i ATP"], ["deoksyryboza", "składnik DNA"], ["galaktoza", "element budulcowy laktozy"], ["fruktoza", "źródło energii łatwo przekształcane w glukozę"]], "src": "v32"}], "t3": [{"k": "abcd", "q": "Dlaczego lipidy rozpuszczają się w acetonie, a nie rozpuszczają się w wodzie?", "o": ["Ich cząsteczki są niepolarne", "Ich cząsteczki są silnie polarne", "Mają gęstość mniejszą od wody", "Zawierają wiązania glikozydowe"], "a": 0, "e": "Cząsteczki lipidów są niepolarne, więc rozpuszczają się w rozpuszczalnikach niepolarnych. Mniejsza gęstość tłumaczy unoszenie się na wodzie, a nie rozpuszczalność.", "src": "v35"}, {"k": "abcd", "q": "Która właściwość lipidów sprawia, że olej utrzymuje się na powierzchni wody?", "o": ["Gęstość mniejsza od gęstości wody", "Gęstość większa od gęstości wody", "Rozpuszczalność w benzenie", "Obecność wiązań estrowych"], "a": 0, "e": "Lipidy mają gęstość mniejszą od gęstości wody, dlatego utrzymują się na jej powierzchni.", "src": "v35"}, {"k": "abcd", "q": "W doświadczeniu wykrywania lipidów w nasionach słonecznika próbą kontrolną była:", "o": ["kropla oleju z odczynnikiem Sudan III", "roztarte nasiona słonecznika z Sudanem III", "kropla wody destylowanej z Sudanem III", "roztarte nasiona słonecznika z odczynnikiem biuretowym"], "a": 0, "e": "Próbę kontrolną stanowiła kropla oleju z Sudanem III – substancja, o której wiadomo, że zawiera lipidy. Nasiona z Sudanem III to próba badawcza.", "src": "v35"}, {"k": "abcd", "q": "Jaki wynik doświadczenia z odczynnikiem Sudan III potwierdził obecność lipidów w nasionach słonecznika?", "o": ["Obie próby zmieniły barwę na czerwoną", "Obie próby zmieniły barwę na fioletową", "Tylko próba kontrolna zmieniła barwę na czerwoną", "Tylko próba badawcza zmieniła barwę na fioletową"], "a": 0, "e": "Sudan III barwi tłuszcz na czerwono, a czerwone zabarwienie pojawiło się w obu próbach. Fioletowa barwa to wynik reakcji biuretowej na białka.", "src": "v35"}, {"k": "abcd", "q": "Jaki alkohol występuje w tłuszczach właściwych (triglicerydach)?", "o": ["Trihydroksylowy glicerol", "Alkohol monohydroksylowy", "Pięciowęglowy izopren", "Cukier galaktoza"], "a": 0, "e": "W triglicerydach glicerol – alkohol trihydroksylowy – tworzy wiązania estrowe z trzema kwasami tłuszczowymi. Alkohole monohydroksylowe występują w woskach.", "src": "v36"}, {"k": "abcd", "q": "Która cecha odróżnia woski od tłuszczów właściwych?", "o": ["Zawierają alkohol monohydroksylowy zamiast glicerolu", "Zawierają glicerol zamiast alkoholu monohydroksylowego", "Zawierają resztę kwasu fosforowego(V)", "Powstają w wyniku polimeryzacji izoprenu"], "a": 0, "e": "Woski to estry alkoholi monohydroksylowych i kwasów tłuszczowych, a tłuszcze właściwe – estry glicerolu i kwasów tłuszczowych.", "src": "v36"}, {"k": "abcd", "q": "Dlaczego tłuszcze wytwarzane przez zwierzęta są zwykle stałe?", "o": ["Przeważają w nich nasycone kwasy tłuszczowe", "Przeważają w nich nienasycone kwasy tłuszczowe", "Zawierają alkohole monohydroksylowe", "Zawierają hydrofilowe grupy fosforanowe"], "a": 0, "e": "W tłuszczach stałych (zwykle zwierzęcych) przeważają nasycone kwasy tłuszczowe, a w ciekłych (roślinnych) – nienasycone.", "src": "v36"}, {"k": "abcd", "q": "Które funkcje pełnią głównie tłuszcze właściwe?", "o": ["Zapasowe, termoizolacyjne i ochronne", "Ochronne, izolacyjne i budulcowe", "Budulcowe błon i rozpoznawanie komórek", "Hormonalne i antyoksydacyjne"], "a": 0, "e": "Tłuszcze właściwe pełnią funkcje zapasowe, termoizolacyjne i ochronne. Funkcje ochronne, izolacyjne i budulcowe to zestaw przypisany woskom.", "src": "v36"}, {"k": "abcd", "q": "Która cecha budowy fosfolipidów umożliwia ich spontaniczną agregację w podwójną warstwę w środowisku wodnym?", "o": ["Hydrofilowa głowa i hydrofobowy ogon", "Hydrofobowa głowa i hydrofilowy ogon", "Złożona struktura pierścieniowa", "Trzy reszty kwasów tłuszczowych"], "a": 0, "e": "Cząsteczki lipidów złożonych mają hydrofilową głowę i hydrofobowy ogon, co umożliwia ich agregację w dwuwarstwę lipidową.", "src": "v36"}, {"k": "abcd", "q": "Czym różni się budowa glikolipidu od budowy fosfolipidu?", "o": ["Trzecia grupa –OH glicerolu wiąże się z cukrem, a nie z kwasem fosforowym(V)", "Glicerol jest zestryfikowany trzema, a nie dwoma kwasami tłuszczowymi", "Zamiast glicerolu występuje w nim alkohol monohydroksylowy", "Reszta fosforanowa łączy się w nim z choliną, a nie z cukrem"], "a": 0, "e": "W glikolipidzie trzecia grupa hydroksylowa glicerolu jest połączona wiązaniem glikozydowym z cukrem (np. galaktozą), a w fosfolipidzie – zestryfikowana kwasem fosforowym(V).", "src": "v37"}, {"k": "abcd", "q": "Która struktura, w której skład wchodzą glikolipidy, bierze udział w rozpoznawaniu się komórek?", "o": ["Glikokaliks", "Kutykula", "Osłonka włókna nerwowego", "Chromatyna"], "a": 0, "e": "Glikolipidy wchodzą w skład glikokaliksu, który zwiększa wytrzymałość komórek i bierze udział w ich rozpoznawaniu się.", "src": "v37"}, {"k": "abcd", "q": "Z polimeryzacji jakiego związku powstają lipidy izoprenowe?", "o": ["Pięciowęglowego nienasyconego węglowodoru", "Sześciowęglowego nasyconego węglowodoru", "Trihydroksylowego alkoholu glicerolu", "Pięciowęglowego cukru rybozy"], "a": 0, "e": "Lipidy izoprenowe są produktami polimeryzacji izoprenu – pięciowęglowego nienasyconego węglowodoru.", "src": "v37"}, {"k": "abcd", "q": "Który związek jest substancją wyjściową do syntezy kwasów żółciowych i witaminy D?", "o": ["Cholesterol", "Testosteron", "Lanolina"
