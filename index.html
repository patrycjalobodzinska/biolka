TEMATY.push({"id": "t8", "dzial": "d2", "name": "Budowa komórek", "note": [["Poziomy organizacji", "Organizmy jednokomórkowe – jedna komórka wykonuje wszystkie czynności życiowe (bakterie, protisty, część grzybów i roślin). Formy kolonijne – zespoły komórek połączonych ścianami lub galaretowatą otoczką (bakterie, protisty). Wielokomórkowe plechowe – ciało słabo zróżnicowane, bez tkanek (część protistów, grzybów, rośliny pierwotnie wodne). Wielokomórkowe tkankowe – wyraźne tkanki (większość roślin i zwierzęta).", "v48"], ["Dlaczego komórki są małe", "Gdy komórka rośnie, objętość zwiększa się szybciej niż powierzchnia. Sześcian o krawędzi 1 cm ma stosunek powierzchni do objętości 6 : 1, a o krawędzi 2 cm – tylko 3 : 1. Mała komórka ma względnie dużą powierzchnię, więc sprawniej wymienia substancje z otoczeniem.", "v48"], ["Prokarionty a eukarionty – cechy wspólne", "Obie komórki otacza błona komórkowa, często też ściana. Wnętrze wypełnia cytozol. Materiałem genetycznym jest DNA. Obie mają rybosomy.", "v49"], ["Prokarionty a eukarionty – różnice", "Prokarionty: ściana z peptydoglikanu (mureiny); DNA zwykle koliste, leży w cytozolu bez otoczki; brak systemu błon wewnętrznych. Eukarionty: ściana z polisacharydów (celuloza u roślin, chityna u grzybów); DNA liniowe, w jądrze z otoczką; liczne błony dzielą komórkę na przedziały (kompartmenty).", "v49"], ["Chromosom bakteryjny i eukariotyczny", "Chromosom bakteryjny to kolista cząsteczka DNA tworząca kilkadziesiąt pętli. Pętle stabilizują zasadowe białka niehistonowe. Chromosomy eukariotyczne są liniowe, a DNA jest nawinięte na białka histonowe, tworząc nukleosomy.", "v49"], ["Komórka bakterii", "Bakteria heterotroficzna: ściana, często otoczka śluzowa, błona, cytozol, chromosom bakteryjny, plazmidy, rybosomy, rzęska, substancje zapasowe. Sinica (bakteria autotroficzna) ma dodatkowo tylakoidy – wewnętrzne błony z barwnikami fotosyntetycznymi.", "v50"], ["Komórka zwierzęca", "Ma jądro, mitochondria, siateczkę szorstką i gładką, aparat Golgiego, lizosomy, peroksysomy, rybosomy i cytoszkielet z mikrotubulami. Nie ma ściany komórkowej ani plastydów. Może mieć drobne wodniczki.", "v50"], ["Komórka roślinna", "Ma ścianę celulozową, plazmodesmy, plastydy (chloroplasty, leukoplasty) i dużą wakuolę. Poza tym te same organelle co komórka zwierzęca: jądro, mitochondria, ER, aparat Golgiego, peroksysomy, rybosomy.", "v51"], ["Komórka grzybowa", "Ściana zbudowana głównie z chityny. Materiałem zapasowym jest glikogen. Ma wakuole, mitochondria, ER, aparat Golgiego, peroksysomy. Nie ma plastydów.", "v51"]]});
TEMATY.push({"id": "t9", "dzial": "d2", "name": "Błony i transport", "note": [["Kompartmentacja", "Błony dzielą komórkę eukariotyczną na przedziały, w których panują różne warunki. Przykłady pH: cytozol i jądro ok. 7,2, mitochondrium ok. 8, lizosom ok. 4,7, aparat Golgiego 6–6,7. Dzięki temu w jednej komórce mogą jednocześnie zachodzić procesy wymagające innych warunków.", "v52"], ["Model płynnej mozaiki", "Błona to dwuwarstwa fosfolipidów, w której pływają białka. W błonie zwierzęcej jest też cholesterol. Na zewnętrznej stronie są glikolipidy i glikoproteiny, których łańcuchy cukrowe tworzą glikokaliks.", "v52"], ["Białka błonowe – położenie", "Białka integralne wnikają w dwuwarstwę. Transbłonowe przebijają ją na wylot (hydrofobowa α-helisa lub β-harmonijka), nieprzebijające wnikają tylko w jedną warstwę. Białka powierzchniowe są hydrofilowe i nie wnikają do dwuwarstwy.", "v53"], ["Białka błonowe – funkcje", "Transportujące – przenoszą substancje (np. pompa sodowo-potasowa). Kotwiczące – zwiększają wytrzymałość błony (np. spektryna). Receptorowe – odbierają sygnały, np. hormony. Enzymatyczne – przyspieszają reakcje (np. cyklaza adenylanowa).", "v53"], ["Płynność błony", "Fosfolipidy przemieszczają się w obrębie warstwy, obracają się, rzadziej przechodzą do drugiej warstwy (ruch flip-flop). Razem z nimi przemieszczają się białka.", "v54"], ["Transport bierny", "Zgodny z gradientem stężeń, bez nakładu energii. Dyfuzja prosta – bezpośrednio przez lipidy: małe cząsteczki niepolarne (O₂, CO₂) i woda w osmozie. Dyfuzja ułatwiona – przez białka kanałowe lub nośnikowe: jony, małe polarne cząsteczki, np. glukoza, aminokwasy.", "v54"], ["Transport czynny", "Wbrew gradientowi stężeń, wymaga energii (ATP). Zachodzi przez białka nośnikowe lub pompy, np. pompa sodowo-potasowa, pompa protonowa.", "v54"], ["Transport sprzężony", "Przeniesienie jednej substancji zależy od przeniesienia drugiej. Symport – obie w tym samym kierunku. Antyport – w przeciwnych kierunkach.", "v55"], ["Osmoza", "Osmoza to przenikanie wody przez błonę półprzepuszczalną z roztworu hipotonicznego (niższe stężenie) do hipertonicznego (wyższe stężenie). Przy roztworach izotonicznych woda przepływa w obie strony w równej ilości.", "v55"], ["Osmoza w komórkach", "Roztwór izotoniczny – komórka zachowuje kształt. Hipertoniczny – komórka traci wodę: erytrocyt się kurczy, w komórce roślinnej protoplast odstaje od ściany (plazmoliza). Hipotoniczny – komórka pobiera wodę: erytrocyt pęka, komórka roślinna osiąga pełny turgor, bo ściana nie pozwala jej pęknąć.", "v56"], ["Doświadczenie: substancje osmotycznie czynne", "Lejek z błoną półprzepuszczalną wstawia się do wody. Z roztworem glukozy poziom w rurce rośnie, z zawiesiną skrobi i z samą wodą (kontrola) się nie zmienia. Wniosek: glukoza jest osmotycznie czynna, skrobia – bierna.", "v57"], ["Transport pęcherzykowy", "Endocytoza – pobieranie substancji do komórki w pęcherzykach z błony. Fagocytoza – pochłanianie dużych cząstek, np. bakterii. Pinocytoza – pobieranie kropli płynu. Egzocytoza – pęcherzyk łączy się z błoną i wylewa zawartość na zewnątrz; tak komórka wydziela np. hormony, enzymy trawienne, a także dostarcza lipidy i białka do błony.", "v58"]]});
TEMATY.push({"id": "t10", "dzial": "d2", "name": "Jądro, cytozol i cytoszkielet", "note": [["Budowa jądra", "Otoczka jądrowa – dwie błony oddzielające jądro od cytozolu. Pory jądrowe – kompleksy białkowe w otoczce, przez które substancje przechodzą między jądrem a cytozolem. Kariolimfa – płyn z białkami enzymatycznymi i RNA. Jąderko – fragment chromatyny z genami rRNA; powstają w nim podjednostki rybosomów. Chromatyna – DNA nawinięty na histony.", "v59"], ["Euchromatyna i heterochromatyna", "Euchromatyna jest luźno upakowana i zawiera aktywne geny, które można odczytywać. Heterochromatyna jest ściśle upakowana i zawiera geny nieaktywne oraz dużo DNA pozagenowego.", "v59"], ["Upakowanie DNA", "Kolejne poziomy: podwójna helisa DNA → nukleosomy (DNA nawinięty na rdzeń z 8 histonów, połączone DNA łącznikowym) → włókno 30 nm (w interfazie) → pętle → spirala 300 nm → chromosom metafazowy. Łączna długość DNA w jednej komórce człowieka to ok. 2 m.", "v60"], ["Chromosom metafazowy", "Najbardziej skondensowana postać DNA. Składa się z dwóch identycznych chromatyd siostrzanych połączonych w centromerze, który dzieli chromosom na ramiona. Do centromeru przyczepiają się włókna wrzeciona podziałowego.", "v60"], ["Cytozol", "Roztwór koloidalny: woda z rozpuszczonymi związkami, głównie białkami. Zawiera też białka włókienkowe cytoszkieletu. Jest środowiskiem wielu reakcji i pośredniczy w transporcie między organellami.", "v61"], ["Obserwacja ruchu cytozolu", "Preparat z liści moczarki kanadyjskiej ogrzanej w wodzie ok. 37°C i oświetlonej żarówką. Pod mikroskopem widać, jak chloroplasty przemieszczają się razem z cytozolem.", "v61"], ["Elementy cytoszkieletu", "Filamenty aktynowe (mikrofilamenty) – z aktyny, ok. 7 nm, najwięcej pod błoną. Filamenty pośrednie – z różnych białek, np. keratyny, ok. 10 nm, sztywne, sieć od jądra do błony. Mikrotubule – z tubuliny, puste rurki ok. 25 nm, dynamiczne: wydłużają się i skracają.", "v61"], ["Funkcje cytoszkieletu", "Mikrofilamenty: zmiana kształtu komórki, ruch pełzakowaty, skurcz mięśni, ruch organelli i cytozolu, fagocytoza. Filamenty pośrednie: wytrzymałość mechaniczna (dużo ich w nabłonku), wzmacniają otoczkę jądrową. Mikrotubule: utrzymują położenie organelli, szlaki transportu, wrzeciono podziałowe, szkielet rzęsek i wici.", "v62"], ["Centriole", "Zbudowane z mikrotubul ułożonych w cylinder, głównie w komórkach zwierzęcych. Dwie centriole ułożone prostopadle tworzą centrosom – ośrodek formowania wrzeciona podziałowego.", "v62"], ["Wici i rzęski", "Wypustki cytoplazmy okryte błoną, wyrastające z ciałka podstawowego. Szkielet tworzą mikrotubule w układzie 9 par na obwodzie + 1 para w środku. Różnią się tylko liczbą i długością: rzęski są krótkie i liczne (pantofelek), wici długie, pojedyncze lub po kilka (euglena).", "v62"]]});
TEMATY.push({"id": "t11", "dzial": "d2", "name": "Organelle", "note": [["Organelle półautonomiczne", "Mitochondria i plastydy mają własne DNA i rybosomy, więc same wytwarzają część swoich białek. Są częściowo niezależne od jądra.", "v63"], ["Teoria endosymbiozy", "Cudzożywna komórka pochłonęła bakterie tlenowe, które nie zostały strawione i stały się mitochondriami. Później u przodków roślin pochłonięte bakterie fotosyntetyzujące stały się chloroplastami. Otoczka jądrowa i ER powstały z wpukleń błony komórkowej.", "v63"], ["Dowody endosymbiozy", "Mitochondria i plastydy mają koliste DNA bez histonów, rybosomy podobne do prokariotycznych (70S), dwie błony podobne do błon bakterii i powstają tylko przez podział już istniejących.", "v63"], ["Mitochondria", "Występują w komórkach oddychających tlenowo (nie ma ich np. w erytrocytach ssaków). Dwie błony: zewnętrzna gładka i przepuszczalna, wewnętrzna pofałdowana w grzebienie z białkami transportującymi. Matriks zawiera enzymy, rybosomy i DNA. Funkcja: oddychanie tlenowe i wytwarzanie ATP. Im większe zapotrzebowanie na energię, tym więcej mitochondriów (mięśnie, neurony).", "v64"], ["Rodzaje plastydów", "Wszystkie powstają z proplastydów lub przez podział dojrzałych plastydów. Barwne: chloroplasty, etioplasty, chromoplasty. Bezbarwne (leukoplasty): amyloplasty i elajoplasty. Plastydy mogą się przekształcać w siebie, np. pod wpływem światła.", "v64"], ["Chloroplast", "Dwie błony: zewnętrzna przepuszczalna, wewnętrzna wybiórczo przepuszczalna. Wewnątrz tylakoidy gran (stosy woreczków) i tylakoidy stromy (kanaliki łączące grana). W błonach tylakoidów są barwniki, przenośniki elektronów i enzymy. Stroma zawiera enzymy, rybosomy, DNA i ziarna skrobi.", "v65"], ["Siateczka śródplazmatyczna (ER)", "Szorstka (RER) ma rybosomy: syntetyzuje białka, które w cysternach uzyskują strukturę III-rzędową i w pęcherzykach trafiają do aparatu Golgiego. Gładka (SER) nie ma rybosomów: synteza lipidów (fosfolipidy, glikolipidy, cholesterol), neutralizacja toksyn (wątroba), magazyn jonów wapnia (mięśnie).", "v66"], ["Rybosomy", "Nieobłonione, zbudowane z rRNA i białek, z dwóch podjednostek. Syntetyzują białka. Na rybosomach związanych z ER powstają białka wydzielane, błonowe i enzymy lizosomów; reszta na rybosomach wolnych. Eukariotyczne 80S (40S + 60S), prokariotyczne 70S (30S + 50S). Rybosomy chloroplastów to 70S, mitochondriów roślin 78S, ssaków 55S.", "v66"], ["Lizosomy", "Pęcherzyki z jedną błoną w komórkach zwierzęcych, zawierające enzymy hydrolityczne aktywne w pH ok. 5. Kwaśne środowisko utrzymują pompy protonowe w błonie. Błonę od środka chroni warstwa odpornych cukrów. Funkcja: trawienie wewnątrzkomórkowe zużytych organelli i materiału z endocytozy.", "v67"], ["Aparat Golgiego", "Stos płaskich cystern, od których odrywają się pęcherzyki. Powstaje z pęcherzyków RER. Najwięcej go w komórkach wydzielniczych (tarczyca, ślinianki). Funkcja: modyfikowanie, sortowanie i transport białek.", "v67"], ["Droga białka wydzielanego", "1) Pęcherzyki z białkami odrywają się od RER i płyną do aparatu Golgiego. 2) Tam białka są modyfikowane, np. fosforylowane lub łączone z cukrem. 3) Gotowe białka trafiają do pęcherzyków. 4) Pęcherzyki zlewają się z błoną i wydzielają zawartość (egzocytoza). 5) Enzymy lizosomowe też przechodzą przez RER i Golgiego, a pęcherzyki z nimi stają się lizosomami.", "v68"], ["Peroksysomy", "Drobne pęcherzyki z jedną błoną we wszystkich komórkach eukariotycznych, dużo ich w wątrobie. Rozkładają kwasy tłuszczowe do jednostek dwuwęglowych, wytwarzają mielinę, neutralizują leki i alkohol. Powstaje w nich szkodliwy H₂O₂, który rozkłada katalaza do wody i tlenu.", "v68"], ["Wakuola roślinna", "Pęcherzyk otoczony jedną błoną – tonoplastem, wypełniony sokiem komórkowym. Utrzymuje turgor, magazynuje jony, cukry i białka zapasowe, odkłada uboczne produkty (kryształy szczawianu wapnia), gromadzi glikozydy (barwa kwiatów) oraz alkaloidy i garbniki (obrona).", "v69"], ["Wodniczki protistów", "Pokarmowe – powstają w endocytozie (fago- lub pinocytozie). Tętniące – u protistów słodkowodnych w środowisku hipotonicznym; usuwają nadmiar wody.", "v69"]]});
TEMATY.push({"id": "t12", "dzial": "d2", "name": "Ściana i połączenia komórek", "note": [["Ściana komórkowa – skład", "Występuje u bakterii (mureina), grzybów (chityna), roślin (głównie celuloza) i części protistów. U roślin łańcuchy celulozy łączą się wiązaniami wodorowymi w mikrofibryle. Przestrzenie między nimi wypełnia macierz: hemicelulozy, pektyny, białka i woda.", "v69"], ["Funkcje ściany", "Nadaje kształt, chroni przed uszkodzeniem i przed pęknięciem w roztworze hipotonicznym, zabezpiecza przed patogenami, uczestniczy w transporcie wody.", "v69"], ["Budowa ściany", "Cząsteczki celulozy → fibryle elementarne → mikrofibryle (podstawowa jednostka ściany) → makrofibryle → przestrzenna sieć wypełniona pektynami, hemicelulozami i wodą.", "v69"], ["Ściana pierwotna i wtórna", "Pierwotna okrywa młode, rosnące komórki: mało celulozy, dużo wody, hemiceluloz, pektyn i białek, cienkie nieregularne włókna. Wtórna okrywa komórki wyrośnięte i wyspecjalizowane: dużo celulozy, grube regularne włókna, często warstwy.", "v70"], ["Inkrustacja", "Wysycanie – substancje wnikają między włókna celulozy. Lignina (drewnik) usztywnia ściany i umożliwia pionowy transport wody, np. w drewnie. Krzemionka wzmacnia ściany skrzypów i niektórych traw, chroni przed patogenami i roślinożercami.", "v70"], ["Adkrustacja", "Powlekanie – substancje odkładają się na powierzchni ściany. Kutyna w kutykuli skórki chroni przed parowaniem. Suberyna w korkowicy usztywnia i nie przepuszcza wody. Śluzy (nasiona lnu, pigwy) chłoną wodę. Gumy wydzielają drzewa w miejscach zranień.", "v70"], ["Połączenia u roślin", "Blaszka środkowa z pektyn spaja ściany pierwotne sąsiednich komórek; gdy się rozpuści, komórki się rozsuwają. Plazmodesmy to kanały cytoplazmy otoczone błoną, przechodzące przez ściany; łączą ER sąsiednich komórek i przewodzą np. aminokwasy i kwasy nukleinowe. Mogą się otwierać i zamykać.", "v71"], ["Połączenia u zwierząt", "Zamykające – uszczelniają nabłonek, tylko w tkance nabłonkowej, w szczytowej części komórek. Desmosomy – mechanicznie spajają komórki, połączone z filamentami pośrednimi; półdesmosomy łączą komórki z błoną podstawną. Szczelinowe (neksus) – kanały z koneksonów, przez które przechodzą jony i małe cząsteczki; w nabłonku, tkance nerwowej i mięśniu sercowym.", "v71"]]});
TEMATY.push({"id": "t13", "dzial": "d2", "name": "Cykl komórkowy i podziały", "note": [["Cykl komórkowy", "Interfaza (G₁, S, G₂) i faza M (mitoza + cytokineza). G₁ – wzrost komórki. S – replikacja DNA i synteza histonów. G₂ – synteza białek do podziału, podział mitochondriów i plastydów. G₀ – spoczynek komórek, które się różnicują.", "v72"], ["Regulacja cyklu", "Białka regulatorowe zatrzymują cykl w punktach kontrolnych: w G₁ przy uszkodzonym DNA lub złych warunkach, w S i G₂ przy nieukończonej replikacji lub uszkodzeniu DNA, w M gdy chromosomy są źle przyczepione do wrzeciona. Zapobiega to powstawaniu komórek nieprawidłowych, np. nowotworowych.", "v72"], ["Mitoza – etapy", "Profaza: kondensacja chromatyny w chromosomy z dwóch chromatyd, zanik otoczki i jąderka, powstaje wrzeciono. Metafaza: maksymalna kondensacja, chromosomy w płytce metafazowej na równiku. Anafaza: chromatydy rozdzielają się i wędrują do biegunów. Telofaza: chromosomy się rozluźniają, odtwarzają się otoczka i jąderko, zaczyna się cytokineza.", "v73"], ["Wrzeciono podziałowe", "Struktura z mikrotubul, która przemieszcza chromosomy w czasie podziału. U zwierząt zanika w telofazie, u roślin uczestniczy jeszcze w cytokinezie.", "v73"], ["Cytokineza", "Podział cytoplazmy. U zwierząt zaczyna się w anafazie: mikrofilamenty tworzą pierścień kurczliwy i bruzdę podziałową. U roślin na początku telofazy: wrzeciono cytokinetyczne, pęcherzyki Golgiego układają się na równiku i budują przegrodę.", "v74"], ["Crossing-over", "Wymiana odcinków chromatyd między chromosomami homologicznymi w profazie I. Powstają chromatydy z nowym układem alleli, więc potomstwo różni się od rodziców.", "v74"], ["Mejoza I (redukcyjna)", "Profaza I: kondensacja, koniugacja homologów w biwalenty (tetrady chromatyd), crossing-over, zanik otoczki i jąderka, wrzeciono. Metafaza I: pary homologów na równiku. Anafaza I: homologi rozchodzą się do biegunów. Telofaza I: częściowe rozluźnienie, odtworzenie otoczki, cytokineza.", "v75"], ["Mejoza II", "Przebiega jak mitoza: profaza II, metafaza II (płytka metafazowa), anafaza II (rozdział chromatyd), telofaza II (rozluźnienie, otoczki, cytokineza). Wynik: 4 komórki haploidalne.", "v76"], ["Mitoza a mejoza", "Mitoza: komórki somatyczne (2n i n), jeden podział, 2 komórki identyczne z macierzystą, bez rekombinacji; wzrost, regeneracja, wymiana komórek, rozmnażanie bezpłciowe. Mejoza: komórki macierzyste gamet u zwierząt i mejospor; dwa podziały, 4 komórki z połową chromosomów, crossing-over; rozmnażanie płciowe, zmienność, stała liczba chromosomów gatunku.", "v76"], ["Ilość DNA w cyklu", "Komórka 2n po G₁ ma 2c. Po fazie S: 2n 4c. Po mitozie: dwie komórki 2n 2c. W mejozie: 2n 4c → po mejozie I 1n 2c → po mejozie II 1n 1c.", "v77"], ["Apoptoza", "Zaprogramowana, kontrolowana genetycznie śmierć komórki. Etapy: sygnał, kurczenie i utrata wody, fragmentacja DNA, rozpad cytoszkieletu, zanik otoczki, uwypuklanie błony, rozpad na ciałka apoptotyczne, pochłanianie przez makrofagi. Usuwa komórki uszkodzone i zbędne, np. ogon kijanki.", "v77"]]});

function buildPlan(min,o){o=o||{};const c=CFG[min]||CFG[25],today=dayNum();let intro=null;
 let tops=o.tid?[o.tid]:readyT().filter(t=>S.read[t.id]).map(t=>t.id);
 const fresh=ts=>ts.flatMap(cardsOf).filter(x=>!S.cards[x.id]);
 if(!o.tid&&fresh(tops).length<c.nw){const nt=nextTopic();if(nt){tops=tops.concat(nt.id);intro=nt.id}}
 const all=tops.flatMap(cardsOf);
 const due=all.filter(x=>{const r=S.cards[x.id];return r&&r.due<=today}).sort((a,b)=>S.cards[a.id].due-S.cards[b.id].due).slice(0,o.tid?c.due+c.nw:c.due);
 const nw=all.filter(x=>!S.cards[x.id]).slice(0,c.nw);
 const qa=tops.flatMap(quizOf);
 const qd=qa.filter(x=>{const r=S.quiz[x.id];return r&&r.due<=today}),qn=qa.filter(x=>!S.quiz[x.id]);
 let qz=shuffle(qd).concat(shuffle(qn)).slice(0,c.qz);
 const zd=ZADANIA.filter(z=>tops.includes(z.topic)&&z.type==="closed"&&(!S.tasks[z.id]||(S.errors[z.id]&&S.errors[z.id].due<=today))).slice(0,c.zd);
 return {intro,due,nw,qz,zd,tops}}
function qItem(x){const it={k:"quiz",x};
 if(x.k==="abcd"||x.k==="luka")it.opts=shuffle(x.o.map((t,i)=>({t,ok:i===x.a})));
 if(x.k==="pf")it.opts=[{t:"Prawda",ok:x.a===true},{t:"Fałsz",ok:x.a===false}];
 if(x.k==="para"){it.R=shuffle(x.p.map((_,i)=>i));it.m={};it.sel=null;it.miss=0}
 return it}
function makeItems(p){const cards=shuffle(p.due).map(c=>({k:"card",c})).concat(p.nw.map(c=>({k:"card",c,nw:1})));
 const qz=p.qz.slice().sort((a,b)=>(a.t===p.intro)-(b.t===p.intro)).map(qItem);
 const out=[];if(p.intro)out.push({k:"intro",t:p.intro,n:p.nw.filter(c=>c.t===p.intro).length});
 let qi=0;cards.forEach((c,i)=>{out.push(c);if((i+1)%3===0&&qi<qz.length)out.push(qz[qi++])});
 while(qi<qz.length)out.push(qz[qi++]);
 p.zd.forEach(z=>out.push({k:"task",z}));return out}

   const num=i=>{const k=(it.ord||[]).indexOf(i);return k<0?"":`<span class="l">${k+1}</span>`};
   if(it.fin)h+=`<div class="opts">${x.p.map(p=>`<div class="opt right"><span><b>${esc(p[0])}</b> – ${esc(p[1])}</span></div>`).join("")}</div>`;
   else h+=`<p class="small muted">Stuknij element po lewej, potem pasujący po prawej.</p><div class="pair"><div class="opts">${x.p.map((p,i)=>`<button class="opt ${it.m[i]!=null?"right":it.sel===i?"sel":""}" ${it.m[i]!=null?"disabled":""} data-on="pick('L',${i})">${num(i)}<span>${esc(p[0])}</span></button>`).join("")}</div><div class="opts">${it.R.map(j=>`<button class="opt ${used.includes(j)?"right":it.err===j?"wrong":""}" ${used.includes(j)?"disabled":""} data-on="pick('R',${j})">${num(j)}<span>${esc(x.p[j][1])}</span></button>`).join("")}</div></div>`}
  if(done){const e=x.fc?"Poprawnie: "+x.e:x.k==="para"?(it.ok?"Wszystkie pary za pierwszym razem.":`Pomyłki: ${it.miss}. Pytanie wróci w Błędach.`):x.e;
   h+=`<div class="fb ${it.ok?"ok":"bad"} pop"><b>${it.ok?["Dobrze!","Świetnie!","Tak jest!"][sess.n%3]:"Prawie – zapamiętaj:"}</b><p>${esc(e)}</p>${x.src?srcH(x.src):""}</div><button class="btn block big" data-on="nxt()">Dalej ▸</button>`}
  return h+`</div>`}
 if(it.k==="task"){const z=it.z;
  h+=`<div class="qcard flipin" style="min-height:0"><div class="row">${chipT(z.topic)}<span class="chip gold">Zadanie maturalne · ${z.max} pkt</span></div><p class="small muted">${esc(z.src)}${z.book?" · "+esc(z.book):""}</p>${z.cke?`<div class="ck">${ckQ(z)}${phView(z.id)}</div><a class="small" href="#zad/${z.id}">Otwórz zadanie</a>`:`<div class="q" style="font-size:1.12rem;white-space:pre-line">${esc(askOf(z))}</div>`}${z.a?`<a class="small" target="_blank" rel="noopener" href="${SRC[z.a]}">Otwórz arkusz z pełną treścią</a>`:""}</div><div class="stack" style="margin-top:14px">`;
  if(!it.show)h+=`<p class="small muted">Zapisz odpowiedź na kartce, potem sprawdź.</p><button class="btn block big" data-on="taskShow()">Sprawdź z kluczem</button>`;
  else h+=`<section class="panel official"><p class="small muted">${z.a||z.cke?"Klucz CKE":esc(z.kl)}${z.crit?" – kryteria":""}</p>${z.cke?`<div class="ck">${ckKey(z)}</div>`:""}${z.crit?`<ul style="margin:6px 0;padding-left:20px">${z.crit.map(c=>`<li style="margin:4px 0">${esc(c)}</li>`).join("")}</ul>${z.note?`<p class="small muted">${esc(z.note)}</p>`:""}`:z.cke?"":`<p style="font-weight:800;font-size:1.1rem;margin:6px 0">${esc(z.answer)}</p>`}<p class="small" style="font-family:var(--serif)">${esc(z.expl)}</p></section><p class="small muted">Ile punktów zdobyłaś?</p><div class="row">${Array.from({length:z.max+1},(_,i)=>z.max-i).map(n=>`<button class="btn ${n===z.max?"ok":n===0?"bad":"ghost"}" style="flex:1" data-on="taskScore(${n})">${n} pkt</button>`).join("")}</div>`;
  return h+`</div>`}
 return h}
window.closeS=()=>{sess=null;location.hash="dzis"};

/* ---------- quizy z tematów i działów ---------- */
function quizPool(tids,kinds){let out=[];for(const t of tids){
 if(kinds.q)out=out.concat(quizOf(t).map(qItem));
 if(kinds.z)out=out.concat(topicTasks(t).map(z=>({k:"task",z})))}return out}
let QZ={n:20,q:1,z:1};
try{const s=JSON.parse(localStorage.getItem("bio61qz")||"null");if(s)QZ=Object.assign(QZ,s);delete QZ.f}catch(e){}
window.qzSet=(k,v)=>{QZ[k]=k==="n"?v:(QZ[k]?0:1);if(!QZ.q&&!QZ.z)QZ[k]=1;try{localStorage.setItem("bio61qz",JSON.stringify(QZ))}catch(e){}render()};
function quizPanel(tids,scope){
 const nq=tids.reduce((s,t)=>s+(QUIZ[t]||[]).length,0),nz=tids.reduce((s,t)=>s+topicTasks(t).length,0);
 const ncke=tids.reduce((s,t)=>s+topicTasks(t).filter(z=>z.a).length,0);
 const tot=(QZ.q?nq:0)+(QZ.z?nz:0);
 const tg=(k,l,n)=>`<button class="opt ${QZ[k]?"sel":""}" aria-pressed="${!!QZ[k]}" data-on="qzSet('${k}',0)"><span class="l">${QZ[k]?"✓":""}</span><span style="flex:1">${l}</span><b>${n}</b></button>`;
 return `<section class="panel"><h3>Co ma być w quizie?</h3><div class="opts" style="margin-top:10px">
  ${tg("q","Pytania quizowe (ABCD, P/F, luka, pary)",nq)}${tg("z",`Zadania maturalne (${ncke} CKE + z vademecum)`,nz)}</div>
  <p class="small muted" style="margin-top:14px">Liczba pytań</p><div class="seg" style="margin-top:6px">${[10,20,0].map(n=>`<button aria-pressed="${QZ.n===n}" data-on="qzSet('n',${n})">${n||"Wszystkie ("+tot+")"}</button>`).join("")}</div>
  <button class="btn block big" style="margin-top:16px" data-on="startQuiz('${scope}')">Start quizu ▸</button>
  <p class="small muted" style="margin-top:10px">Zadania CKE: polecenie w skrócie + link do oryginalnego arkusza i zasad oceniania. Punkty przyznajesz sobie wg klucza.</p></section>`}
window.startQuiz=scope=>{const [k,id]=scope.split(":");const tids=k==="t"?[id]:TEMATY.filter(t=>t.dzial===id).map(t=>t.id);
 tids.forEach(t=>{S.read[t]=true});save();
 let pool=quizPool(tids,QZ);if(k==="d"&&QZ.z)pool=pool.concat(ZADANIA.filter(z=>z.dz===id&&!z.topic).map(z=>({k:"task",z})));pool=shuffle(pool);if(QZ.n)pool=pool.slice(0,QZ.n);
 begin(pool,"Quiz: "+(k==="t"?tName(id):(DZIALY.find(d=>d.id===id)||{}).name))};
function vQuizDz(did){const d=DZIALY.find(x=>x.id===did);if(!d||!d.ready)return vTematy();
 const tids=TEMATY.filter(t=>t.dzial===did).map(t=>t.id);
 return `<button class="back" data-on="location.hash='tematy'">‹ Tematy</button><p class="small muted">Quiz z całego działu</p><h2>${esc(d.name)}</h2><p class="small muted" style="margin:6px 0 14px">Tematy: ${tids.map(tName).map(esc).join(", ")}</p>${quizPanel(tids,"d:"+did)}`}

/* ---------- moje notatki do zadań ---------- */
const noteTxt=id=>(S.notes[id]&&S.notes[id].t)||"";
function noteBox(id){const t=noteTxt(id);return `<details class="panel" ${t?"open":""}><summary style="font-weight:700;cursor:pointer;min-height:28px">📝 Moja notatka${t?"":" – dodaj"}</summary><textarea data-note="${id}" style="margin-top:10px;min-height:110px" placeholder="Np. na czym się pomyliłam, co zapamiętać, skrót do kartki przed maturą">${esc(t)}</textarea><p class="small muted" id="ns-${id}">${t?"Zapisano.":"Zapisuje się automatycznie."}</p></details>`}
let noteT=null;
document.addEventListener("input",e=>{const el=e.target.closest("[data-note]");if(!el)return;const id=el.getAttribute("data-note");
 S.notes[id]={t:el.value.trim()?el.value:"",at:Date.now()};const s=document.getElementById("ns-"+id);if(s)s.textContent="Zapisywanie…";
 clearTimeout(noteT);noteT=setTimeout(()=>{save();const s2=document.getElementById("ns-"+id);if(s2)s2.textContent="Zapisano."},500)});

/* ---------- film YouTube (PowelToJa) ---------- */
const VID="EB2csHpGJAU";
const CH=[["Chemizm życia",0,"d1"],["Komórka",3345,"d2"],["Metabolizm",5786,"d3"],["Podziały komórkowe",8119,"d2"],["Bakterie, pierwotniaki, filogenetyka",9719,"d6"],["Botanika",12146,"d6"],["Zoologia",17045,"d6"],["Fizjologia zwierząt i człowieka",18737,"d4"],["Genetyka i wirusy",28190,"d5"],["Ewolucjonizm",31863,"d7"],["Ekologia",32977,"d7"]];
const VEND=34392;
const hms=s=>{const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(x).padStart(2,"0")};
const yt=s=>`https://youtu.be/${VID}?t=${s}`;
const ytE=(s,e)=>`https://www.youtube.com/embed/${VID}?autoplay=1&playsinline=1&rel=0&start=${s}${e?"&end="+e:""}`;
window.openVid=(s,e)=>{const c=CH.slice().reverse().find(x=>x[1]<=s);$("#vbc").textContent=(c?c[0]+" · ":"")+"od "+hms(s);$("#vbo").href=yt(s);$("#vbi").src=ytE(s,e);$("#vb").classList.add("on");document.body.style.overflow="hidden"};
window.closeVid=()=>{if(!$("#vb").classList.contains("on"))return;$("#vb").classList.remove("on");$("#vbi").removeAttribute("src");document.body.style.overflow=""};
document.addEventListener("click",e=>{const a=e.target.closest("a[data-vid]");if(!a)return;e.preventDefault();const [s,en]=a.dataset.vid.split(",").map(Number);openVid(s,en)});
const chOf=did=>CH.map((c,i)=>({n:c[0],s:c[1],e:(CH[i+1]||[0,VEND])[1],d:c[2]})).filter(c=>c.d===did);
const ytBtn=(c,cls)=>`<a class="btn ${cls||"ghost"}" data-vid="${c.s},${c.e}" href="${yt(c.s)}" style="justify-content:flex-start;text-align:left"><span>▶</span><span style="flex:1">${esc(c.n)}<br><span class="small muted" style="font-weight:500">od ${hms(c.s)} · ok. ${Math.round((c.e-c.s)/60)} min</span></span></a>`;
const parseT=v=>{const p=String(v).trim().split(":").map(Number);if(!p.length||p.some(isNaN))return null;let s=0;for(const x of p)s=s*60+x;return s};
const myT=tid=>{const n=S.notes["vid_"+tid];return n&&n.t?parseT(n.t):null};
window.setVid=tid=>{const el=document.getElementById("vt-"+tid);const v=el.value.trim();if(v&&parseT(v)==null){el.style.borderColor="var(--bad)";return}
 S.notes["vid_"+tid]={t:v,at:Date.now()};save();render()};
function vidPanel(tid,did){const ch=chOf(did),m=myT(tid),raw=(S.notes["vid_"+tid]||{}).t||"";
 return `<details class="panel"${m!=null?" open":""}><summary style="font-weight:700;cursor:pointer;min-height:28px">Film: wielka powtórka (PowelToJa)</summary><div class="stack" style="margin-top:10px">
 ${m!=null?`<a class="btn block" data-vid="${m}" href="${yt(m)}">▶ Ten temat – od ${hms(m)}</a>`:""}
 ${ch.length?ch.map(c=>ytBtn(c)).join(""):`<p class="small muted">W filmie nie ma osobnego rozdziału dla tego działu.</p>`}
 <div><p class="small muted">Twoja minuta dla tego tematu (np. 23:10 albo 1:05:30)</p><div class="row" style="margin-top:6px;flex-wrap:nowrap"><input id="vt-${tid}" inputmode="numeric" value="${esc(raw)}" placeholder="mm:ss" style="flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;background:var(--bg);color:var(--ink);min-height:50px"><button class="btn" data-on="setVid('${tid}')">Zapisz</button></div></div></div></details>`}

/* ---------- router ---------- */
function render(){
 const h=decodeURIComponent((location.hash||"#dzis").slice(1));let v="dzis",html;const p=h.split("/");
 document.body.classList.toggle("sess",p[0]==="sesja");
 if(p[0]==="t"){html=vTemat(p[1],p[2]);v="tematy"}
 else if(p[0]==="zad"){html=vZad(p[1]);v="tematy"}
 else if(p[0]==="sesja"){html=vSesja();v=""}
 else if(p[0]==="tematy"){html=vTematy();v="tematy"}
 else if(p[0]==="quiz"){html=vQuizDz(p[1]);v="tematy"}
 else if(p[0]==="dz"){html=vDz(p[1]);v="tematy"}
 else if(p[0]==="ark"){html=vArk(p[1]);v="tematy"}
 else if(p[0]==="postepy"){html=vPostepy();v="postepy"}
 else if(p[0]==="bledy"){html=vBledy();v="bledy"}
 else html=vDzis();
 $("#app").innerHTML=html;
 document.querySelectorAll("nav.tabs a").forEach(a=>{if(a.dataset.v===v)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
 const e=errCount();$("#bb").innerHTML=e?`<span class="badge">${e}</span>`:"";
}
window.addEventListener("hashchange",()=>{closeVid();if(!location.hash.startsWith("#zad/"))rv=null;if(!location.hash.startsWith("#sesja"))window.scrollTo(0,0);render()});
document.addEventListener("click",e=>{const el=e.target.closest("[data-on]");if(!el||el.disabled)return;const c=el.getAttribute("data-on");let m;
 if((m=c.match(/^location\.hash='(.*)'$/))){location.hash=m[1];return}
 if((m=c.match(/^(\w+)\((.*)\)$/))){const args=m[2]?m[2].split(",").map(x=>{x=x.trim();return /^'.*'$/.test(x)?x.slice(1,-1):Number(x)}):[];const f=window[m[1]];if(typeof f==="function")f(...args)}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeImg();closeVid()}
 if(!sess||sess.done||!location.hash.startsWith("#sesja"))return;const it=sess.items[sess.i];if(!it)return;
 if(it.k==="card"){if(!it.show&&(e.key===" "||e.key==="Enter")){e.preventDefault();flipC()}else if(it.show&&["1","2","3"].includes(e.key))gradeC(Number(e.key)-1)}
 else if(it.k==="quiz"&&it.opts&&it.chosen==null&&/^[1-4]$/.test(e.key)&&it.opts[e.key-1])ans(Number(e.key)-1)
 else if((it.k==="quiz"&&(it.chosen!=null||it.fin))&&e.key==="Enter")next()});
loadLocal();render();connect();loadPhotos();
if(IS_PWA){if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>
